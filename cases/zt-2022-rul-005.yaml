opmerking: "Definitieve vaststelling 2022 (11 augustus 2023): € 1.680 bij de door de inspecteur vastgestelde inkomens van € 16.513 (eiser) en € 12.264 (partner), gezamenlijk € 28.777. De tekst van 2022: 2 × € 1.749 − (4,225% × € 22.356 + 13,610% × € 6.421) = € 1.679,56 → € 1.680 (Awir art. 14 lid 4). € 710 teruggevorderd; de rechtbank: de Dienst volgt het inkomen van de inspecteur (Awir art. 7 lid 1) en hoeft de juistheid daarvan niet te onderzoeken. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
