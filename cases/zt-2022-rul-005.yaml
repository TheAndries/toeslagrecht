  publicatie: "Rechtbank Den Haag 20 juni 2024, ECLI:NL:RBDHA:2024:10408 (zaaknr. SGR 23/6791), citaten uit de uitspraak: 'Het inkomen van eiser is bepaald op € 16.513,- en dat van zijn van partner op € 12.264,-.' 'Op grond van deze gewijzigde inkomensgegevens, heeft verweerder de zorgtoeslag van eiser bij het primaire besluit van 11 augustus 2023 vastgesteld op € 1.680,-.'"
