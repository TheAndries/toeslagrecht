opmerking: "Herzien voorschot 2025 (22 januari 2025): nihil na een inkomenswijziging naar € 70.000, zonder partner (tekst 2025: inkomensgrens zonder partner € 39.719). Niet in geschil; het geschil ging over de terugvordering van het eerste maandbedrag (Awir art. 26a niet naar analogie toepasbaar). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
