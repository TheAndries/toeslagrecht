  publicatie: "Rechtbank Den Haag 24 april 2026, ECLI:NL:RBDHA:2026:9882 (zaaknr. 25/2227), citaten uit de uitspraak: 'Als gevolg van een inkomenswijziging van € 39.100,- naar € 70.000,- is het eerder aan eiser toegekende voorschot zorgtoeslag voor 2025 herzien van € 108,- naar € 0,-.' 'Omdat eiser geen recht meer heeft op een voorschot zorgtoeslag voor 2025 heeft verweerder dit voorschot teruggevorderd.' 'Tussen partijen is niet in geschil dat eiser geen recht meer heeft op een voorschot zorgtoeslag voor 2025.'"
