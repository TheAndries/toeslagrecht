opmerking: "Definitieve vaststelling 2016 (1 mei 2020): nihil. De Afdeling noemt het BRI-inkomen (€ 27.946), de grondslag sparen en beleggen (€ 249.562) en het voordeel uit sparen en beleggen (€ 9.982) en zegt dat de Dienst 'op basis hiervan' nihil vaststelde. De grondslag ligt boven de € 82.504 van Wzt art. 2a lid 1 (tekst 2016) — de zesde uitkomst van de Dienst op de vermogenstoets in het corpus — en het inkomen ligt boven de inkomensgrens zonder partner van de tekst 2016 (€ 27.013): de tekst geeft op elk van beide gronden nihil, zodat deze case niet onderscheidt welke grond de Dienst woog. De invoer is GERECONSTRUEERD zoals in zt-2015-rul-006: grondslag € 249.562 + heffingvrij vermogen 2016 € 24.437 (Wet IB 2001 art. 5.5) = € 273.999, zonder partner; dat er geen partner was, zegt de uitspraak niet, maar het voorschot van € 998 (21 september 2016) is het maximum zonder partner van de tekst 2016 (€ 997,74). Het voorschot zelf is geen case: zijn inkomen staat niet in de uitspraak. € 926 teruggevorderd, minder dan het voorschot van € 998; de uitspraak verklaart dat niet. De FSV-registratie en de inkomensvaststelling waren het geschil, niet de berekening. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
