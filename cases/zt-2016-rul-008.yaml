  publicatie: "ABRvS 2 augustus 2023, ECLI:NL:RVS:2023:2951 (zaaknr. 202207176/1/A2), citaten uit de uitspraak: 'Bij besluit van 21 september 2016 heeft de Belastingdienst/Toeslagen het voorschot zorgtoeslag van [appellant] over het toeslagjaar 2016 vastgesteld op € 998,00.' 'Op 9 april 2020 is aan de Belastingdienst/Toeslagen door de Basisregistratie inkomensgegevens gemeld dat het inkomen van [appellant] over 2016 € 27.946,00 bedraagt.' 'Daarnaast heeft [appellant] een grondslag van sparen en beleggen van € 249.562,00 en een voordeel uit sparen en beleggen van € 9.982,00.' 'Op basis hiervan heeft de Belastingdienst/Toeslagen bij besluit van 1 mei 2020 het recht van [appellant] op zorgtoeslag over 2016 definitief vastgesteld op nihil.'"
