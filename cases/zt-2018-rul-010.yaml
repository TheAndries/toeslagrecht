opmerking: "Een in Nederland verzekerde aanvrager ('een Nederlandse zorgverzekering') met een in Marokko wonende echtgenote die 'via het Centraal Administratiekantoor' is meeverzekerd (verdragsgerechtigd, Zvw art. 69); de uitspraak noemt geen toetsingsinkomen en noemt de woonlandfactor niet met een getal. Dezelfde situatie als zt-2017-rul-007 / zt-2018-rul-008 (ECLI:NL:RVS:2021:1071/1072, een andere appellant): DISCREPANCIES.md #16 (law); de encoding geeft voor deze partner vóór 06-11-2024 'undetermined' (Wzt art. 3 oud noemt hem niet). Verwacht is de definitieve berekening 2018 van 22 juli 2021, genomen naar aanleiding van ECLI:NL:RVS:2021:1071/1072: 'samen recht op een bedrag aan zorgtoeslag van € 94,00 per maand in 2018 (in totaal € 1.139,00)' — het maximum zonder partner van de tekst 2018 (€ 1.546 − 1,990% × € 20.450,88 = € 1.139,03 → € 1.139; via build.run_case nagerekend zonder partner), zoals de Afdeling het in mei 2021 had toegekend; € 94 = € 1.139 / 12 = € 94,92 naar beneden afgerond (#5). De Dienst volgde hier dus zelf de lijn van de Afdeling, twee maanden na die uitspraken en ruim drie jaar vóór de wetgever per 06-11-2024 (Stb. 2024, 291, art. 4a lid 3) de optelmethode vastlegde. '€ 590,00 meer dan bij de eerdere besluiten' wijst op een eerder definitief bedrag van € 549, dat de uitspraak niet noemt en dat niet is opgenomen. De case voert € 0 in; de uitkomst geldt bij elk gezamenlijk toetsingsinkomen tot het drempelinkomen als de Afdeling, zoals de wetgever veronderstelt (Kamerstukken II 2022/23, 36 357, nr. 3, noot 18), het gezamenlijke inkomen gebruikte."
