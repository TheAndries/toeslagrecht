id: zt-2023-rul-005
toeslag: zorgtoeslag
jaar: 2023
bron:
  type: ruling
  publicatie: "Rechtbank Midden-Nederland 10 oktober 2025, ECLI:NL:RBMNE:2025:5277 (zaaknr. UTR 25/1927), citaten uit de uitspraak: 'Dienst Toeslagen heeft na ontvangst van de opgaaf wereldinkomen van de inspecteur voor de inkomstenbelasting (inspecteur) bij beschikking van 1 november 2024 de definitief berekende zorgtoeslag over 2023 op nihil gesteld en het toegekende voorschot teruggevorderd.' 'Er bestaat geen aanspraak op zorgtoeslag indien de aanvrager gedurende het gehele berekeningsjaar dezelfde partner heeft en de rendementsgrondslag aan het begin van het berekeningsjaar 2023 meer bedraagt dan € 161.329,-.' 'De inspecteur heeft het vermogen van eiser en zijn echtgenoot op 1 januari 2023 vastgesteld op € 375.787,-.' 'Omdat dit vermogen de wettelijk vastgestelde grens overschrijdt, heeft Dienst Toeslagen terecht de zorgtoeslag op nihil gesteld.' 'Het gegeven dat eiser in het jaar 2023 uitsluitend een WIA-vervolguitkering van € 12.846,- heeft ontvangen, doet hier niet aan af, omdat het (gezamenlijke) vermogen de wettelijk vastgestelde grens overschrijdt.'"
