opmerking: "Definitieve berekening 2023 (1 november 2024): nihil omdat het vermogen van eiser en zijn echtgenoot op 1 januari 2023 door de inspecteur op € 375.787 is vastgesteld, boven de grens met partner van € 161.329 (Wzt art. 2a lid 1, tekst 2023; Stcrt. 2022, 28997) die de uitspraak zelf noemt — de grens van de Dienst is die van de tekst. Voor 2023 is de rendementsgrondslag zelf de maatstaf; invoer het genoemde bedrag. Het inkomen van eiser (een WIA-vervolguitkering van € 12.846) staat in de uitspraak, dat van de echtgenoot niet (ingevoerd € 0); de uitkomst hangt daar niet van af. 'Gedurende het gehele berekeningsjaar dezelfde partner' is gelezen uit de toepassing van de grens met partner door de Dienst; de uitspraak zegt het niet met zoveel woorden. De uitspraak noemt een 'opgaaf wereldinkomen', maar geen woonland; een woonlandfactor zou alleen de standaardpremie raken en niet de vermogenstoets. Het voorschot van 28 december 2022 (€ 2.658) noemt geen geschat inkomen en is geen case. De tiende uitkomst van de Dienst op de vermogenstoets in het corpus en de eerste voor 2023. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
