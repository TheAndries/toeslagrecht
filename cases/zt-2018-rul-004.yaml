opmerking: "Definitieve vaststelling 2018 (9 augustus 2019): nihil bij een toetsingsinkomen van € 58.936, zonder partner (de uitspraak rekent voor de zorgtoeslag met het eigen inkomen van appellante; het thuiswonende kind telt alleen voor de huurtoeslag mee als medebewoner). De tekst van 2018 geeft nihil boven € 28.720 zonder partner en boven € 35.996 met partner. Het voorschot van € 1.139 (22 januari 2018) is het maximum zonder partner van de tekst 2018 (€ 1.139,03), maar zijn geschatte inkomen staat niet in de uitspraak: geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
