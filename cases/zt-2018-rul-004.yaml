  publicatie: "ABRvS 7 december 2022, ECLI:NL:RVS:2022:3588 (zaaknr. 202106167/1/A2), citaten uit de uitspraak: 'Bij besluit van 22 januari 2018 heeft de Belastingdienst/Toeslagen de voorschotten zorgtoeslag, kindgebonden budget en huurtoeslag voor [appellante] over 2018 vastgesteld op respectievelijk € 1.139,00, € 5.543,00 en € 4.045,00.' 'Bij het besluit van 9 augustus 2019 heeft de Belastingdienst/Toeslagen de zorgtoeslag, het kindgebonden budget en de huurtoeslag voor [appellante] over 2018 opnieuw berekend en definitief vastgesteld op onderscheidenlijk € 0,00, € 2.945,00 en € 0,00.' 'De dienst heeft de bedragen van de zorgtoeslag en het kindgebonden budget gebaseerd op een toetsingsinkomen van [appellante] van € 58.936,00 en heeft het bedrag van de huurtoeslag gebaseerd op een gezamenlijk toetsingsinkomen van [appellante] en haar thuiswonende kind van in totaal € 76.729,00.'"
