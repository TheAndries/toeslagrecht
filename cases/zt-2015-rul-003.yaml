id: zt-2015-rul-003
toeslag: zorgtoeslag
jaar: 2015
bron:
  type: ruling
  publicatie: "Rechtbank Den Haag 16 maart 2018, ECLI:NL:RBDHA:2018:3299, feiten en overwegingen: 'Bij beschikking van 9 september 2016 is de zorgtoeslag voor het jaar 2015 definitief berekend op € 580.' 'Met dagtekening 28 juli 2017 is aan eiser een definitieve aanslag inkomstenbelasting en premies volksverzekeringen (IB/PVV) voor het jaar 2015 opgelegd naar een verzamelinkomen van € 27.104.' 'Vast staat dat bij een verzamelinkomen van € 27.104 voor het jaar 2015 geen recht bestaat op zorgtoeslag'"
