opmerking: "Herziene vaststelling 2015: nihil op een verzamelinkomen van € 27.104. De uitspraak noemt geen partner; zonder partner geeft de tekst van 2015 nihil (de grens is € 26.316; via build.run_case), met een verzekerde partner zou zij een bedrag geven, dus de uitkomst past alleen bij de lezing zonder partner. De eerdere € 580 rustte op een inkomen dat de uitspraak niet noemt; niet opgenomen. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
