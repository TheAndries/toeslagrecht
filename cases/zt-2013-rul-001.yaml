opmerking: "De eerste vaststelling 2013 van de Dienst (03-10-2014) op het gezamenlijke toetsingsinkomen zoals het toen vaststond: € 18.035 met toeslagpartner, onder het drempelinkomen 2013 (€ 19.043,424), dus het maximum met partner uit de tekst: 2 × € 1.478 − 4,695% × € 19.043,424 = € 2.956 − € 894,09 = € 2.061,91 → € 2.062 (Awir art. 14 lid 4). Het voorschot was hetzelfde bedrag. De verdeling over aanvrager en partner is niet gegeven en doet er niet toe (Wzt art. 2 lid 2); het hele bedrag staat bij de aanvrager. Dat de partner verzekerde was blijkt uit het bedrag (2 × standaardpremie). Beslist DISCREPANCIES.md #1 niet (onder het drempelinkomen). Zie rul-002 voor de herziening in dezelfde uitspraak. Wordt verified zodra een met naam genoemde mens de invoer met de uitspraak vergelijkt (CASES.md; ASKS.md 9)."
