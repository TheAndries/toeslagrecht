  publicatie: "ABRvS 15 maart 2017, ECLI:NL:RVS:2017:662 (zaaknr. 201603050/1/A2), r.o. 1: '[appellant] heeft over 2013 een voorschot zorgtoeslag ontvangen van € 2.062,00.' Bij besluit van 3 oktober 2014 heeft de Belastingdienst/Toeslagen 'de zorgtoeslag van [appellant] over 2013 vastgesteld op € 2.062,00', op 'een gezamenlijk toetsingsinkomen van [appellant] en zijn toeslagpartner van € 18.035,00'. Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:RVS:2017:662"
