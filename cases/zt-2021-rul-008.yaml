  publicatie: "Rechtbank Den Haag 10 december 2024, ECLI:NL:RBDHA:2024:23678 (zaaknr. 23/7085), procesverloop en r.o. 2: 'Met het primaire besluit van 14 juli 2023 heeft verweerder de zorg- en huurtoeslag over het jaar 2021 herzien en definitief berekend. De zorgtoeslag is vastgesteld op € 1.091 en de huurtoeslag op € 2.456. Daarbij is bepaald dat € 204 aan zorgtoeslag en € 1.599 aan huurtoeslag wordt teruggevorderd.' 'Wijlen [naam] haar jaarinkomen voor 2021 is vastgesteld op € 23.280. De definitief berekende zorgtoeslag wordt aangepast naar € 1.091.' Beroep ongegrond"
