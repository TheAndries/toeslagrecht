opmerking: "Herziene definitieve berekening 2021 van 14 juli 2023, € 1.091, op het door de inspecteur vastgestelde inkomen van € 23.280 (de rechtbank: de Dienst moet dat inkomensgegeven volgen). De tekst van 2021: € 1.705 − (1,915% × € 21.835,008 + 13,580% × (€ 23.280 − € 21.835,008)) = € 1.090,63 → € 1.091 (Awir art. 14 lid 4; via build.run_case). € 1.287 − € 1.091 = € 196; de uitspraak noemt € 204 teruggevorderd en verklaart dat verschil niet. Zonder partner, zie zt-2021-rul-007. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
