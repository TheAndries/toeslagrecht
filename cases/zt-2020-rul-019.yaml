opmerking: "Voorschot 2020 (27 december 2019): € 1.250 bij een geschat jaarinkomen van € 16.712, zonder partner ('eiseres', geen partner genoemd) — het maximum zonder partner van de tekst 2020 (€ 1.249,82). De definitieve berekening van dezelfde uitspraak: zt-2020-rul-020 (DISCREPANCIES.md #12). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
