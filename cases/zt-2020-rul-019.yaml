  type: ruling
  publicatie: "Rechtbank Amsterdam 23 maart 2023, ECLI:NL:RBAMS:2023:1604 (zaaknr. AMS 22/3980), citaten uit de uitspraak: 'Met een besluit van 27 december 2019 heeft eiseres voor het jaar 2020 voorschotten huur- en zorgtoeslag ontvangen.' 'Verweerder heeft aan eiseres een bedrag van € 1.250,- aan zorgtoeslag en een bedrag van € 3.798,- aan huurtoeslag toegekend.' 'Het voorschot huur- en zorgtoeslag is door verweerder berekend met een geschat jaarinkomen van € 16.712,-.'"
