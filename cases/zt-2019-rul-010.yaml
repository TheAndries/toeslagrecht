  publicatie: "Rechtbank Den Haag 24 januari 2022, ECLI:NL:RBDHA:2022:782 (zaaknr. 21/41 en 22/331), citaten uit de uitspraak: 'Bij BIP I zijn de huurtoeslag en de zorgtoeslag van eiseres over het berekeningsjaar 2019 definitief berekend op € 0 respectievelijk € 762.' 'Bij de berekening van de hoogte van de toeslagen is uitgegaan van een toetsingsinkomen van eiseres van € 24.100.' 'Bij beschikkingen van 31 december 2020 heeft verweerder, met inachtneming van de beslissingen op bezwaar, de definitief berekende huurtoeslag voor het berekeningsjaar 2019 herzien naar € 1.534 en de definitieve berekening zorgtoeslag gehandhaafd op € 762.'"
