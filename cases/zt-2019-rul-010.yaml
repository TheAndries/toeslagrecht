opmerking: "Definitieve berekening 2019 (gehandhaafd bij beschikking van 31 december 2020): € 762 bij een toetsingsinkomen van € 24.100, zonder partner ('eiseres', geen partner genoemd). De tekst van 2019: € 1.609 − (2,005% × € 20.940,768 + 13,520% × € 3.159,232) = € 762,01 → € 762 (Awir art. 14 lid 4). Later herzien op het lagere BRI-inkomen: zt-2019-rul-011. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
