opmerking: "Definitieve berekening 2014 zonder partner op het verzamelinkomen van de aanslag IB. Uit de tekst: normpremie = 2,410% × € 19.253,376 + 9,118% × (€ 22.518 − € 19.253,376) = € 464,01 + € 297,67 = € 761,67; € 1.329 − € 761,67 = € 567,33 → € 567 (Awir art. 14 lid 4). De uitspraak noemt geen partner; het bedrag bewijst éénmaal de standaardpremie (met partner: € 1.357). De uitzondering voor nabetalingen (Bht art. 2b) geldt alleen de huurtoeslag; de zorgtoeslag blijft op € 22.518 berekend en de Afdeling laat haar in stand. Het voorschot (geschat inkomen € 13.500) volgt uit € 567 + € 298 = € 865, het maximum uit de tekst — niet als case opgenomen, het bedrag staat niet zelf in de uitspraak. Zelfde hele bedrag met een afgerond drempelinkomen (DISCREPANCIES.md #1). Wordt verified zodra een met naam genoemde mens de invoer met de uitspraak vergelijkt (CASES.md; ASKS.md 9)."
