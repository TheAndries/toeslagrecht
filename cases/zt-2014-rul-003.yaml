  publicatie: "ABRvS 15 maart 2017, ECLI:NL:RVS:2017:659 (zaaknr. 201604395/1/A2), procesverloop en r.o. 1: 'Bij besluit van 3 juli 2015 heeft de Belastingdienst/Toeslagen de zorg- en huurtoeslag van [appellante] over 2014 definitief vastgesteld op onderscheidenlijk € 567,00 en nihil. Tevens is € 298,00 en € 3.272,00 aan te veel betaalde voorschotten zorg- en huurtoeslag teruggevorderd.'; 'de inspecteur [heeft] het verzamelinkomen van [appellante] in de aanslag inkomstenbelasting 2014 vastgesteld op € 22.518,00'. De Afdeling: een nabetaling van € 837,31 blijft voor de huurtoeslag op verzoek buiten beschouwing (Bht art. 2b), zodat het toetsingsinkomen voor de huurtoeslag € 21.680 is — zonder gevolg (de huurtoeslaggrens blijft overschreden); de rechtsgevolgen van het besluit blijven geheel in stand (dictum V). Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:RVS:2017:659"
