opmerking: "Voorschot zorgtoeslag 2021 van € 1.287 op een gemeld jaarinkomen van € 12.242, onder het drempelinkomen — het maximum zonder partner uit de tekst van 2021: € 1.705 − 1,915% × € 21.835,008 = € 1.286,86 → € 1.287 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner € 2.487). De definitieve berekening op nihil staat in zt-2021-rul-004. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
