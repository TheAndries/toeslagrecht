  publicatie: "Rechtbank Zeeland-West-Brabant 29 oktober 2024, ECLI:NL:RBZWB:2024:7431 (zaaknr. 23/3233 ZORG), feiten: 'Op 27 september 2020 is bij de Dienst Toeslagen het jaarinkomen van eiser gemeld (€ 12.242,- in het jaar 2021). Met het besluit van 28 december 2020 heeft de Dienst Toeslagen aan eiser voor het jaar 2021 een voorschot zorgtoeslag toegekend van € 1.287,-. Op 25 mei 2022 heeft de Dienst Toeslagen een melding ontvangen vanuit de Basisregistratie Inkomen (BRI) waaruit blijkt dat eiser een belastbaar inkomen heeft van € 44.615,- in het jaar 2021. De zorgtoeslag is vastgesteld op € 0,-. Omdat eiser wel een voorschot van € 1.287,- heeft ontvangen, moet hij een bedrag van € 1.299,- (inclusief rente) terugbetalen.' Beroep ongegrond"
