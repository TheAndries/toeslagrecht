opmerking: "Voorschot 2020 van eiseres, toegekend voordat het partnerschap bekend was: € 1.250 bij een geschat toetsingsinkomen van € 19.100, zonder partner — het maximum zonder partner van de tekst 2020 (€ 1.249,82). Eiser kreeg afzonderlijk eveneens € 1.250; zijn geschatte inkomen is in de gepubliceerde tekst afgebroken en niet opgenomen. Het herziene voorschot met partner: zt-2020-rul-016. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
