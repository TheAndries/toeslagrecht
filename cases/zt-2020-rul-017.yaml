  publicatie: "Rechtbank Midden-Nederland 15 december 2021, ECLI:NL:RBMNE:2021:6118 (zaaknr. UTR - 21/2520 en UTR - 21/2521), citaten uit de uitspraak: 'Voor het jaar 2020 heeft verweerder aan eisers ieder afzonderlijk een voorschot zorgtoeslag verleend van € 1.250,-.' 'Daarbij is verweerder uitgegaan van een geschat toetsingsinkomen van eiseres van € 19.100,- en van eiser van'"
