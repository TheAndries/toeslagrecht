  publicatie: "Rechtbank Den Haag 5 november 2024, ECLI:NL:RBDHA:2024:23394 (zaaknr. SGR 23/7402), citaten uit de uitspraak: 'Vervolgens heeft eiser op 21 april 2022 aangegeven dat zijn jaarinkomen wijzigt naar € 22.859.' 'Deze wijziging heeft geleid tot een herziene voorschotbeschikking voor het jaar 2022 met dagtekening van 24 mei 2022, waarin het voorschot zorgtoeslag is gewijzigd naar € 1.267 en het voorschot huurtoeslag naar € 2.048.'"
