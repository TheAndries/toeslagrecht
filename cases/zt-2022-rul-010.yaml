opmerking: "Herzien voorschot 2022 (24 mei 2022): € 1.267 bij een door eiser opgegeven jaarinkomen van € 22.859, zonder partner. De tekst van 2022: € 1.749 − (1,848% × € 22.356 + 13,610% × € 503) = € 1.749 − € 481,60 = € 1.267,40 → € 1.267 (Awir art. 14 lid 4). Reeks van dezelfde uitspraak: zt-2022-rul-009..012. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
