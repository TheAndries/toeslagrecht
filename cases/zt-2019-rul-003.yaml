  publicatie: "ABRvS 17 augustus 2022, ECLI:NL:RVS:2022:2396 (zaaknr. 202106083/1/A2), r.o. 1: 'Bij besluit van 27 december 2018 heeft de Belastingdienst/Toeslagen het voorschot op de zorgtoeslag van [appellant] voor 2019 berekend op € 0,00. Op 25 oktober 2019 geeft [appellant] door dat zijn geschatte inkomen over 2019 € 5.063,00 bedraagt. Bij besluit van 21 november 2019 heeft de Belastingdienst/Toeslagen het voorschot op de zorgtoeslag voor 2019 berekend op € 2.314,00.'"
