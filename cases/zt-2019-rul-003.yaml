opmerking: "Voorschot 2019 op een geschat inkomen van € 5.063, onder het drempelinkomen (€ 20.940,768), dus het maximum. De uitspraak noemt geen partner; het bedrag bewijst er een: € 2.314 is het maximum MET partner uit de tekst van 2019 (normpremie 4,315% × € 20.940,768 = € 903,59; 2 × € 1.609 − € 903,59 = € 2.314,41 → € 2.314, Awir art. 14 lid 4; via build.run_case), terwijl het maximum zonder partner € 1.189 is (€ 1.609 − 2,005% × € 20.940,768 = € 1.189,14; vgl. het voorschot in ECLI:NL:RVS:2023:3385). Hetzelfde maximum met partner staat als voorschot in zt-2019-rul-001 (€ 2.314 op € 13.314). Het later definitief op nihil berekenen wegens het vermogen staat in zt-2019-rul-004. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
