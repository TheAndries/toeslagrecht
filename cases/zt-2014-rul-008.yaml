opmerking: "Definitieve berekening 2014 (20 augustus 2015): € 82 bij een vastgesteld toetsingsinkomen van € 27.840, zonder partner (met partner zou de tekst € 872 geven; de uitspraak noemt geen partner). De tekst van 2014 geeft € 82,07 → € 82 (normpremie 2,41% × € 19.253,376 + 9,118% × € 8.586,62 = € 1.246,93; € 1.329 − € 1.246,93; via build.run_case). Het voorschot op het geschatte € 16.052 staat niet als bedrag in de uitspraak, dus geen case; een nabetaling van de vroegere werkgever telde mee in het toetsingsinkomen (in hoger beroep alleen de huurtoeslag in geschil). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
