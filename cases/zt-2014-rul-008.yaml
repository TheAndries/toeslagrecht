  publicatie: "ABRvS 31 januari 2018, ECLI:NL:RVS:2018:317 (zaaknr. 201703168/1/A2), r.o. 1: '[appellant sub 2] heeft in 2014 voorschotten zorg- en huurtoeslag ontvangen. ... De hoogte van de voorschotten in dat besluit is gebaseerd op een geschat toetsingsinkomen van [appellant sub 2] over 2014 van € 16.052,00. Bij het besluit van 20 augustus 2015 heeft de Belastingdienst/Toeslagen de zorg- en huurtoeslag van [appellant sub 2] definitief vastgesteld op respectievelijk € 82,00 en nihil. Dit besluit is gebaseerd op een vastgesteld toetsingsinkomen van € 27.840,00.'"
