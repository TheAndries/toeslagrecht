  publicatie: "Rechtbank Rotterdam 9 juni 2026, ECLI:NL:RBROT:2026:7307 (zaaknr. ROT 25/8409), citaten uit de uitspraak: 'Bij de aanvraag voor zorgtoeslag heeft eiser zijn inkomen in 2024 geschat op € 30.000,- en dat van zijn echtgenote op € 30.000,- negatief.' 'Met het besluit van 4 juli 2025 heeft de Dienst Toeslagen de hoogte van het recht op zorgtoeslag voor het jaar 2024 vastgesteld op € 0,-, waardoor eiser € 2.833,- moet terugbetalen.'"
