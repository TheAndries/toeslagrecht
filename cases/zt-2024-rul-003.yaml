opmerking: "Voorschot 2024: € 2.833, waarbij eiser zijn inkomen op € 30.000 schatte en dat van zijn echtgenote op € 30.000 negatief — gezamenlijk € 0. Het bedrag van het voorschot staat in de uitspraak als het teruggevorderde bedrag na de vaststelling op nihil (€ 2.833) en is gelijk aan het maximum met partner van de tekst van 2024: 2 × € 1.987 − 4,256% × € 26.819,424 = € 3.974 − € 1.141,43 = € 2.832,57 → € 2.833 (Awir art. 14 lid 4), hetzelfde bedrag als zt-2024-rul-002. Het eerste negatieve partnerinkomen in het corpus; de encoding telt beide inkomens op (Awir art. 7 lid 1) en komt onder het drempelinkomen uit. De definitieve berekening: zt-2024-rul-004. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
