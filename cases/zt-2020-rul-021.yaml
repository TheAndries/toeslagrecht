opmerking: "Definitieve vaststelling 2020: nihil bij een gezamenlijk toetsingsinkomen van € 21.153 (eiseres) + € 38.244 (echtgenoot, met een UWV-nabetaling van € 37.439 over 2016–2020 in het jaar van betaling), samen € 59.391 (tekst 2020: inkomensgrens met partner € 38.945). Het voorschot (€ 2.356, teruggevorderd als € 2.360) heeft geen genoemd inkomen en is geen case. Zusterzaak van de echtgenoot: ECLI:NL:RBNHO:2025:6620 (kindgebonden budget). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
