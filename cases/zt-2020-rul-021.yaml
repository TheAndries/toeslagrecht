  type: ruling
  publicatie: "Rechtbank Noord-Holland 17 juni 2025, ECLI:NL:RBNHO:2025:6621 (zaaknr. ALK 23/730 en ALK 23/731), citaten uit de uitspraak: 'Bij wijze van voorschot is aan eiseres voor het jaar 2020 zorgtoeslag toegekend van € 2.356 en huurtoeslag toegekend van € 4.116.' 'Verweerder heeft de huur- en zorgtoeslag van eiseres over 2020 vastgesteld op nihil, uitgaande van een gezamenlijk (toetsings-)inkomen dat bestaat uit de som van het inkomen van eiseres (€ 21.153) en het inkomen van de echtgenoot van eiseres (€ 38.244, samen is dat € 59.391).' 'In deze beslissingen is tevens bepaald dat eiseres de bij wijze van voorschot toegekende bedragen aan zorgtoeslag (€ 2.360) en huurtoeslag (€ 4.166) moet terugbetalen.'"
