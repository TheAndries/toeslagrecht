opmerking: "Een in Nederland wonende verzekerde met een in Marokko wonende verdragsgerechtigde partner (Zvw art. 69; woonlandfactor Marokko 0,0125). De uitspraak noemt geen toetsingsinkomen; de door de Dienst toegepaste normpremie met partner (€ 1.016,51) is het normpercentage over het drempelinkomen alleen, zodat het gezamenlijke toetsingsinkomen niet boven het drempelinkomen lag; de case voert € 0 in — elk inkomen tot het drempelinkomen geeft dezelfde uitkomst. Verwacht is het bedrag van de Dienst: € 1.530 + € 1.530 × 0,0125 − normpremie = € 532,62 → € 533 (Awir art. 14 lid 4; via build.run_case nagerekend met partner_verdragsgerechtigd en woonland MA: de encoding geeft voor dit geval 'undetermined', omdat Wzt art. 3 (tekst 2017) de partner van een verdragsgerechtigde regelt en niet de verdragsgerechtigde partner van een verzekerde; het huidige art. 4a lid 3 is ingevoegd per 06-11-2024). De Afdeling kwam tot een andere uitkomst dan de Dienst én dan de tekst zoals de Dienst die leest: op grond van de memorie van toelichting (Kamerstukken II 2006/07, 30 918, nr. 3) heeft de verzekerde zelf recht op het maximum zonder partner, € 88 per maand, en de partner afzonderlijk een aanspraak met de woonlandfactor. Het Handboek Toeslagen (hoofdstuk 21 §1.6.5) zegt daarover dat de wetgever (Kamerstukken II 2022/23, 36 357, nr. 3, blz. 20) heeft aangegeven dat het wetsartikel dat die passage toelichtte nooit in werking is getreden en dat art. 4a per 06-11-2024 is verduidelijkt zonder de berekening te wijzigen. Drie lezingen van één tekst: DISCREPANCIES.md #16 (law). De normpremie van de Dienst, € 1.016,51 = 5,055% × € 20.109: het drempelinkomen 2017 (tekst € 20.108,736) naar boven afgerond (DISCREPANCIES.md #1; de tekst geeft € 1.016,50 en € 532,63 → eveneens € 533). Het door de Afdeling aangehaalde maximum zonder partner 2017, € 88 per maand, is € 1.066 / 12 = € 88,83 naar beneden afgerond (#5): het eerste maandcijfer van de Dienst voor 2017 in het corpus. Eerste aanleg: Rechtbank Amsterdam 27 augustus 2019, ECLI:NL:RBAMS:2019:6265 (gelezen 2026-11-03): 'Met het besluit van 31 december 2018 (het primaire besluit II) heeft verweerder het recht van eiser op zorgtoeslag voor het jaar 2017 definitief berekend en vastgesteld op € 533,-'; de rekenwijze zelf was daar niet in geschil. De wetgever over deze situatie, gelezen 2026-11-03 in Kamerstukken II 2022/23, 36 357, nr. 3 (artikel XIX onderdelen B en C): de formule van de Dienst is de systematiek van de wet, het door de Afdeling gelezen artikel is nooit in werking getreden; zie DISCREPANCIES.md #16, aanvulling 2026-11-03."
