  publicatie: "ABRvS 9 oktober 2024, ECLI:NL:RVS:2024:4094 (zaaknr. 202400646/1/A2), r.o. 1: 'Op 15 september 2022 heeft [appellant] aan de Belastingdienst/Toeslagen doorgegeven dat zijn geschatte toetsingsinkomen over 2022 € 47.000,- bedraagt. [appellant] heeft daarbij naar eigen zeggen rekening gehouden met een nabetaling van het UWV van bruto € 31.102,13. De dienst heeft op basis van dit geschatte toetsingsinkomen bij het besluit van 21 oktober 2022 het voorschot zorgtoeslag over 2022 herzien en vastgesteld op nihil'. Het beroep tegen de terugvordering van € 1.112 (Rechtbank Noord-Nederland 21 december 2023, ECLI:NL:RBNNE:2023:5325) en het hoger beroep zijn ongegrond: de nabetaling telt als inkomen van 2022"
