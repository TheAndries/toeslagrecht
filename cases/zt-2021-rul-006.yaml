opmerking: "Voorschot zorgtoeslag 2021 van € 1.289 op een geschat inkomen van € 14.766, onder het drempelinkomen. De tekst van 2021 geeft zonder partner het maximum € 1.705 − 1,915% × € 21.835,008 = € 1.286,86 → € 1.287 (Awir art. 14 lid 4; via build.run_case), twee euro minder dan de Dienst. Met een verzekerde partner zou het € 2.487 zijn, dus een partner verklaart het verschil niet. De uitspraak noemt het bedrag één keer, als voorschot 'over het jaar 2021 ontvangen', en zegt niet wanneer het is toegekend of op welke parameters het rustte. Vier andere voorschotten 2021 in het corpus op een inkomen onder het drempelinkomen zijn wél € 1.287 (zt-2021-rul-001, -003, en de voorschotten van 28 december 2020 in ECLI:NL:RBDHA:2024:23678 en ECLI:NL:RBNHO:2024:3591, nog niet als case opgenomen). Gelogd als DISCREPANCIES.md #11, status open; de case houdt het bedrag van de uitspraak, de encoding het bedrag van de tekst. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
