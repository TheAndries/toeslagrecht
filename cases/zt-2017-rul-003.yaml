opmerking: "Definitieve berekening 2017 (19 juli 2019): nihil voor een verdragsgerechtigde (Zvw art. 69) in Duitsland bij een toetsingsinkomen van € 26.121, met toepassing van de woonlandfactor. De tekst van 2017 geeft hetzelfde, maar langs een smalle weg: standaardpremie € 1.530 × woonlandfactor Duitsland 0,8372 (Wzt art. 3 lid 1–2, tekst 2017; Regeling zorgverzekering bijlage 4, Stcrt. 2016, 61016) = € 1.280,92; normpremie 2,305% × € 20.108,736 + 13,46% × € 6.012,26 = € 1.272,76 (art. 2 lid 3); aanspraak € 8,16 → afgerond € 8 (Awir art. 14 lid 4) → minder dan € 24, dus niet toegekend (Awir art. 14 lid 5) — via build.run_case. Na zt-2013-rul-008 de tweede beslissing in het corpus die het minimum van € 24 beslist, en de eerste in combinatie met een woonlandfactor. Met de voor de verdragsbijdrage teruggezette factor 0,7532 (Stcrt. 2019, 58198 art. II, 'zonder effect op de zorgtoeslag') zou de aanspraak negatief zijn: nihil onder beide factoren. Zonder woonlandfactor zou de tekst € 257 geven: de factor verklaart de nihil, niet het inkomen. De uitspraak noemt geen partner; met een verdragsgerechtigde partner zou de tekst € 985 geven, dus de case leest 'zonder partner' en de verifieerder toetst die lezing. Het voorschot op het geschatte € 23.170 is zonder factor berekend (r.o. 9); zijn bedrag staat niet in de uitspraak (€ 681 teruggevorderd 'inclusief rente'), dus geen case. Eerste uitkomst van de Dienst in het corpus met de Duitse factor op een genoemd inkomen. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
