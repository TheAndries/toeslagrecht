  publicatie: "Rechtbank Midden-Nederland 29 september 2020, ECLI:NL:RBMNE:2020:4351 (zaaknrs. UTR 19/5139 en 19/5285), procesverloop en r.o. 6, 9: '[eiser], te [woonplaats], Duitsland'; 'Bij besluit van 19 juli 2019 (het primaire besluit II) heeft verweerder het recht op zorgtoeslag van eiser voor het jaar 2017 definitief vastgesteld op nihil (€ 0,-) en het te veel uitbetaalde voorschot, inclusief rente, van € 681,- teruggevorderd.' 'Verweerder heeft terecht aan de hand van het door eiser geschatte toetsingsinkomen van € 23.170,- het voorschot zorgtoeslag voor 2017 berekend. ... De rechtbank stelt vast dat de inspecteur van de belastingdienst het verzamelinkomen 2017 van eiser heeft vastgesteld op € 26.121,-. Voor de definitieve berekening over 2017 is verweerder terecht uitgegaan van dit toetsingsinkomen.' 'De rechtbank is van oordeel dat verweerder terecht pas bij de definitieve berekening van zorgtoeslag over 2017 rekening heeft gehouden met de woonlandfactor. Vaststaat dat verweerder op 6 april 2018 de melding van het CAK heeft ontvangen dat eiser met ingang van 3 april 2011 zorgverzekerd is op grond van artikel 69 van de Zorgverzekeringswet.' Beroep ongegrond"
