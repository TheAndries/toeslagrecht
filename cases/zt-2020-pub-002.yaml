opmerking: "De Toeslagenkaart 2020 is de eerste publicatie van de Dienst Toeslagen voor 2020 in het corpus (de brochure Berekening zorgtoeslag 2020 is niet gevonden, SOURCES.md §3). Eén euro boven de gepubliceerde grens zonder partner: tekst € 23,36 → € 23 → niet toegekend (Awir art. 14 lid 4–5); met het afgeronde drempelinkomen € 23,41 → € 23 → eveneens niet toegekend. Beide methoden geven nihil."
