opmerking: "Voorschot 2020: € 1.250 bij een geschat toetsingsinkomen van − € 2.380, zonder partner ('eiser', geen partner genoemd). Het eerste negatieve toetsingsinkomen in het corpus. De tekst van 2020: het inkomen ligt onder het drempelinkomen van € 21.430,656, dus de normpremie is 1,830% × € 21.430,656 = € 392,18 (Wzt art. 2 lid 3, tekst 2020) en de aanspraak € 1.642 − € 392,18 = € 1.249,82 → € 1.250 (Awir art. 14 lid 4): het maximum zonder partner, dat de encoding ook bij een negatief inkomen geeft. De definitieve berekening en de herziening van dezelfde uitspraak: zt-2020-rul-024/-025. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
