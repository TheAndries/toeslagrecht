opmerking: "Voorschot 2019 (27 december 2018): € 1.189 bij een geschat toetsingsinkomen van € 2.267, zonder partner — het maximum zonder partner van de tekst 2019 (€ 1.189,14). De twee latere bedragen van dezelfde uitspraak zijn geen case: het voorschot van € 2.033 en de definitieve berekening van € 1.069 rekenen met een toeslagpartner vanaf 1 april 2019 (Awir art. 5, wijziging in het jaar, niet gecodeerd). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
