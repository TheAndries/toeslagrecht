opmerking: "Eerste uitkomst van de Dienst voor 2017 in het corpus: definitieve vaststelling op nihil wegens een te hoog gezamenlijk toetsingsinkomen. De uitspraak noemt het verzamelinkomen van de aanvrager (€ 35.358); het inkomen van de partner noemt zij niet en is op 0 gezet. Voor de uitkomst maakt dat niet uit: de tekst van 2017 geeft met partner al nihil bij € 35.358 (zie de grens in zt-2017-syn-026/-027), en elk hoger gezamenlijk inkomen ook. Dezelfde uitspraak geeft 2016: zt-2016-rul-002. Eerste aanleg (gelezen 2026-10-30): Rechtbank Rotterdam 7 april 2022, ECLI:NL:RBROT:2022:2503 noemt wél het inkomen van de toeslagpartner — € 10.044 (2016) en € 10.191 (2017), gezamenlijk € 45.132 en € 45.549 — en citeert de Dienst: 'Het maximale inkomen voor aanspraak op zorgtoeslag is voor een aanvrager met een toeslagpartner vastgesteld op € 33.764,-' (2016; zie DISCREPANCIES.md #1) en voor 2017 '€ 32.358'. De invoer hier (partner € 0) blijft staan: de uitkomst is nihil onder beide lezingen; € 1.080 (2016) en € 1.147 (2017) teruggevorderd. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
