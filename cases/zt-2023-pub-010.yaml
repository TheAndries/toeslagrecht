opmerking: "Maximum met toeslagpartner 2023: de tekst geeft € 3182 per jaar (Awir art. 14 lid 4); € 3182 / 12 = € 265.17, door de Dienst gepubliceerd als € 265 per maand — naar beneden afgerond. Inkomen € 10.000 bij de aanvrager, partner € 0, onder het drempelinkomen."
