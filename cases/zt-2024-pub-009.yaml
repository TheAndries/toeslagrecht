opmerking: "Maximum zonder partner 2024: de tekst geeft € 1483 per jaar (Awir art. 14 lid 4); € 1483 / 12 = € 123.58, door de Dienst gepubliceerd als € 123 per maand — naar beneden afgerond. Het maandbedrag staat niet in de wet (SOURCES.md open item 1); de encoding modelleert de praktijk van de Dienst (DISCREPANCIES.md #5). Inkomen hier € 10.000, onder het drempelinkomen; elk inkomen tot het drempelinkomen geeft hetzelfde."
