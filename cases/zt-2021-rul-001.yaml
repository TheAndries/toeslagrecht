  publicatie: "Rechtbank Den Haag 1 december 2023, ECLI:NL:RBDHA:2023:19139 (zaaknr. 23/3134), r.o. 3: 'Voor 2021 heeft eiser een voorschot op zijn zorgtoeslag ontvangen van € 1.287,-. Dit voorschot is gebaseerd op een draagkrachtberekening die uitging van een toetsingsinkomen van € 9.439,-.' Bevestigd in hoger beroep: ABRvS 20 november 2024, ECLI:NL:RVS:2024:4751 (zaaknr. 202307817/1/A2)"
