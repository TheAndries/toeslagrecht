opmerking: "EERSTE uitkomst van de Dienst voor 2021 met inkomen in het corpus (2021 had tot nu alleen de vier synthetische grensgevallen, zt-2021-syn-004..007): een voorschot zorgtoeslag 2021 van € 1.287 op een toetsingsinkomen van € 9.439, onder het drempelinkomen — het maximum zonder partner uit de tekst van 2021: € 1.705 − 1,915% × € 21.835,008 = € 1.286,86 → € 1.287 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner zou het € 2.487 zijn). De definitieve vaststelling van hetzelfde jaar staat in zt-2021-rul-002 (uit de uitspraak van de Afdeling). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
