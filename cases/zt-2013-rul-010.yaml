opmerking: "Herziene definitieve berekening 2013 (16 maart 2018): nihil omdat de grondslag sparen en beleggen van eiseres over 2013 volgens de BRI € 262.876 bedroeg, boven de grens van € 80.000 (Wzt art. 2a lid 1, tekst 2013, Stb. 2012, 204) die de uitspraak zelf noemt — de grens van de Dienst is die van de tekst. De uitspraak noemt de grondslag ná het heffingvrije vermogen; de encoding wil voor 2013 de rendementsgrondslag en trekt het heffingvrije vermogen 2013 (€ 21.139, Wet IB 2001 art. 5.5) zelf af, dus de invoer is gereconstrueerd als € 262.876 + € 21.139 = € 284.015 (zonder partner gelezen: 'eiseres', geen partner genoemd). De uitkomst hangt niet van die reconstructie af: elke grondslag boven € 80.000 geeft nihil. Het inkomen staat niet in de uitspraak; ingevoerd € 0, zonder gevolg voor de uitkomst. Het voorschot 2013 (bedrag niet genoemd) is geen case. De zesde uitkomst van de Dienst op de vermogenstoets in het corpus en de tweede voor 2013. Het jaar 2018 van dezelfde uitspraak: zt-2018-rul-007. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
