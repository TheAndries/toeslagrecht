  publicatie: "Rechtbank Limburg 24 februari 2022, ECLI:NL:RBLIM:2022:1586 (zaaknr. ROE 21/243), citaten uit de uitspraak: 'Bij besluit van 6 november 2020 (het primaire besluit) heeft verweerder de zorgtoeslag van eiser over het jaar 2019 definitief berekend op een bedrag van € 1.770,- en de teveel betaalde zorgtoeslag ten bedrage van € 544,- (exclusief € 2,- rente) van eiser teruggevorderd.' 'Verweerder heeft de zorgtoeslag berekend op basis van een toetsingsinkomen in 2019 van € 24.971,-.' 'Verweerder stelt zich in het verweerschrift van 9 juni 2021 op het standpunt dat het recht op zorgtoeslag terecht is gebaseerd op de in de Basisregistratie Inkomen (Bri) vastgelegde inkomensgegevens van eiser en zijn toeslagpartner in 2019 van in totaal € 24.971.'"
