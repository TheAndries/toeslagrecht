opmerking: "Definitieve berekening 2019 (6 november 2020): € 1.770 bij een gezamenlijk toetsingsinkomen van eiser en zijn toeslagpartner van in totaal € 24.971 (BRI), waarin een nabetaling bijstand over 2018 meetelt. De tekst van 2019: 2 × € 1.609 − (4,315% × € 20.940,768 + 13,520% × € 4.030,232) = € 1.769,52 → € 1.770 (Awir art. 14 lid 4). Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0); de uitsplitsing staat niet in de uitspraak. De rechtbank liet de berekening staan en zag alleen van de terugvordering van € 544 af (bijzondere omstandigheden); dat raakt de tegemoetkoming niet. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
