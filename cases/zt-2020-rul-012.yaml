  publicatie: "Rechtbank Oost-Brabant 20 maart 2025, ECLI:NL:RBOBR:2025:1536 (zaaknr. 24/71), r.o. 4–5: 'op 26 mei 2021 bericht ontvangen vanuit de Basisregistratie Inkomen (BRI) dat het verzamelinkomen van eiseres is vastgesteld op € 20.286,- en dat van [naam] op € 25.185,-.' 'Hierbij is de zorgtoeslag van eiseres over 2020 definitief vastgesteld op € 0,- ... Deze definitieve vaststelling is gebaseerd op een gezamenlijk toetsingsinkomen van € 45.471,-.' Beroep gegrond (de terugvordering)"
