opmerking: "Definitieve vaststelling 2020 van 9 oktober 2021: nihil op een gezamenlijk toetsingsinkomen van € 20.286 + € 25.185 = € 45.471, met partner over heel 2020 (Awir art. 3 oud; de rechtbank: sinds 1 januari 2021, Stb. 2020, 518, ontstaat toeslagpartnerschap niet meer met terugwerkende kracht over het hele jaar, en zij matigde daarom de terugvordering op evenredigheid; de hoogte zelf stond niet ter discussie). De tekst van 2020 geeft nihil: de inkomensgrens met partner uit de tekst is € 38.945 (via build.run_case). Het teruggevorderde bedrag, € 1.805 inclusief € 19 rente, is het voorschot van zt-2020-rul-011 plus rente. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
