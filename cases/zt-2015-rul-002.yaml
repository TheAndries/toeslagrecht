  publicatie: "ABRvS 9 mei 2018, ECLI:NL:RVS:2018:1514, procesverloop en r.o. 2: 'Bij besluit van 11 november 2016 heeft de Belastingdienst/Toeslagen de huurtoeslag van [appellant] voor het jaar 2015 definitief vastgesteld op nihil en de zorgtoeslag van [appellant] over het jaar 2015 definitief vastgesteld op een bedrag van € 495,00.' 'De Belastingdienst/Toeslagen is bij de definitieve berekening van de zorgtoeslag voor het jaar 2015 terecht uitgegaan van het door de inspecteur van de Belastingdienst vastgestelde verzamelinkomen van [appellant] van € 22.797,00, aldus de rechtbank.'"
