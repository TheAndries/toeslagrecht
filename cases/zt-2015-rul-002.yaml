opmerking: "Definitieve vaststelling 2015 van 11 november 2016, € 495, op het verzamelinkomen van € 22.797. De tekst van 2015: € 1.408 − (2,395% × € 19.463,328 + 13,400% × (€ 22.797 − € 19.463,328)) = € 495,14 → € 495 (via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner zou het € 1.345 zijn). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
