  publicatie: "Rechtbank Noord-Holland 4 april 2024, ECLI:NL:RBNHO:2024:3591 (zaaknr. HAA 23/4258), procesverloop en r.o. 1–2: 'Bij beschikkingen met dagtekening 28 december 2020 is aan eiseres een voorschot huurtoeslag en een voorschot zorgtoeslag 2021 verleend van respectievelijk € 1.644 en € 1.221. Bij beschikking met dagtekening 21 oktober 2021 is het voorschot huurtoeslag en het voorschot zorgtoeslag 2021 herzien naar respectievelijk € 2.922 en € 1.287.' 'Eiseres heeft in het jaar 2021 geen toeslagpartner.' 'Eiseres heeft op 14 september 2021 voor het jaar 2021 een (geschat) toetsingsinkomen aan verweerder doorgegeven van € 18.500.' Beroep ongegrond"
