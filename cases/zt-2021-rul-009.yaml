opmerking: "Herzien voorschot 2021 van 21 oktober 2021, € 1.287, op het door de aanvrager op 14 september 2021 doorgegeven geschatte inkomen van € 18.500, onder het drempelinkomen. De tekst van 2021 geeft zonder partner het maximum € 1.286,86 → € 1.287 (via build.run_case). De uitspraak zegt uitdrukkelijk dat er in 2021 geen toeslagpartner was. Het eerdere voorschot van 28 december 2020, € 1.221, rustte op een inkomen dat de uitspraak niet noemt; niet opgenomen. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
