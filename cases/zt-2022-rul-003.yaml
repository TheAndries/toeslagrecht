opmerking: "Herziening van het voorschot 2022 naar nihil (17 mei 2023, gehandhaafd 10 juli 2023): geen zorgtoeslag voor een verdragsgerechtigd echtpaar in Polen. De tekst van 2022 geeft hetzelfde: standaardpremie 2 × € 1.749 × 0,1829 = € 639,78 (Wzt art. 3 lid 1–2, tekst 2022; Regeling zorgverzekering bijlage 4, Polen 0,1829), normpremie 4,225% × € 22.356 + 13,61% × € 77 = € 955,02 (art. 2 lid 3), aanspraak negatief, dus nihil (via build.run_case). De Dienst noemt € 640 en € 955: dezelfde bedragen, afgerond. De uitspraak noemt het inkomen 'zijn toetsingsinkomen', maar rekent met de percentages en de standaardpremie voor twee personen; de case voert € 22.433 in als gezamenlijk toetsingsinkomen (partner € 0). Zonder partner zou de uitkomst ook nihil zijn (€ 319,89 tegen € 423,62). Het drempelinkomen 2022 'vastgesteld op € 22.356' is precies 108% × 12 × € 1.725,00, dus hier geen afrondingsvraag (DISCREPANCIES.md #1). Eerste beslissing in het corpus waarin de Dienst een woonlandfactor op een genoemd inkomen toepast; de factor voor Polen 2022 in parameters/2022.yaml (Stcrt. 2021, 46565) is de factor die de Dienst toepaste. Voetnoot van de rechtbank, geciteerd zonder uitleg: 'Overigens heeft Dienst Toeslagen in de beslissing op bezwaar de normpremie op een onjuiste wijze berekend, door 4,256 % van het gehele toetsingsinkomen te nemen (in plaats van het drempelinkomen) en uit te komen op een normpremie van € 955.' Wordt 'verified' op dezelfde voet (ASKS.md 9)."
