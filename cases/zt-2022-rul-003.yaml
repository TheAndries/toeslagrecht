  publicatie: "Rechtbank Midden-Nederland 26 september 2024, ECLI:NL:RBMNE:2024:5552 (zaaknrs. UTR 23/4153 en UTR 24/4548), r.o. 11, 14–16: 'Eiser en zijn partner wonen in Polen en ontvangen pensioen uit Nederland. Zij zijn daardoor verdragsgerechtigde in de zin van artikel 69 van de Zorgverzekeringswet.' 'De standaardpremie is een vast bedrag en in 2022 voor twee personen vastgesteld op € 3.498. Daarop moet de woonlandfactor (0,1829) worden toegepast en dan resteert een bedrag van € 640.' 'In 2022 was zijn toetsingsinkomen € 22.433 en het drempelinkomen is in dat jaar vastgesteld op € 22.356. Over het drempelinkomen is bepaald dat 4,225 procent kan worden besteed aan zorgkosten en over het overschot (van € 77) is dat 13,61 procent. Dat betekent dat de normpremie van eiser in 2022 € 955 was.' 'De normpremie (€ 955) is dus hoger dan de standaardpremie (€ 640), waardoor eiser over 2022 geen recht heeft op (een voorschot op) zorgtoeslag.' Beroep ongegrond"
