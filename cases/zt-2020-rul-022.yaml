opmerking: "Herziene definitieve vaststelling 2020 (4 maart 2023): nihil bij een geregistreerd inkomen van € 18.316 en een geregistreerd vermogen van € 132.516 — de zevende uitkomst van de Dienst op de vermogenstoets in het corpus en de eerste waarvan de rendementsgrondslag zelf in de uitspraak staat, niet gereconstrueerd. De Dienst noemt de vermogensgrens 2020 '€ 116.613': dat is de grens van Wzt art. 2a lid 1 (tekst 2020) op de grondslag sparen en beleggen, € 85.767, plus het heffingvrije vermogen 2020 van € 30.846 (Wet IB 2001 art. 5.5) — precies de omrekening die de encoding maakt en die law/CHANGES.md voor 2020→2021 beschrijft. Zonder partner gelezen ('[appellant]', één keer heffingvrij vermogen in de grens van de Dienst); zonder het vermogen zou de tekst € 1.250 geven. € 1.333 teruggevorderd. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
