  publicatie: "ABRvS 8 augustus 2025, ECLI:NL:RVS:2025:3957 (zaaknr. 202405796/1/A2), citaten uit de uitspraak: 'Bij de berekening van de definitieve zorgtoeslag over 2020 heeft de Dienst Toeslagen betrokken dat uit gegevens van de Basisregistratie inkomen is gebleken dat [appellant] in 2020 een geregistreerd inkomen had van € 18.316,00, een geregistreerd vermogen van € 132.516,00 en een voordeel uit sparen en beleggen van € 3.800,00.' 'Omdat het vermogen hoger is dan de vermogensgrens van € 116.613,00, heeft de Dienst Toeslagen de zorgtoeslag op nihil vastgesteld.'"
