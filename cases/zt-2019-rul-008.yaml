opmerking: "Zorgtoeslag 2019 definitief op nihil gesteld op een geregistreerd inkomen van € 36.428 (door de uitspraak 'geschat jaarinkomen' genoemd; later door de inspecteur verlaagd tot € 18.214, zie zt-2019-rul-007). Zonder partner ligt € 36.428 boven de inkomensgrens van de tekst van 2019 (€ 29.562) → nihil. Dat er geen partner was, volgt uit het bedrag van € 1.189 op het gecorrigeerde inkomen (het maximum zonder partner); met een verzekerde partner zou de tekst bij € 36.428 nog € 221 geven. De uitspraak gaat over de vergoeding van bezwaarkosten, niet over de hoogte van de toeslag; de bedragen zijn de feiten die de rechtbank vaststelt. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
