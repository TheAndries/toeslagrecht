opmerking: "Maximum met toeslagpartner 2022: de tekst geeft € 2553 per jaar (Awir art. 14 lid 4); € 2553 / 12 = € 212.75, door de Dienst gepubliceerd als € 212 per maand — naar beneden afgerond. Inkomen € 10.000 bij de aanvrager, partner € 0, onder het drempelinkomen. De encoding geeft voor 2022 € 213: de brochure Berekening zorgtoeslag 2022 rondt in rekenvoorbeeld 2 het maandbedrag rekenkundig af (€ 44,89 → € 45, DISCREPANCIES.md #8) en daarop rust de jaarparameter maand_afronding_praktijk: rekenkundig; dit informatieblad van dezelfde Dienst voor hetzelfde jaar rondt € 212,75 naar beneden af. Twee publicaties, twee methoden: DISCREPANCIES.md #15."
