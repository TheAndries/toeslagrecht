opmerking: "Voorschot 2022: € 2.553 bij een geschat inkomen van € 20.876 voor eiser en zijn echtgenote — het maximum met partner van de tekst 2022 (€ 2.553,46), want het inkomen ligt onder het drempelinkomen van € 22.356. Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0). Het herziene voorschot van dezelfde uitspraak: zt-2022-rul-007 (DISCREPANCIES.md #13). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
