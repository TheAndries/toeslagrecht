  publicatie: "Rechtbank Noord-Nederland 27 februari 2024, ECLI:NL:RBNNE:2024:632 (zaaknr. LEE 23/961), r.o. 1.1 en 5: 'Verweerder heeft bij besluit van 9 juni 2022 de hoogte van de zorgtoeslag 2021 herzien op een bedrag van € 487,00.' 'Eiser heeft over het jaar 2021 een voorschot van € 1.289,00 aan zorgtoeslag ontvangen op basis van een geschat inkomen van € 14.766,00. Op 25 mei 2022 heeft verweerder vanuit de Basisregistratie Inkomensgegevens (BRI) een melding gekregen dat het inkomen van eiser voor het jaar 2021 € 27.725,00 bedraagt. Verweerder heeft op basis daarvan de eerder toegekende zorgtoeslag herzien op € 487,00.' (Een afgekocht klein pensioen telde mee.) Beroep ongegrond"
