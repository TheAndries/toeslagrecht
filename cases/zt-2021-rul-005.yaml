opmerking: "Herziene voorschotbeschikking 2021 van € 487 op een BRI-inkomen van € 27.725. De tekst van 2021 geeft zonder partner € 1.705 − (1,915% × € 21.835,008 + 13,580% × (€ 27.725 − € 21.835,008)) = € 486,9987 → € 487 (Awir art. 14 lid 4; via build.run_case) — op twee tienden van een cent van de afrondingsgrens, en de Dienst komt op hetzelfde hele bedrag. De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner zou het € 1.687 zijn). Het eerdere voorschot van hetzelfde jaar, € 1.289 op € 14.766, staat in zt-2021-rul-006 en wordt door de tekst NIET gereproduceerd (DISCREPANCIES.md #11). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
