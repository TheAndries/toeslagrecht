  type: ruling
  publicatie: "ABRvS 5 oktober 2016, ECLI:NL:RVS:2016:2600 (zaaknr. 201509080/1/A2 niet gecontroleerd; zie de deeplink), r.o. 1 en 2: 'Hierbij is de dienst ervan uitgegaan dat [appellante] geen toeslagpartner heeft.' 'De Belastingdienst/Toeslagen heeft de echtgenoot op 4 september 2014 als toeslagpartner van [appellante] aangemerkt.' 'Bij besluit van 20 november 2014 heeft de Belastingdienst/Toeslagen het voorschot zorgtoeslag herzien naar nihil, omdat uit de Basisregistratie Inkomen is gebleken dat de echtgenoot van [appellante] in 2013 een inkomen van € 41.275,00 genoot, waarmee hun gezamenlijke inkomen in dat jaar € 62.145,00 bedroeg, hetgeen te hoog was'"
