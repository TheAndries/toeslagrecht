opmerking: "Voorschot 2013 herzien naar nihil (20 november 2014) op een gezamenlijk inkomen van € 62.145, met echtgenoot als toeslagpartner (Awir art. 3 jo. AWR art. 5a). Het eigen inkomen van de aanvrager is afgeleid: € 62.145 − € 41.275 = € 20.870; de uitkomst hangt er niet van af. De tekst van 2013 geeft nihil: de inkomensgrens met partner is € 42.438 (via build.run_case). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
