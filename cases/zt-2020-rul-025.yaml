opmerking: "Herziene definitieve berekening 2020 (1 maart 2024): nihil nadat de inspecteur het toetsingsinkomen herzag naar € 13.142 en de grondslag sparen en beleggen naar € 392.758, boven de grens van € 85.767 (Wzt art. 2a lid 1, tekst 2020). Invoer gereconstrueerd als € 392.758 + € 30.846 = € 423.604 (zie zt-2020-rul-024); elke grondslag boven de grens geeft nihil. Zonder het vermogen zou de tekst € 1.250 geven: het vermogen beslist, niet het inkomen. € 1.383 teruggevorderd, waarvan € 133 rente. De achtste uitkomst van de Dienst op de vermogenstoets in het corpus. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
