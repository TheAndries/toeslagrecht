  publicatie: "Rechtbank Midden-Nederland 21 mei 2025, ECLI:NL:RBMNE:2025:2428 (zaaknr. UTR 24/4587), citaten uit de uitspraak: 'De inspecteur heeft het toetsingsinkomen herzien naar € 13.142,- en de grondslag sparen en beleggen naar € 392.758,-.' 'Als gevolg hiervan heeft Dienst Toeslagen met het primaire besluit van 1 maart 2024 de definitieve berekening van de zorgtoeslag over 2020 herzien naar € 0,-.'"
