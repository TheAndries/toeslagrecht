opmerking: "Maximum zonder partner 2023: de tekst geeft € 1858 per jaar (Awir art. 14 lid 4); € 1858 / 12 = € 154.83, door de Dienst gepubliceerd als € 154 per maand — naar beneden afgerond. Het maandbedrag staat niet in de wet (SOURCES.md open item 1); de encoding modelleert de praktijk van de Dienst (DISCREPANCIES.md #5). Inkomen hier € 10.000, onder het drempelinkomen; elk inkomen tot het drempelinkomen geeft hetzelfde."
