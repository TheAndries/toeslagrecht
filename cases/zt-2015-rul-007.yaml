opmerking: "Voorschot 2015 (21 maart 2015) van € 942 op een geschat toetsingsinkomen van € 443, zonder partner: het maximum van de tekst van 2015 (€ 1.408 − 5,265% × € 19.463,328 = € 941,85 → € 942, via build.run_case). Daarna heeft de Dienst het voorschot op nihil gezet omdat een medebewoner van 1 januari tot 4 oktober 2015 als toeslagpartner gold (Awir art. 3 lid 2 onder e); diens inkomen staat niet in de uitspraak en een deel van het jaar is niet als één situatie te berekenen (Awir art. 5, niet gecodeerd), dus die nihil is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
