  publicatie: "Rechtbank Oost-Brabant 20 maart 2025, ECLI:NL:RBOBR:2025:1536 (zaaknr. 24/71), r.o. 2: 'Voor wat betreft toeslagjaar 2020 heeft verweerder eiseres in eerste instantie bij besluit van 27 december 2019 een voorschot zorgtoeslag verleend van € 1.250,-. Dit is gebaseerd op een geschat toetsingsinkomen van eiseres van € 3.439,-.' Beroep gegrond (de terugvordering)"
