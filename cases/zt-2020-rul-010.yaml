opmerking: "Voorschot zorgtoeslag 2020 van 27 december 2019, € 1.250, op een geschat toetsingsinkomen van € 3.439, zonder partner (het toeslagpartnerschap over 2020 werd pas in 2021, met terugwerkende kracht, aangenomen; zie zt-2020-rul-011). De tekst van 2020 geeft zonder partner het maximum € 1.642 − 1,830% × € 21.430,656 = € 1.249,82 → € 1.250 (Awir art. 14 lid 4; via build.run_case). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
