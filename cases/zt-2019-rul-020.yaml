  publicatie: "Rechtbank Zeeland-West-Brabant 9 januari 2026, ECLI:NL:RBZWB:2026:60 (zaaknr. BRE 21/2894 HUUR en BRE 22/3072 ZORG), citaten uit de uitspraak: 'Aan eiser zijn, na diverse herzieningen, voorschotten huurtoeslag van € 2.992,- en zorgtoeslag van € 2.314,- toegekend voor het jaar 2019.' 'Het voorschot zorgtoeslag is gebaseerd op een geschat inkomen van eiser van € 9.565,- en van zijn toeslagpartner van € 0,-.'"
