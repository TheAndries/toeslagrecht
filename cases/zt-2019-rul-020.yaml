opmerking: "Voorschot 2019 (na herzieningen): € 2.314 bij een geschat inkomen van € 9.565 voor eiser en € 0 voor zijn toeslagpartner — het maximum met partner van de tekst 2019 (€ 2.314,41). De definitieve berekening van dezelfde uitspraak (9 maart 2022, € 1.169 bij BRI-inkomens van € 11.169 en € 0) geeft de tekst voor een heel jaar niet (€ 2.314); de uitspraak noemt een zoon als medebewoner en meldingen over drie personen, maar geen maanden of andere invoer — niet opgenomen, wel in law/SOURCES.md §4. Hoger beroep: ABRvS 2 oktober 2026, ECLI:NL:RVS:2026:5933. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
