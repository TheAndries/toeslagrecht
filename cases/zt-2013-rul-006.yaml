id: zt-2013-rul-006
toeslag: zorgtoeslag
jaar: 2013
bron:
  type: ruling
  publicatie: "Rechtbank Noord-Holland 7 april 2020, ECLI:NL:RBNHO:2020:2696, feiten: 'Het verzamelinkomen is daarbij verhoogd met de betalingen van het UWV (€ 1.786,21) en [A] (€ 5.000) naar € 19.708.' 'Met dagtekening 11 september 2015 is, naar aanleiding van de vermindering ib/pvv 2013, de definitieve berekening zorgtoeslag voor het jaar 2013 herzien naar € 1.002. Hierbij is uitgegaan van een toetsingsinkomen van € 19.708.'"
