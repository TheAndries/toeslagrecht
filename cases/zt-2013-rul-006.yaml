opmerking: "Herziene definitieve berekening 2013 van 11 september 2015, € 1.002, op een toetsingsinkomen van € 19.708 (een nabetaling en een UWV-uitkering telden mee). De tekst van 2013: € 1.478 − (2,195% × € 19.043,424 + 8,713% × (€ 19.708 − € 19.043,424)) = € 1.002,10 → € 1.002 (via build.run_case). Zonder partner, zie zt-2013-rul-005. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
