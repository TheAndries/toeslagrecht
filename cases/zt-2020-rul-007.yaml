opmerking: "Voorschot zorgtoeslag 2020 van € 1.250 op een geschat toetsingsinkomen van € 0: het maximum zonder partner uit de tekst van 2020, € 1.642 − 1,830% × € 21.430,656 = € 1.249,82 → € 1.250 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen toeslagpartner (r.o. 2: de huisgenote is 'geen partner in de zorgtoeslag'); het bedrag bevestigt dat (met een verzekerde partner zou het € 2.397 zijn). De definitieve vaststelling op nihil wegens het vermogen staat in zt-2020-rul-008. Het teruggevorderde bedrag (€ 1.254) is € 4 meer dan het voorschot; de uitspraak verklaart dat niet en het is geen invoer. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
