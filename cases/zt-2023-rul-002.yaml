  tegemoetkoming: "992"
opmerking: "Definitieve berekening 2023 over een DEEL van het jaar: de aanvrager verhuisde op 10-08-2023 naar Duitsland. De encoding rekent alleen hele jaren (Wzt art. 2 lid 5, per kalendermaand, is niet gecodeerd — DISCREPANCIES.md #9) en geeft voor € 30.763 het jaarbedrag: normpremie = 0,123% × € 25.069,824 + 13,640% × (€ 30.763 − € 25.069,824) = € 30,84 + € 776,55 = € 807,39; € 1.889 − € 807,39 = € 1.081,61 → € 1.082. De Dienst kwam op € 992. De uitspraak zegt niet over hoeveel maanden; € 992 = 11/12 van het afgeronde jaarbedrag € 1.082 (€ 991,83 → € 992), en het herziene voorschot van 02-02-2024 (zt-2023-rul-003) is eveneens 11/12 van het volle voorschot. Dit is dus geen tegenspraak met de tekst maar een niet-gecodeerde regel; de case blijft staan als het bewijs ervan en als test voor de dag dat de maandbepaling gecodeerd is. Wordt 'verified' op dezelfde voet als rul-001 (ASKS.md 9)."
