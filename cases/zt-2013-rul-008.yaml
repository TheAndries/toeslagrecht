  publicatie: "ABRvS 7 maart 2018, ECLI:NL:RVS:2018:768 (zaaknr. 201700196/1/A2), procesverloop en r.o. 1: 'Bij besluit van 20 november 2014 heeft de Belastingdienst/Toeslagen de aan [appellant] toegekende zorgtoeslag over 2013 definitief berekend en vastgesteld op nihil en een bedrag van € 246,00 van hem teruggevorderd.' 'Aan de berekening van de zorgtoeslag over 2013 op nihil heeft de Belastingdienst/Toeslagen ten grondslag gelegd dat het vastgestelde inkomen van [appellant] in 2013 van € 31.028,00 te hoog is om in aanmerking te komen voor zorgtoeslag en dat [appellant] geen verzekerde is in de zin van de Wet zorgtoeslag.'"
