opmerking: "Definitieve berekening 2013 van 20 november 2014: nihil op een inkomen van € 31.028, zonder partner (de uitspraak noemt er geen). De Dienst noemde twee gronden: het inkomen en dat de aanvrager geen verzekerde was; de case toetst alleen het inkomen, want of iemand verzekerde is neemt de encoding als invoer. De tekst van 2013 geeft op het inkomen alleen al nihil, maar langs een andere weg dan de grens: € 1.478 − (2,195% × € 19.043,424 + 8,713% × (€ 31.028 − € 19.043,424)) = € 15,78, minder dan € 24, dus niet toegekend (Awir art. 14 lid 5; via build.run_case) — de eerste beslissing in het corpus waarin het minimumbedrag de uitkomst bepaalt. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
