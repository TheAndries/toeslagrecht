opmerking: "Voorschot 2022 (28 december 2021): € 2.387 bij een geschat toetsingsinkomen van € 11.398 voor eiser en € 12.181 voor zijn partner, gezamenlijk € 23.579. De tekst van 2022: 2 × € 1.749 − (4,225% × € 22.356 + 13,610% × € 1.223) = € 2.387,01 → € 2.387 (Awir art. 14 lid 4). De eerste uitkomsten van de Dienst voor 2022 met partner buiten een folder, met beide inkomens genoemd (ook zt-2022-rul-005). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
