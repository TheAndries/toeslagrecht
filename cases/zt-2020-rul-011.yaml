  publicatie: "Rechtbank Oost-Brabant 20 maart 2025, ECLI:NL:RBOBR:2025:1536 (zaaknr. 24/71), r.o. 3, 5 en 7: 'Eiseres is op 21 oktober 2020 een notarieel samenlevingscontract aangegaan met haar partner ... Vervolgens heeft verweerder in de brief van 4 februari 2021 eiseres laten weten dat hij eiseres en [naam] als toeslagpartners aanmerkt, en dat – als gevolg hiervan – de zorgtoeslag zal worden herberekend. Dit is vervolgens gebeurd bij besluit van 13 maart 2021. Hierbij is het voorschot zorgtoeslag 2021 van eiseres en [naam] vastgesteld op € 1.786,-. Dit voorschot is gebaseerd op een geschat gezamenlijk toetsingsinkomen van € 25.939,-.' 'de voorschotten zorgtoeslag over 2021 als gevolg hiervan teruggevorderd tot een bedrag van € 1.805,- (inclusief € 19,- rente)' 'Volgens de destijds geldende wet wordt [naam] gedurende het gehele jaar aangemerkt als toeslagpartner, omdat eiseres en [naam] bij aanvang van 2020 al op hetzelfde adres stonden ingeschreven in de BRP.' Beroep gegrond (de terugvordering)"
