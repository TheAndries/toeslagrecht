opmerking: "Herzien voorschot van 13 maart 2021, € 1.786, voor het paar op een geschat gezamenlijk toetsingsinkomen van € 25.939, nadat het toeslagpartnerschap over heel 2020 was aangenomen (Awir art. 3 zoals het tot 1 januari 2021 luidde). De uitspraak schrijft op deze plaats 'voorschot zorgtoeslag 2021'; de case neemt 2020, om vier redenen: de zaak gaat alleen over de zorgtoeslag 2020 (r.o. 1, 5, 7); r.o. 5 noemt dezelfde terugvordering 'over 2021' waar het procesverloop 'over 2020' schrijft; het teruggevorderde bedrag, € 1.805 inclusief € 19 rente, is € 1.786 + € 19, dus het hele voorschot 2020; en het bedrag is met de tekst van 2020 op de euro na te rekenen, 2 × € 1.642 − (4,140% × € 21.430,656 + 13,550% × (€ 25.939 − € 21.430,656)) = € 1.785,89 → € 1.786 (Awir art. 14 lid 4; via build.run_case), terwijl de tekst van 2021 bij dit inkomen € 1.930 geeft. Dat is een lezing van de uitspraak door de operator; wie de case verifieert (ASKS.md 9), toetst ook die lezing. Partner verzekerd aangenomen: het bedrag bewijst twee standaardpremies. De verdeling van het gezamenlijke inkomen is niet gegeven en doet er voor de uitkomst niet toe."
