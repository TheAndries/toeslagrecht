opmerking: "Een in Nederland wonende verzekerde met een in Marokko wonende verdragsgerechtigde partner (Zvw art. 69; woonlandfactor Marokko 0,0125). De uitspraak noemt geen toetsingsinkomen; de door de Dienst toegepaste normpremie met partner (€ 971,42) is het normpercentage over het drempelinkomen alleen, zodat het gezamenlijke toetsingsinkomen niet boven het drempelinkomen lag; de case voert € 0 in — elk inkomen tot het drempelinkomen geeft dezelfde uitkomst. Verwacht is het bedrag van de Dienst: € 1.546 + € 1.546 × 0,0125 − normpremie = € 593,91 → € 594 (Awir art. 14 lid 4; via build.run_case nagerekend met partner_verdragsgerechtigd en woonland MA: de encoding geeft voor dit geval 'undetermined', omdat Wzt art. 3 (tekst 2018) de partner van een verdragsgerechtigde regelt en niet de verdragsgerechtigde partner van een verzekerde; het huidige art. 4a lid 3 is ingevoegd per 06-11-2024). De Afdeling kwam tot een andere uitkomst dan de Dienst én dan de tekst zoals de Dienst die leest: op grond van de memorie van toelichting (Kamerstukken II 2006/07, 30 918, nr. 3) heeft de verzekerde zelf recht op het maximum zonder partner, € 94 per maand, en de partner afzonderlijk een aanspraak met de woonlandfactor. Het Handboek Toeslagen (hoofdstuk 21 §1.6.5) zegt daarover dat de wetgever (Kamerstukken II 2022/23, 36 357, nr. 3, blz. 20) heeft aangegeven dat het wetsartikel dat die passage toelichtte nooit in werking is getreden en dat art. 4a per 06-11-2024 is verduidelijkt zonder de berekening te wijzigen. Drie lezingen van één tekst: DISCREPANCIES.md #16 (law). Het voorschot 2018 van € 594 is het jaarbedrag met de partner voor het hele jaar (€ 593,91 → € 594); de normpremie € 971,42 = 4,750% × € 20.450,88, gelijk aan de tekst. In ECLI:NL:RVS:2021:1071 gaat het om de maanden januari tot en met juli 2018; het later gewijzigde voorschot (€ 725) is niet herleidbaar en niet opgenomen. Het door de Afdeling aangehaalde maximum zonder partner 2018, € 94 per maand, is € 1.139 / 12 = € 94,92 naar beneden afgerond (#5): het eerste maandcijfer van de Dienst voor 2018 in het corpus."
