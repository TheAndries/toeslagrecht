  publicatie: "Afdeling bestuursrechtspraak van de Raad van State 26 mei 2021, ECLI:NL:RVS:2021:1072 (201908492/1/A2), ook ECLI:NL:RVS:2021:1071 (201907402/1/A2, dezelfde appellant), procesverloop: 'Bij besluit van 21 november 2018 heeft de Belastingdienst/Toeslagen het voorschot zorgtoeslag van [appellant] over 2018 herzien en vastgesteld op € 594,00.' (ECLI:NL:RVS:2021:1071: 'Bij besluit van 21 augustus 2018 ... voor het jaar 2018 vastgesteld op € 594,00'; later, 15 maart 2019, gewijzigd op € 725,00 — niet herleidbaar, niet opgenomen); 'De woonlandfactor voor Marokko is 0,0125 in 2017 en 2018.'; 'De Belastingdienst/Toeslagen heeft de zorgtoeslag waarop [appellant] en zijn partner aanspraak kunnen maken vastgesteld door bij de standaardpremie ten behoeve van [appellant] (€ 1.530,00 voor 2017 en € 1.546,00 voor 2018) de standaardpremie vermenigvuldigd met de woonlandfactor voor Marokko voor zijn in dat land wonende partner (€ 19,125 voor 2017 en € 19,33 voor 2018) op te tellen. Het aldus verkregen totaalbedrag (€ 1.549,125 voor 2017 en € 1.565,33 voor 2018) is vervolgens verminderd met de normpremie voor verzekerden met een partner (€ 1.016,51 voor 2017 en € 971,42 voor 2018). Het verschil bedraagt in 2017 € 532,62 en in 2018 € 593,91.'; 'Als [appellant] alleenstaand zou zijn geweest had hij in 2017 en 2018 aanspraak kunnen maken op de maximale zorgtoeslag van € 88,00 respectievelijk € 94,00 per maand.' De Afdeling: 'Gelet hierop heeft de Belastingdienst/Toeslagen ten onrechte de standaardpremies van [appellant] en zijn partner bij elkaar opgeteld en de normpremie daarop in mindering gebracht.' '[appellant] heeft recht op de maximale zorgtoeslag van € 88,00 per maand in 2017 en € 94,00 per maand in 2018.' Hoger beroep gegrond, zelf afgedaan"
