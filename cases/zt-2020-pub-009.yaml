opmerking: "Vermogenstoets 2020 (Wzt art. 2a, tekst 2020): geen zorgtoeslag als de grondslag sparen en beleggen (Wet IB 2001 art. 5.2: rendementsgrondslag minus heffingvrij vermogen) meer bedraagt dan € 85.767 (Stcrt. 2019, 61842). De Dienst publiceert de grens als rendementsgrondslag: € 85.767 + € 30.846 heffingvrij vermogen = € 116.613 (zonder partner), + 2 × € 30.846 = € 147.459 (met partner) — gelijk aan de tekst (SOURCES.md; memory 10-14). De encoding neemt de rendementsgrondslag als invoer en trekt het heffingvrij vermogen zelf af. Op de gepubliceerde grens met toeslagpartner (€ 147.459, hele jaar dezelfde partner, Wet IB 2001 art. 5.2 lid 2): grondslag € 85.767 → recht; inkomen € 10.000 → het maximum € 2.397."
