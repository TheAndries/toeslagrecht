  publicatie: "ABRvS 10 mei 2023, ECLI:NL:RVS:2023:1843 (zaaknr. 202202207/1/A2), procesverloop en r.o. 3.1: 'Bij onderscheiden besluiten van 17 juli 2020 heeft de Belastingdienst/Toeslagen de zorgtoeslag van [appellant] voor de jaren 2016 en 2017 vastgesteld op nihil en onderscheidenlijk € 1.080,00 en € 1.1147,00 aan teveel ontvangen voorschotten teruggevorderd' (het tweede bedrag staat zo, met vier cijfers, in de tekst) ... 'omdat het gezamenlijk toetsingsinkomen over die jaren te hoog is om voor zorgtoeslag in aanmerking te komen'; 'Tussen partijen is niet in geschil dat het door de inspecteur vastgestelde verzamelinkomen over 2016 € 35.088,00 en over 2017 € 35.358,00 bedraagt.' Hoger beroep ongegrond; de vaststelling op nihil staat"
