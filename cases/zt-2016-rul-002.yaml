opmerking: "Definitieve vaststelling 2016 op nihil wegens een te hoog gezamenlijk toetsingsinkomen. De uitspraak noemt het verzamelinkomen van de aanvrager (€ 35.088) en zegt dat het gezamenlijke inkomen te hoog was; het inkomen van de partner noemt zij niet en is op 0 gezet. Dat maakt voor de uitkomst niet uit: de tekst van 2016 geeft met partner al nihil bij € 35.088 (de inkomensgrens met partner ligt lager, zie zt-2016-syn-030/-031), en elk hoger gezamenlijk inkomen geeft ook nihil. Of de partner verzekerde was, doet bij nihil evenmin ter zake. Het teruggevorderde bedrag (€ 1.080) is het ontvangen voorschot, geen invoer. Dezelfde uitspraak geeft 2017: zt-2017-rul-001. Eerste aanleg (gelezen 2026-10-30): Rechtbank Rotterdam 7 april 2022, ECLI:NL:RBROT:2022:2503 noemt wél het inkomen van de toeslagpartner — € 10.044 (2016) en € 10.191 (2017), gezamenlijk € 45.132 en € 45.549 — en citeert de Dienst: 'Het maximale inkomen voor aanspraak op zorgtoeslag is voor een aanvrager met een toeslagpartner vastgesteld op € 33.764,-' (2016; zie DISCREPANCIES.md #1) en voor 2017 '€ 32.358'. De invoer hier (partner € 0) blijft staan: de uitkomst is nihil onder beide lezingen; € 1.080 (2016) en € 1.147 (2017) teruggevorderd. Wordt 'verified' zodra een met naam genoemd mens (CASES.md) de invoer tegen de uitspraak heeft gelegd — ASKS.md 9."
