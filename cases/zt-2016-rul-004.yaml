opmerking: "Definitieve berekening 2016 (15 november 2019): nihil omdat de grondslag sparen en beleggen (€ 479.973, BRI) boven de € 82.504 van Wzt art. 2a lid 1 (tekst 2016) lag — de eerste uitkomst van de Dienst op de vermogenstoets voor 2016. De uitspraak noemt de grondslag ná aftrek van het heffingvrije vermogen (Wet IB 2001 art. 5.2); de encoding vraagt de rendementsgrondslag en trekt het heffingvrije vermogen 2016 (€ 24.437, art. 5.5) zelf af. De invoer € 504.410 is daarom GERECONSTRUEERD: € 479.973 + € 24.437, zonder partner. Dat er geen partner was, noemt de uitspraak niet ('eiseres'); het voorschot van € 998 (28 december 2015) is het maximum zonder partner van de tekst 2016 (€ 997,74) en bewijst het; met partner blijft de uitkomst nihil. Het toetsingsinkomen staat niet in de uitspraak; het is hier € 0 ingevuld omdat de vermogenstoets vóór de inkomenstoets gaat en nihil geeft bij elk inkomen. De verifieerder toetst beide lezingen. Het voorschot zelf is geen case: zijn inkomen staat niet in de uitspraak. Het teruggevorderde bedrag (€ 1.902) is veel meer dan het voorschot van € 998; de uitspraak verklaart dat niet en het is geen invoer. Zie zt-2015-rul-006 voor dezelfde aanvrager over 2015. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
