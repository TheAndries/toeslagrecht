id: zt-2016-rul-004
toeslag: zorgtoeslag
jaar: 2016
bron:
  type: ruling
  publicatie: "Rechtbank Den Haag 5 februari 2021, ECLI:NL:RBDHA:2021:2781 (zaaknrs. SGR 19/7423 en SGR 20/3372; bevestigd ABRvS ECLI:NL:RVS:2021:2830), r.o. 4–6, 12, 13, 15: 'Bij beschikking van 28 december 2015 is aan eiseres voor het jaar 2016 een voorschot zorgtoeslag toegekend van € 998.' 'Op 11 oktober 2019 ontvangt verweerder een melding vanuit de BRI waaruit blijkt dat de inspecteur heeft vastgesteld dat in 2016 voor eiseres sprake is van een bedrag grondslag sparen en beleggen van € 479.973.' 'Bij beschikking van 15 november 2019 is de zorgtoeslag 2016 definitief berekend op nihil, en is bepaald dat eiseres € 1.902 moet terugbetalen.' '... in het berekeningsjaar 2016 meer bedraagt dan € 82.504.' 'Niet in geschil is dat bij een grondslag sparen en beleggen van € 391.765 voor het jaar 2015 respectievelijk € 479.973 voor het jaar 2016 geen recht bestaat op zorgtoeslag'. 'Verweerder heeft de definitieve berekeningen zorgtoeslag 2015 en 2016 terecht vastgesteld op nihil.'"
