opmerking: "Een in Nederland verzekerde aanvrager ('een Nederlandse zorgverzekering') met een in Marokko wonende echtgenote die 'via het Centraal Administratiekantoor' is meeverzekerd (verdragsgerechtigd, Zvw art. 69); de uitspraak noemt geen toetsingsinkomen en noemt de woonlandfactor niet met een getal. Dezelfde situatie als zt-2017-rul-007 / zt-2018-rul-008 (ECLI:NL:RVS:2021:1071/1072, een andere appellant): DISCREPANCIES.md #16 (law); de encoding geeft voor deze partner vóór 06-11-2024 'undetermined' (Wzt art. 3 oud noemt hem niet). Verwacht is het herziene voorschot 2019 van 21 juni 2019, € 736: de optelmethode van de Dienst (standaardpremie € 1.609 (Stcrt. 2018, 66728) + € 1.609 × woonlandfactor Marokko 2019 0,0193 (Stcrt. 2018, 60576) = € 31,05 erbij − normpremie met partner 4,315% × € 20.940,768 = € 903,59) geeft € 736,46 → € 736 (Awir art. 14 lid 4) bij elk gezamenlijk toetsingsinkomen tot het drempelinkomen; met het drempelinkomen afgerond op € 20.941 (#1) is de normpremie € 903,60 en de uitkomst dezelfde hele euro. Het eerste bedrag van de Dienst met de Marokkaanse factor van 2019 in het corpus. Lezing van de operator: de rekenwijze volgt uit het bedrag, niet uit een geciteerde berekening; de case voert € 0 in. Herroepen door de Afdeling (dictum VI) na de nieuwe definitieve berekening van 22 juli 2021 (zt-2019-rul-024)."
