  type: ruling
  publicatie: "Afdeling bestuursrechtspraak van de Raad van State 24 november 2021, ECLI:NL:RVS:2021:2619 (202002335/1/A2), procesverloop: 'Bij besluiten van 10 mei 2019 en 7 juni 2019 heeft de Belastingdienst/Toeslagen voorschotten kindgebonden budget (€ 1.152,00) en zorgtoeslag (€ 594,00) van [appellant] over 2018 herzien. Bij besluiten van 21 mei 2019 en 21 juni 2019 heeft de Belastingdienst/Toeslagen voorschotten kindgebonden budget (€ 1.166,00) en zorgtoeslag (€ 736,00) van [appellant] over 2019 herzien.'; r.o. 2: '[echtgenote] en haar zoon wonen in Marokko, [appellant] in Nederland. [appellant] heeft een Nederlandse zorgverzekering. [echtgenote] is voor de zorgverzekering meeverzekerd via het Centraal Administratiekantoor.'; r.o. 3: 'Bij de nieuwe berekening is de dienst uitgegaan van een toeslagpartner omdat [appellant] en [echtgenote] getrouwd zijn en de dienst dit eerst in april 2019 heeft vernomen.' 'Bij de berekening van de zorgtoeslag is ook gebruik gemaakt van de zogeheten woonlandfactor.'; r.o. 7: 'De Belastingdienst/Toeslagen heeft twee nieuwe besluiten genomen. Aanleiding hiervoor zijn twee uitspraken van de Afdeling van 26 mei 2021 (ECLI:NL:RVS:2021:1071 en ECLI:NL:RVS:2021:1072). De besluiten van 22 juli 2021 zien op de definitieve berekening zorgtoeslag 2018 en 2019. [appellant] en [echtgenote] hebben samen recht op een bedrag aan zorgtoeslag van € 94,00 per maand in 2018 (in totaal € 1.139,00). Dit is € 590,00 meer dan bij de eerdere besluiten. Over 2019 hebben zij recht op een bedrag van € 99,00 per maand (in totaal € 1.189,00). Dit is € 473,00 meer dan bij de eerdere besluiten.'; dictum VI: 'herroept de besluiten van de Belastingdienst/Toeslagen van 7 juni 2019 en 21 juni 2019 over het voorschot zorgtoeslag 2018 en 2019'"
