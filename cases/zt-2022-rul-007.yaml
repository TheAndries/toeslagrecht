opmerking: "Herzien voorschot 2022 (4 februari 2023): € 901 bij een geschat gezamenlijk toetsingsinkomen van € 34.540 (een nabetaling pensioen van de echtgenote meegeteld); de uitspraak schrijft het bedrag tweemaal als € 901 en eenmaal als € 905, en € 1.652 teruggevorderd = € 2.553 − € 901. De tekst van 2022 geeft € 895 (2 × € 1.749 − (4,225% × € 22.356 + 13,610% × € 12.184) = € 895,22); € 901 zou bij € 34.497 volgen, € 905 bij € 34.468 — de uitspraak noemt geen ander inkomen, geen woonland en geen maanden. Opgenomen als DISCREPANCIES.md #13 (open); deze case faalt daarom bij de check en is als zodanig gelogd. Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
