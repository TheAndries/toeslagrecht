  publicatie: "Rechtbank Zeeland-West-Brabant 3 september 2024, ECLI:NL:RBZWB:2024:6154 (zaaknr. 23/3864), citaten uit de uitspraak: 'Bij besluit van 4 februari 2023 (primair besluit) heeft de Dienst Toeslagen eisers voorschot zorgtoeslag over het jaar 2022 herzien en voorlopig vastgesteld op € 905,-.' 'Het inkomen wordt dan geschat op € 34.540,-.' 'Daaropvolgend heeft de Dienst Toeslagen op 4 februari 2023 een nieuwe voorschotberekening gemaakt, waarin het voorschot zorgtoeslag voor het jaar 2022 voorlopig wordt vastgesteld op € 901,-.' 'De Dienst Toeslagen is daarom ten tijde van het bestreden besluit terecht uitgegaan van een toetsingsinkomen van € 34.540,-.' 'Dit voorschot is herzien en opnieuw berekend op € 901,-, zodat de terugvordering op grond van het bestreden besluit € 1.652,- bedraagt.'"
