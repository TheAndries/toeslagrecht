opmerking: "Een verdragsgerechtigde (CAK-melding per 3 juli 2012) met AOW, woonland Roemenië (woonlandfactor 2023 0,1085, Stcrt. 2022, 29339 zoals gerectificeerd bij Stcrt. 2022, 32002; de uitspraak noemt 0,1085). Verwacht is het voorschot 2023 zoals de Dienst het vaststelde: € 174, berekend zonder de echtgenote, die door een fout in het systeem van de Dienst niet als toeslagpartner was verwerkt (r.o. 14); de rechtbank liet het voorschot in stand omdat eiser er niet door benadeeld was (r.o. 19). De tekst zonder partner: € 1.889 (Stcrt. 2022, 32017) × 0,1085 = € 204,96 (Wzt art. 3 lid 1, tekst 2023; nu art. 4a lid 1) − normpremie 0,123% × € 25.069,824 = € 30,84 → € 174,12 → € 174 (Awir art. 14 lid 4) — via build.run_case nagerekend; de Dienst rekent met het drempelinkomen afgerond op € 25.070 (#1), dezelfde hele euro. De uitspraak noemt alleen het gezamenlijke toetsingsinkomen € 22.222 (r.o. 16); de case voert het geheel bij de aanvrager in — onder het drempelinkomen maakt de verdeling niets uit. Een uitkomst van de Dienst voor de invoer die hij gebruikte (zonder partner), zoals ook zt-2017-rul-005 zo is opgenomen; de berekening mét partner is zt-2023-rul-007."
