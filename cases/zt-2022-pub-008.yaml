opmerking: "Het Handboek legt het gezamenlijke inkomen niet uit over de partners; de case voert het in bij de aanvrager, partner € 0 — de uitkomst hangt er niet van af (Wzt art. 2 lid 2: gezamenlijk toetsingsinkomen). Het drempelinkomen 2022 is in de tekst precies € 22.356 (108% × 12 × € 1.725,00), zodat de Dienst en de tekst hier op de cent gelijk uitkomen. Het Handboek noemt geen afgerond jaarbedrag en geen maandbedrag; € 288 volgt uit Awir art. 14 lid 4."
