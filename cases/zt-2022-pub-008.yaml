  publicatie: "Dienst Toeslagen, Handboek Toeslagen, versie 2026.3 (publicatiedatum 20 oktober 2026), hoofdstuk 21 Zorgtoeslag, paragraaf 1.6.4 Voorbeelden berekening, Voorbeeld 2022: 'Een aanvrager met partner en een gezamenlijk toetsingsinkomen van € 39.000. Normpremie = € 22.356 x 4,225% + (€ 39.000 - € 22.356) x 13,610% = € 3.209,7894. Zorgtoeslag = € 1.749 x 2 - € 3.209,7894 = € 288,21 per jaar.'"
