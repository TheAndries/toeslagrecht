opmerking: "Maximum zonder partner 2025: de tekst geeft € 1573 per jaar (Awir art. 14 lid 4); € 1573 / 12 = € 131.08, door de Dienst gepubliceerd als € 131 per maand — naar beneden afgerond. Het maandbedrag staat niet in de wet (SOURCES.md open item 1); de encoding modelleert de praktijk van de Dienst (DISCREPANCIES.md #5). Inkomen hier € 10.000, onder het drempelinkomen; elk inkomen tot het drempelinkomen geeft hetzelfde."
