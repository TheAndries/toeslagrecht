opmerking: "Inkomensgrens 2015 zonder toeslagpartner uit de tekst: normpremie = 2,395% × € 19.463,328 + 13,400% × (€ 26.316 − € 19.463,328) = € 466,15 + € 918,26 = € 1.384,40; € 1.408 − € 1.384,40 = € 23,60 (precies € 23,5952) → € 24 (Awir art. 14 lid 4), net toegekend (lid 5). Zie syn-033 voor de euro erboven. Met een naar beneden afgerond drempelinkomen (€ 19.463, DISCREPANCIES.md #1) blijft het € 24 (€ 23,56); met € 19.464 ook (€ 23,67) — maar dan krijgt ook € 26.317 nog € 24 (€ 23,54), zie syn-033. Het maximum 2015 zonder partner uit de tekst is € 942 (€ 941,85), het bedrag dat de ABRvS op 20 juni 2018 (zaak 201709274/1/A2) als voorschot 2015 noemt. Wordt een published case zodra een publicatie van de Dienst voor 2015 de grens noemt."
