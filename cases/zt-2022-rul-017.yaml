opmerking: "Het eerste voorbeeld met twee situaties in één jaar (sinds 2026-11-05 gecodeerd: rules.py bereken_perioden, awir-2026-art5). De uitspraak noemt voor de eerste helft alleen het gezamenlijke geschatte toetsingsinkomen (€ 31.156); hoe het over beiden verdeeld was, staat er niet en maakt voor Wzt art. 2 lid 2 (het gezamenlijke inkomen telt) niet uit — hier als € 0 + € 31.156 ingevuld, de verdeling is de lezing van de operator. Dat de partner verzekerde was (Wzt art. 2 lid 4), zegt de uitspraak niet; zonder dat halveert de wet het eerste deel en komt niemand op € 1.346 — aangenomen, en zo te toetsen. De tekst: met partner € 1.355,78 per jaar → 6/12 = € 677,89; zonder partner op € 0 € 1.335,86 → € 667,93; samen € 1.345,82 → € 1.346, op de euro het voorschot van de Dienst. De Dienst rondt eerst de jaarbedragen af (DISCREPANCIES.md #10): € 1.356 × 6/12 + € 1.336 × 6/12 = € 678 + € 668 = € 1.346, hetzelfde; dit voorbeeld onderscheidt de twee volgordes dus niet. De definitieve berekening van 04-08-2023 (r.o. 3: € 40.779 = € 6.864 + € 33.915 voor januari t/m juni, € 6.864 voor juli t/m december; € 657 teruggevorderd) noemt haar eigen bedrag niet; de tekst geeft daarvoor € 23,04 + € 667,93 = € 690,97 → € 691 (de Dienst-volgorde eveneens € 691), waar € 1.346 − € 657 = € 689 zou volgen — een afgeleid bedrag, geen uitkomst in de uitspraak, dus geen tweede voorbeeld en geen verschil in het logboek; wel genoteerd in SOURCES.md §4. R.o. 5 en 6 bevestigen de lezing van Awir art. 7 en 8 die de encoding volgt: het toetsingsinkomen is een jaarbedrag, ook van de partner over de maanden van het partnerschap ('geen ruimte om de draagkracht per maand te berekenen'). Wordt 'verified' op dezelfde voet als de andere ruling-voorbeelden (ASKS.md 9)."
