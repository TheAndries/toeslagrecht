  publicatie: "Rechtbank Den Haag 11 december 2024, ECLI:NL:RBDHA:2024:21766 (zaaknr. SGR 23/8428), r.o. 2 en 3: 'Eiseres en [naam] , tevens de gemachtigde van eiseres, waren tot 1 juli 2022 (toeslag)partners. In de periode van 1 juli 2022 tot en met 31 december 2022 had eiseres geen toeslagpartner.' / 'Voor 2022 heeft eiseres een voorschot op haar zorgtoeslag ontvangen van € 1.346,-. Dit voorschot is voor de periode van 1 januari 2022 tot en met 30 juni 3022 gebaseerd op een gezamenlijk geschat toetsingsinkomen van € 31.156,-. Voor de periode van 1 juli 2022 tot en met 31 december 2022 is het voorschot gebaseerd op een geschat inkomen van eiseres van € 0,-.' ('3022' staat zo in de uitspraak.) Een voorschot (Awir art. 16) over een jaar met twee situaties: zes maanden met partner, zes maanden zonder (Awir art. 5, Wzt art. 2 lid 5)"
