  publicatie: "ABRvS 15 november 2017, ECLI:NL:RVS:2017:3139 (zaaknr. 201605802/1/A2), r.o. 2: 'De Belastingdienst/Toeslagen had [appellante] bij besluit van 27 december 2014 een voorschot zorgtoeslag van € 942,00 toegekend en bij besluit van 21 september 2015 een voorschot kindgebonden budget van € 3.062,00. De hoogte van deze voorschotten was gebaseerd op een toetsingsinkomen van [appellante] van € 2.655,00.'"
