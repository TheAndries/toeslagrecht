opmerking: "Definitieve berekening 2019: € 428 bij een gezamenlijk toetsingsinkomen van eiser en zijn echtgenote van € 34.891, waarin een nabetaling Wajong van het UWV meetelt. De tekst van 2019: 2 × € 1.609 − (4,315% × € 20.940,768 + 13,520% × € 13.950,232) = € 428,33 → € 428 (Awir art. 14 lid 4). Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0). € 1.904 teruggevorderd; het voorschot zelf (€ 2.332 zou volgen, een afgeleid bedrag) staat niet in de uitspraak en is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
