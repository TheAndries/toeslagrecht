  publicatie: "ABRvS 20 november 2024, ECLI:NL:RVS:2024:4751 (zaaknr. 202307817/1/A2), procesverloop en r.o. 1: 'Bij besluit van 5 augustus 2022 heeft de Dienst Toeslagen de zorgtoeslag van [appellant] over 2021 definitief vastgesteld op € 54,00, en € 1.237,00 aan teveel uitbetaalde voorschotten teruggevorderd.' 'Op 25 mei 2022 heeft de Dienst Toeslagen een melding ontvangen vanuit de Basisregistratie Inkomen (hierna: BRI) waaruit blijkt dat het toetsingsinkomen van [appellant] over 2021 € 30.913,00 bedraagt' (een AOW-nabetaling van € 15.640,95 netto over december 2019 t/m januari 2021, in februari 2021 betaald, meegeteld). Hoger beroep ongegrond"
