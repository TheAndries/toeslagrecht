verwacht:
  tegemoetkoming: "54"
opmerking: "Definitieve vaststelling 2021 van € 54 op een toetsingsinkomen van € 30.913 — de eerste uitkomst van de Dienst voor 2021 op de afbouwlijn (geen maximum, geen nihil). De tekst van 2021 geeft zonder partner € 1.705 − (1,915% × € 21.835,008 + 13,580% × (€ 30.913 − € 21.835,008)) = € 54,07 → € 54 (Awir art. 14 lid 4; via build.run_case); met een verzekerde partner zou het € 1.254 zijn, dus het bedrag bewijst dat er geen partner was. Het voorschot van hetzelfde jaar (€ 1.287 op € 9.439) staat in zt-2021-rul-001. Het teruggevorderde bedrag (€ 1.237) is € 4 meer dan € 1.287 − € 54; de uitspraak van de Afdeling verklaart dat niet (de rechtbank schrijft € 1.233 'exclusief rente'). De Afdeling: een nabetaling telt in het jaar van betaling (Awir art. 7 lid 1, art. 8 lid 1), zoals in ECLI:NL:RVS:2024:4094 voor 2022. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
