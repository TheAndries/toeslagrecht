opmerking: "Herzien voorschot 2019 op het gewijzigde geschatte toetsingsinkomen van € 25.000: € 640 voor het hele jaar. De tekst van 2019 geeft hetzelfde: normpremie 2,005% × € 20.940,768 + 13,52% × € 4.059,23 = € 968,67; € 1.609 − € 968,67 = € 640,33 → € 640 (via build.run_case). De uitspraak noemt geen partner; met partner zou de tekst € 1.745 geven, dus 'zonder partner' volgt uit het bedrag. De rechtbank: het voorschot volgt het geschatte jaarinkomen (Awir art. 16), ook als het inkomen pas vanaf oktober steeg; de maanden januari–september worden niet apart berekend. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
