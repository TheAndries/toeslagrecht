  publicatie: "Rechtbank Midden-Nederland 6 november 2020, ECLI:NL:RBMNE:2020:5266 (zaaknr. UTR 20/1764), r.o. 2 en 4: 'Op 27 oktober 2019 heeft verweerder een melding van eiseres ontvangen waarmee zij haar geschatte toetsingsinkomen over 2019 heeft gewijzigd naar € 25.000,-. De wijziging van het geschatte toetsingsinkomen heeft geleid tot het primaire besluit, waarbij verweerder het voorschot huur- en zorgtoeslag voor 2019 heeft aangepast.' 'De rechtbank is van oordeel dat verweerder terecht voor 2019 zorgtoeslag op € 640,- en de huurtoeslag op nihil heeft vastgesteld. Verweerder heeft terecht aan de hand van het door eiseres geschatte toetsingsinkomen van € 25.000,- het voorschot huur- en zorgtoeslag berekend.' Beroep ongegrond"
