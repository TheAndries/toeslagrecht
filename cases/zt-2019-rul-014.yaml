opmerking: "Definitieve vaststelling 2019 (11 september 2020): nihil bij een inkomen van € 67.044. De uitspraak noemt geen partner; de case voert zonder partner in. De tekst van 2019 geeft nihil boven € 29.562 zonder partner en boven € 37.885 met partner, dus de lezing doet er voor de uitkomst niet toe. € 793 zorgtoeslag teruggevorderd (het voorschot; zijn geschatte inkomen staat niet in de uitspraak). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
