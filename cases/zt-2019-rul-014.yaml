  publicatie: "Rechtbank Limburg 31 oktober 2022, ECLI:NL:RBLIM:2022:8438 (zaaknr. ROE 20/3521), citaten uit de uitspraak: 'Bij besluit van 11 september 2020 (het primaire besluit) heeft verweerder zowel de zorgtoeslag als de huurtoeslag van eiser over 2019 definitief vastgesteld op € 0,- en de daardoor ten onrechte ontvangen zorgtoeslag van € 793,- en huurtoeslag van € 2.219,- van eiser teruggevorderd.' 'Verweerder heeft de zorgtoeslag 2019 en de huurtoeslag 2019 op € 0,- vastgesteld, omdat eiser in 2019 een inkomen had van € 67.044,- en dus een inkomen dat ligt boven de inkomensgrenzen voor de zorgtoeslag en de huurtoeslag.'"
