id: zt-2018-rul-005
toeslag: zorgtoeslag
jaar: 2018
bron:
  type: ruling
  publicatie: "Rechtbank Midden-Nederland 14 juni 2021, ECLI:NL:RBMNE:2021:2494 (zaaknr. UTR 20/3703), citaten uit de uitspraak: 'Eiser heeft voor 2018 een voorschot zorgtoeslag ontvangen van € 1.656,-.' '1 mei 2018 heeft verweerder het recht op zorgtoeslag definitief berekend en vastgesteld op nihil.' 'Dat heeft verweerder zo gedaan, omdat het gezamenlijke toetsingsinkomen van eiser en zijn echtgenote € 39.574,- bedraagt en dan bestaat er geen recht op zorgtoeslag.' 'Dit betekent dat eiser en zijn echtgenote voor het jaar 2018 vanaf 1 november 2018 niet meer als toeslagpartners worden aangemerkt.' 'De zorgtoeslag voor 2018 is door verweerder daarom opnieuw berekend en bij besluit van 6 maart 2021 vastgesteld op € 170,-.'"
