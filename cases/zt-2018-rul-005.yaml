opmerking: "Definitieve vaststelling 2018 (1 mei 2020, gehandhaafd 4 september 2020): nihil bij een gezamenlijk toetsingsinkomen van € 39.574 met de echtgenote als toeslagpartner voor het hele jaar (tekst 2018: inkomensgrens met partner € 35.996). Opgenomen met de invoer van dát besluit: de Dienst nam hangende beroep (6 maart 2021) een ander standpunt in — het partnerschap eindigde per 1 november 2018 — en berekende € 170; dat is een wijziging in het jaar (Awir art. 5), niet gecodeerd, geen case. Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0, verzekering niet in geschil); de uitsplitsing staat niet in de uitspraak. Het voorschot van € 1.656 heeft geen genoemd inkomen en is geen case; € 1.711 teruggevorderd. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
