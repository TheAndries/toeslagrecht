  publicatie: "Rechtbank Den Haag 24 april 2026, ECLI:NL:RBDHA:2026:9882 (zaaknr. 25/2227), citaten uit de uitspraak: 'Verweerder heeft met het besluit van 22 januari 2025 het voorschot zorgtoeslag voor 2025 vastgesteld op € 0,-.' 'Als gevolg van een inkomenswijziging van € 39.100,- naar € 70.000,- is het eerder aan eiser toegekende voorschot zorgtoeslag voor 2025 herzien van € 108,- naar € 0,-.'"
