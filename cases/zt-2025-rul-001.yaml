opmerking: "Voorschot 2025: € 108 bij een geschat inkomen van € 39.100, zonder partner ('eiser', geen partner genoemd) — de eerste uitkomst van de Dienst voor 2025 in het corpus, op € 619 onder de inkomensgrens zonder partner van de tekst (€ 39.719). De tekst van 2025: € 2.112 − (1,896% × € 28.405,728 + 13,700% × € 10.694,272) = € 108,31 → € 108 (Awir art. 14 lid 4); met het drempelinkomen van de Dienst (€ 28.406, DISCREPANCIES.md #1) komt dezelfde euro uit. Het herziene voorschot: zt-2025-rul-002. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
