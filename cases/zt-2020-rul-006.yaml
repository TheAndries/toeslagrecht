opmerking: "Zorgtoeslag 2020 definitief op nihil gesteld op een geregistreerd inkomen van € 41.466 (door de uitspraak 'geschat jaarinkomen' genoemd; later door de inspecteur verlaagd tot € 20.733, zie zt-2020-rul-005). € 41.466 ligt boven de inkomensgrens van de tekst van 2020 zonder partner (€ 30.480) én met partner (€ 38.945), dus nihil onder elke lezing; dat er geen partner was, volgt uit het bedrag van € 1.250 op het gecorrigeerde inkomen. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
