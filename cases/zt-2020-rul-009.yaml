  publicatie: "Rechtbank Rotterdam 20 oktober 2021, ECLI:NL:RBROT:2021:10386 (zaaknr. ROT 21/1133), r.o. 2.2: 'Bij besluit van eveneens 29 december 2020 is aan de partner van eiseres een voorschot zorgtoeslag over 2020 van € 1.238,- toegekend. Bij besluit van 10 mei 2021 is het voorschot zorgtoeslag over 2020 voor de partner van eiseres vastgesteld op € 1.834,-.' R.o. 3.1: de Dienst merkt de echtgenoot over 1 januari tot en met 31 december 2020 als toeslagpartner aan; 'Bij de berekening wordt rekening gehouden met haar inkomen van € 8.000,- en het inkomen van haar toeslagpartner van € 21.980,-, waardoor het geschatte toetsingsinkomen wordt vastgesteld op € 29.980,-.' Beroep gegrond (nieuwe berekening van de voorschotten van eiseres en haar partner opgedragen)"
