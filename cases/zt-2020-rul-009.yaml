opmerking: "Voorschot zorgtoeslag 2020 van € 1.238 voor een paar toeslagpartners op een geschat gezamenlijk toetsingsinkomen van € 29.980 (€ 21.980 + € 8.000; de aanvrager is de echtgenoot, aan wie het voorschot is toegekend, de encoding telt de twee inkomens op). De tekst van 2020 geeft met een verzekerde partner 2 × € 1.642 − (4,140% × € 21.430,656 + 13,550% × (€ 29.980 − € 21.430,656)) = € 1.238,33 → € 1.238 (Awir art. 14 lid 4; via build.run_case). Het voorschot van eiseres zelf (€ 1.250, het maximum zonder partner, toegekend vóór het partnerschap met terugwerkende kracht werd aangenomen) noemt de uitspraak zonder het inkomen waarop het rustte; de latere vaststelling van het voorschot van de partner op € 1.834 (10 mei 2021) noemt geen inkomen. Beide zijn daarom geen case. De rechtbank droeg een nieuwe berekening op; het bedrag hier is wat de Dienst op 29 december 2020 op deze inkomens berekende. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
