opmerking: "Eerste definitieve berekening 2017 (31 december 2019): nihil bij het toen in de BRI geregistreerde gezamenlijke toetsingsinkomen van € 45.105 (later door de inspecteur verlaagd tot € 32.534 wegens dubbeltellingen — zt-2017-rul-004). Zelfde huishouden en zelfde invoer als zt-2017-rul-004 (echtpaar in Duitsland, beiden verdragsgerechtigd gelezen uit de rekenregel van de Dienst, woonlandfactor 0,8372). De tekst van 2017 geeft bij € 45.105 nihil met en zonder woonlandfactor (inkomensgrens met partner € 35.116). Opgenomen met de invoer die de Dienst op dat moment gebruikte, zoals zt-2024-rul-002. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
