  publicatie: "Rechtbank Midden-Nederland 22 februari 2022, ECLI:NL:RBMNE:2022:946 (zaaknr. AWB - 21/3021), citaten uit de uitspraak: 'Bij besluit van 31 december 2019 (primair besluit) heeft verweerder het recht op zorgtoeslag voor eiser voor 2017 definitief berekend en vastgesteld op € 0,-.' 'De berekening van de definitieve vaststelling heeft verweerder gebaseerd op het toetsingsinkomen vanuit de Basisregistratie Inkomen (BRI) van € 45.105,-.' 'Bij de definitieve berekening van de zorgtoeslag van eiser over het jaar 2017 heeft verweerder vastgesteld dat het toetsingsinkomen – het gezamenlijke inkomen van eiser en zijn partner – te hoog is om voor zorgtoeslag in aanmerking te komen.' 'Om die reden heeft verweerder het recht op zorgtoeslag van eiser over het jaar 2017 vastgesteld op nihil en het voorschotbedrag teruggevorderd.'"
