opmerking: "Inkomensgrens 2013 met toeslagpartner uit de tekst (gezamenlijk toetsingsinkomen): normpremie = 4,695% × € 19.043,424 + 8,713% × (€ 42.438 − € 19.043,424) = € 894,09 + € 2.038,37 = € 2.932,46; 2 × € 1.478 − € 2.932,46 = € 23,54 (precies € 23,5418) → € 24, net toegekend. Zie syn-043 voor de euro erboven. Met een afgerond drempelinkomen (€ 19.043: € 23,52; € 19.044: € 23,56) blijft het € 24 en blijft € 42.439 € 23 (#1 verschuift in 2013 geen grens). Het maximum 2013 met partner uit de tekst is € 2.062 (€ 2.061,91)."
