opmerking: "Herzien voorschot 2020 (23 september 2020): € 214 bij een door eiser zelf doorgegeven verzamelinkomen van € 29.077, zonder partner. De tekst van 2020: € 1.642 − (1,830% × € 21.430,656 + 13,550% × € 7.646,344) = € 213,74 → € 214 (Awir art. 14 lid 4). De rechtbank: zolang de toeslag niet definitief is, mag de Dienst het voorschot op de eigen opgave baseren (Awir art. 16). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
