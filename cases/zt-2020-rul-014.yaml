  publicatie: "Rechtbank Amsterdam 20 september 2021, ECLI:NL:RBAMS:2021:7868 (zaaknr. AMS 20/6939), citaten uit de uitspraak: 'Op 31 augustus 2020 heef [eiser] een gewijzigd verzamelinkomen doorgegeven van € 29.077,-.' 'Daarom heeft de B/T met het primaire besluit II de huur- en zorgtoeslag voor het jaar 2020 herzien op € 436,- aan huurtoeslag en € 214,- aan zorgtoeslag en het teveel betaalde voorschot van € 4.684,- van [eiser] teruggevorderd.'"
