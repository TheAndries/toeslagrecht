  type: ruling
  publicatie: "Rechtbank Den Haag 11 maart 2025, ECLI:NL:RBDHA:2025:3512 (zaaknrs. SGR 23/7889 en SGR 24/842), citaten uit de uitspraak: 'In deze uitspraak beoordeelt de rechtbank de beroepen van eiseres tegen de (herziene) definitieve berekening van haar zorgtoeslag over de jaren 2013 en 2018.' 'Met de primaire besluiten van 16 maart 2018 en 6 mei 2022 heeft verweerder het recht van eiseres op zorgtoeslag definitief vastgesteld op nihil en de eerder toegekende zorgtoeslag van haar teruggevorderd.' 'Er bestaat geen aanspraak op zorgtoeslag als uit de BRI volgt dat de grondslag sparen en beleggen van de aanvrager in de jaren 2013 en 2018 meer bedraagt dan € 80.000 respectievelijk € 83.415.' 'Uit de BRI blijkt dat de grondslag sparen en beleggen van eiseres over de jaren 2013 en 2018 onderscheidenlijk € 262.876 en € 408.832 bedraagt.' 'Dit betekent dat eiseres voor deze jaren dus geen recht had op zorgtoeslag.'"
