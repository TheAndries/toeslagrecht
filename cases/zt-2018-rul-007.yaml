opmerking: "Herziene definitieve berekening 2018 (6 mei 2022): nihil omdat de grondslag sparen en beleggen van eiseres over 2018 volgens de BRI € 408.832 bedroeg, boven de grens van € 83.415 (Wzt art. 2a lid 1, tekst 2018; Stcrt. 2017, 65628) die de uitspraak zelf noemt — de grens van de Dienst is die van de tekst. De uitspraak noemt de grondslag ná het heffingvrije vermogen; de encoding trekt voor 2018 het heffingvrije vermogen (€ 30.000, Wet IB 2001 art. 5.5) zelf af, dus de invoer is gereconstrueerd als € 408.832 + € 30.000 = € 438.832 (zonder partner gelezen). De uitkomst hangt niet van die reconstructie af. Het inkomen staat niet in de uitspraak; ingevoerd € 0, zonder gevolg voor de uitkomst. Het jaar 2013 van dezelfde uitspraak: zt-2013-rul-010. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
