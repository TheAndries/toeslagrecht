  publicatie: "ABRvS 30 november 2022, ECLI:NL:RVS:2022:3484 (zaaknr. 202104598/1/A2), citaten uit de uitspraak: 'de dienst) [wederpartij] onder meer een voorschot zorgtoeslag, kindgebonden budget en huurtoeslag voor 2019 toegekend van onderscheidenlijk € 2.314,-, € 2.155,- en € 2.291,-.' 'Bij dit besluit is de dienst uitgegaan van een geschat inkomen van € 18.561,- van de toeslagpartner van [wederpartij], [partner] en een geschat inkomen van € 0,- van [wederpartij] zelf.'"
