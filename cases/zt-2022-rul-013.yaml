  type: ruling
  publicatie: "Rechtbank Den Haag 19 december 2025, ECLI:NL:RBDHA:2025:24337 (zaaknr. SGR 24/9186), citaten uit de uitspraak: '1.1 Met het primaire besluit van 6 september 2024 heeft verweerder het recht van eiseres op zorgtoeslag definitief vastgesteld op een bedrag van € 681 en een bedrag van € 610 van haar teruggevorderd.' 'Aan eiseres is in eerste instantie zorgtoeslag voor het jaar 2022 toegekend op basis van een toetsingsinkomen van € 22.883.' 'Op 17 juli 2024 heeft verweerder vanuit de Basisregistratie Inkomensgegevens (BRI) een melding ontvangen dat het inkomen van eiseres voor het jaar 2022 € 27.167 bedraagt.' 'Verweerder heeft op basis daarvan de definitief berekende zorgtoeslag herzien en de teveel ontvangen zorgtoeslag over 2022 teruggevorderd.'"
