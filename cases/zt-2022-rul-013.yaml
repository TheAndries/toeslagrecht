opmerking: "Herziene definitieve berekening 2022 (6 september 2024): € 681 bij een door de BRI gemeld inkomen van € 27.167, zonder partner ('eiseres', geen partner genoemd). De tekst van 2022: € 1.749 − (1,848% × € 22.356 + 13,610% × € 4.811) = € 1.749 − € 1.067,92 = € 681,08 → € 681 (Awir art. 14 lid 4). De eerdere toekenning op een toetsingsinkomen van € 22.883 noemt geen bedrag (€ 610 teruggevorderd; de tekst zou daar € 1.264 geven) en is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
