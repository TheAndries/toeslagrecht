opmerking: "Inkomensgrens 2014 met toeslagpartner uit de tekst: normpremie = 5,210% × € 19.253,376 + 9,118% × (€ 37.145 − € 19.253,376) = € 1.003,10 + € 1.631,36 = € 2.634,46; 2 × € 1.329 − € 2.634,46 = € 23,54 → € 24, net toegekend. Zie syn-039 voor de euro erboven. Met een afgerond drempelinkomen (€ 19.253: € 23,53; € 19.254: € 23,57) blijft het € 24 en blijft € 37.146 € 23: geen verschuiving (DISCREPANCIES.md #1). Het maximum 2014 met partner uit de tekst is € 1.655 (€ 1.654,90). De nihil-beslissing bij € 40.113 met partner (zt-2014-rul-004) ligt boven deze grens."
