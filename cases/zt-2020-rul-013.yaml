  publicatie: "Rechtbank Amsterdam 20 september 2021, ECLI:NL:RBAMS:2021:7868 (zaaknr. AMS 20/6939), citaten uit de uitspraak: 'De hoogte van de huur- en zorgtoeslag voor het jaar 2020 is met een voorschotbeschikking van 27 december 2019 vastgesteld op € 4.084,- aan huurtoeslag en € 1.250,- aan zorgtoeslag op basis van een verzamelinkomen van € 17.443,-.'"
