opmerking: "Voorschot 2020 (27 december 2019): € 1.250 bij een verzamelinkomen van € 17.443, zonder partner ('[eiser]', alleen zijn eigen inkomen) — het maximum zonder partner van de tekst 2020 (€ 1.249,82). De 2019-bedragen van dezelfde uitspraak (€ 1.090 bij € 17.000 en € 835 bij € 22.995) geeft de tekst voor een heel jaar niet; beide zijn precies 11/12 van de jaarbedragen van de tekst (€ 1.189 en € 911), maar de uitspraak noemt geen maanden: niet opgenomen, wel in law/SOURCES.md §4. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
