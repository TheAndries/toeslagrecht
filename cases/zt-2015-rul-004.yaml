opmerking: "Definitieve vaststelling 2015 van 30 september 2016: nihil op een gezamenlijk toetsingsinkomen van € 58.340, met toeslagpartner (Awir art. 3 lid 2 onder a: hetzelfde adres, vijf kinderen uit de relatie). De verdeling van het inkomen is niet gegeven; de case voert het geheel in bij de aanvrager, wat voor de uitkomst niet uitmaakt. De tekst van 2015 geeft nihil: de grens met partner is € 32.655 (via build.run_case). Het voorschot van 21 april 2015, € 1.791, rustte op een inkomen dat de uitspraak niet noemt. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
