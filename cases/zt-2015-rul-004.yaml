  publicatie: "ABRvS 28 februari 2018, ECLI:NL:RVS:2018:664 (zaaknr. 201705229/1/A2), procesverloop en r.o. 1: 'Bij besluit van 30 september 2016 heeft de Belastingdienst/Toeslagen de zorgtoeslag en het kindgebonden budget van [appellante] voor het jaar 2015 vastgesteld op nihil' '[persoon] als toeslagpartner van [appellante] moet worden aangemerkt, omdat zij beiden op hetzelfde adres staan ingeschreven in de BRP. Het gezamenlijke toetsingsinkomen komt daarmee op € 58.340,00, hetgeen ertoe leidt dat de zorgtoeslag en het kindgebonden budget over 2015 op nihil moeten worden vastgesteld.'"
