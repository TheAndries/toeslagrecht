  publicatie: "ABRvS 20 november 2024, ECLI:NL:RVS:2024:4736 (zaaknr. 202306893/1/A2), citaten uit de uitspraak: '[gemachtigde] is de toeslagpartner van [appellante].' 'Aan het besluit van 5 augustus 2022 is ten grondslag gelegd dat [gemachtigde] in het toeslagjaar 2019 onder meer een zogenoemd Niet in Nederland belastbaar inkomen (hierna: NiNbi) van € 75.806,00 had en dat het (gezamenlijke) toetsingsinkomen daardoor hoger is dan het maximale inkomen dat voor dat jaar aanspraak geeft op zorgtoeslag.'"
