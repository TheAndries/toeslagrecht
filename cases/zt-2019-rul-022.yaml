opmerking: "Definitieve berekening 2019 (5 augustus 2022): nihil omdat de toeslagpartner van appellante in 2019 'onder meer' een niet in Nederland belastbaar inkomen van € 75.806 had (een pensioen van de Europese Commissie, Awir art. 8 lid 3), waardoor het gezamenlijke toetsingsinkomen boven de inkomensgrens lag. Het eigen inkomen van appellante en het overige inkomen van de partner staan niet in de uitspraak; ingevoerd € 0 en € 75.806. De uitkomst hangt daar niet van af: de tekst van 2019 met partner geeft nihil boven € 37.885, en elk extra inkomen houdt nihil. Of de partner Zvw-verzekerd was, zegt de uitspraak niet (partner_verzekerd: true ingevoerd); bij dit inkomen geeft de tekst nihil onder beide lezingen. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
