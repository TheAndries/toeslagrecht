  publicatie: "Rechtbank Zeeland-West-Brabant 18 februari 2025, ECLI:NL:RBZWB:2025:877 (zaaknr. BRE 24/2758), citaten uit de uitspraak: 'Met het besluit van 15 september 2023 (primair besluit) heeft de Dienst Toeslagen eisers zorgtoeslag over het jaar 2022 definitief berekend op € 561,- en het te veel verstrekte voorschot van € 781,- teruggevorderd.' 'Het inkomen wordt vastgesteld op € 28.053,-.' 'Daaropvolgend heeft de Dienst Toeslagen bij het primaire besluit de zorgtoeslag voor het jaar 2022 opnieuw berekend op € 561,- en een bedrag van € 781,- teruggevorderd.'"
