  type: ruling
  publicatie: "Rechtbank Amsterdam 23 maart 2023, ECLI:NL:RBAMS:2023:1604 (zaaknr. AMS 22/3980), citaten uit de uitspraak: 'Met het besluit van 1 oktober 2021 (het primaire besluit) heeft verweerder de huur- en zorgtoeslag van eiseres over het jaar 2020 definitief berekend en vastgesteld op € 1.189,- respectievelijk € 814,-.' 'De inspecteur van de inkomstenbelasting (de inspecteur) heeft het jaarinkomen van eiseres over 2020 definitief vastgesteld op € 26.645,-.' 'Eiseres moet € 440,- aan zorgtoeslag en € 2.635,- aan huurtoeslag terugbetalen.' 'De rechtbank stelt vast dat niet in geschil is dat verweerder bij het berekenen van de huur- en zorgtoeslag rekening had moeten houden met de ontslagvergoeding.'"
