opmerking: "Definitieve berekening 2020 (1 oktober 2021): € 814 bij het door de inspecteur vastgestelde jaarinkomen van € 26.645 (een ontslagvergoeding telt mee), zonder partner als gelezen. De tekst van 2020 geeft bij die invoer € 543 (€ 1.642 − (1,830% × € 21.430,656 + 13,550% × € 5.214,344) = € 543,28) en met partner € 1.690; geen van beide is € 814, en ook een deel van het jaar verklaart het niet (€ 814 is hoger dan het jaarbedrag van de tekst zonder partner). De uitspraak noemt geen partner, geen maanden, geen woonland en geen ander inkomen voor de zorgtoeslag; het teruggevorderde bedrag (€ 440) is niet € 1.250 − € 814. Opgenomen als DISCREPANCIES.md #12 (open); deze case faalt daarom bij de check en is als zodanig gelogd. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
