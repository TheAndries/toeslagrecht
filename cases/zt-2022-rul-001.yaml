opmerking: "Eerste uitkomst van de Dienst voor 2022 in het corpus, en de eerste 2022-case die niet uit de folder van de Dienst komt: een voorschot op een geschat inkomen van € 3.628, onder het drempelinkomen (€ 22.356), dus het maximum zonder partner uit de tekst van 2022: normpremie 1,848% × € 22.356 = € 413,14; € 1.749 − € 413,14 = € 1.335,86 → € 1.336 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner zou het € 2.553 zijn). Het herziene voorschot op nihil staat in zt-2022-rul-002. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
