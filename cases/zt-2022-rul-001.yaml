  publicatie: "ABRvS 9 oktober 2024, ECLI:NL:RVS:2024:4094 (zaaknr. 202400646/1/A2), r.o. 1: 'De Belastingdienst/Toeslagen heeft bij besluit van 28 december 2021 aan [appellant] een voorschot zorgtoeslag over 2022 verleend van € 1.336,-. De hoogte van het voorschot is gebaseerd op een geschat toetsingsinkomen over 2022 van € 3.628,-.'"
