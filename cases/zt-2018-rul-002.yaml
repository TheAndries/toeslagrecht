  publicatie: "Rechtbank Midden-Nederland 5 februari 2021, ECLI:NL:RBMNE:2021:668 (zaaknr. UTR 20/725), overwegingen (feiten): 'Het voorschot voor de zorgtoeslag bedroeg € 1.061 en voor het kindgebonden budget was dat € 1.599. Daarbij ging verweerder uit van een (geschat) gezamenlijk inkomen in 2018 van eiseres en haar echtgenoot van € 28.304. Daarna is bij verweerder bekend geworden dat het gezamenlijke inkomen van eiseres en haar echtgenoot in 2018 een stuk hoger lag, namelijk € 37.125. Omdat het gezamenlijke inkomen boven de maximale inkomensgrens van € 35.996 komt, hebben eiseres en haar echtgenoot geen recht meer op zorgtoeslag. Als gevolg hiervan moeten eiseres en haar echtgenoot € 1.661 terugbetalen' (zorgtoeslag en kindgebonden budget samen). Beroep ongegrond"
