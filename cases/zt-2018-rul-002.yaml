opmerking: "Zorgtoeslag 2018 definitief nihil voor een paar toeslagpartners op een gezamenlijk inkomen van € 37.125, boven de inkomensgrens met partner. De uitspraak noemt die grens: 'de maximale inkomensgrens van € 35.996'. Dat is precies de grens die de tekst van 2018 geeft met het onafgeronde drempelinkomen (€ 20.450,88; zie zt-2018-syn-022/-023): bij € 35.996 nog € 23,55 → € 24, bij € 35.997 € 23,41 → nihil (Awir art. 14 lid 4–5). Een naar beneden afgerond drempelinkomen (€ 20.450) zou de grens op € 35.995 leggen; de Dienst heeft het drempelinkomen voor 2018 dus niet naar beneden afgerond (DISCREPANCIES.md #1). € 37.125 ligt boven elke lezing van de grens, zodat deze uitkomst zelf #1 niet beslist; de grens die de uitspraak noemt doet dat wel. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
