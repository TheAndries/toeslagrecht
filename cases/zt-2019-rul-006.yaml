opmerking: "Definitieve vaststelling 2019 van € 941 op het BRI-inkomen van € 22.779, door eiser erkend. Zonder partner geeft de tekst van 2019 € 940,61 → € 941 (Awir art. 14 lid 4); met een verzekerde partner zou het € 2.066 zijn. Het verschil met het voorschot (zt-2019-rul-005), € 152, is precies wat de uitspraak als teruggevorderde zorgtoeslag noemt. De rechtbank beperkte de terugvordering tot € 79 vanwege de evenredigheid (de huurtoeslaggrens was met € 79 overschreden); de hoogte van de zorgtoeslag zelf was niet in geschil. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
