opmerking: "Maximum zonder partner 2026: de tekst geeft € 1550 per jaar (Awir art. 14 lid 4); € 1550 / 12 = € 129.17, door de Dienst gepubliceerd als € 129 per maand — naar beneden afgerond. Het maandbedrag staat niet in de wet (SOURCES.md open item 1); de encoding modelleert de praktijk van de Dienst (DISCREPANCIES.md #5). Inkomen hier € 10.000, onder het drempelinkomen; elk inkomen tot het drempelinkomen geeft hetzelfde."
