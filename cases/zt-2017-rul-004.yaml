  type: ruling
  publicatie: "Rechtbank Midden-Nederland 22 februari 2022, ECLI:NL:RBMNE:2022:946 (zaaknr. AWB - 21/3021), citaten uit de uitspraak: 'Hangende het beroep heeft verweerder bij brief van eveneens 18 oktober 2021 meegedeeld dat de inspecteur van de Belastingdienst het toetsingsinkomen over 2017 van eiser en zijn echtgenote heeft aangepast.' 'Het toetsingsinkomen is vastgesteld op € 32.534,-.' 'Bij de definitieve berekening van de zorgtoeslag van eiser over het jaar 2017 heeft verweerder vastgesteld dat het toetsingsinkomen – het gezamenlijke inkomen van eiser en zijn partner – te hoog is om voor zorgtoeslag in aanmerking te komen.' 'De Toeslagenkaart vermeldt als inkomensgrens voor het recht op zorgtoeslag 2017 voor een aanvrager met partner € 35.116,-.' 'Gezamenlijke standaardpremie van € 2.561,84' 'De normpremie bedraagt een percentage (5.055%) van het drempelinkomen ( € 20.109,-) vermeerderd met een percentage (13,56%) van het toetsingsinkomen (€ 32.534,-) van de verzekerde in dat jaar voorzover dat toetsingsinkomen het drempelinkomen te boven gaat:' '€ 20.109- x 5,055% + (€ 32.534 -/- € 20.109) x 13,46% is € 2.688,91.' 'Omdat de normpremie van € 2.688,91 hoger is dan de standaardpremie van € 2.561,84, heeft verweerder terecht geconstateerd dat eiser geen recht heeft op zorgtoeslag.'"
