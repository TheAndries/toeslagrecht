opmerking: "Definitieve berekening 2017 na correctie van het toetsingsinkomen door de inspecteur (hangende beroep, brief van 18 oktober 2021): nihil bij een gezamenlijk toetsingsinkomen van € 32.534 voor een in Duitsland wonend echtpaar (de uitspraak noemt Duitsland en heet 'berekening niet in Nederland wonende toeslagaanvrager'). De rechtbank citeert de rekenregel van de Dienst volledig: gezamenlijke standaardpremie € 2.561,84 = 2 × € 1.530 × 0,8372 (de woonlandfactor Duitsland 2017 van parameters/2017.yaml, door de Dienst op beide standaardpremies toegepast — de case leest daaruit dat ook de partner verdragsgerechtigd en geen Zvw-verzekerde was, en vult partner_verzekerd: false in); normpremie € 20.109 × 5,055% + (€ 32.534 − € 20.109) × 13,46% = € 2.688,91 (de uitspraak schrijft in de formule eenmaal '13,56%' en rekent met 13,46%); normpremie > standaardpremie → geen zorgtoeslag. De Dienst noemt het drempelinkomen 2017 '€ 20.109' — de tekst geeft € 20.108,736, dus naar boven afgerond (DISCREPANCIES.md #1) — en de Toeslagenkaart 2017 een inkomensgrens met partner van € 35.116, gelijk aan die van de tekst. De encoding: drempelinkomen € 20.108,736, normpremie € 2.688,94, standaardpremies 2 × € 1.530 × 0,8372 = € 2.561,83 → nihil (Wzt art. 3, tekst 2017, voor de factor; art. 2 lid 1–3 voor de normpremie). Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0); de uitsplitsing staat niet in de uitspraak en doet er voor de uitkomst niet toe. Het voorschot 2017 van € 1.220 heeft geen genoemd inkomen en is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
