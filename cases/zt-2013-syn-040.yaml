opmerking: "Inkomensgrens 2013 zonder toeslagpartner uit de tekst: normpremie = 2,195% × € 19.043,424 + 8,713% × (€ 30.939 − € 19.043,424) = € 418,00 + € 1.036,46 = € 1.454,46; € 1.478 − € 1.454,46 = € 23,54 (precies € 23,5353) → € 24 (Awir art. 14 lid 4), net toegekend (lid 5). Zie syn-041 voor de euro erboven. Met een afgerond drempelinkomen (€ 19.043: € 23,51; € 19.044: € 23,57; DISCREPANCIES.md #1) blijft het € 24 en blijft € 30.940 € 23 — zoals 2014 een jaar waarin de afronding van het drempelinkomen geen grens verschuift. De hoogste grens van de reeks 2013–2026: het afbouwpercentage was 8,713% (2014: 9,118%; 2015: 13,400%). Wordt een published case zodra een publicatie van de Dienst voor 2013 de grens noemt."
