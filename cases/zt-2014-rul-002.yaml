  publicatie: "Hof Den Haag 28 maart 2017, ECLI:NL:GHDHA:2017:1067 (zaaknr. BK-16/00409), r.o. 3.1 en 3.3: 'Bij beschikkingen van 14 augustus 2015 heeft de Belastingdienst/Toeslagen de aan belanghebbende toekomende zorgtoeslag en huurtoeslag voor het jaar 2014 definitief vastgesteld op € 814 respectievelijk € 1.513. Deze beschikkingen zijn gebaseerd op het toetsingsinkomen van het jaar 2014 van € 19.810.' Het toetsingsinkomen is het laatst bepaalde belastbare loon (geen aanslag IB over 2014; loongegevens r.o. 3.2 tellen op tot € 19.810); het Hof bevestigt het. Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:GHDHA:2017:1067"
