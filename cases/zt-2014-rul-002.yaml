opmerking: "Definitieve berekening 2014 zonder partner, € 557 boven het drempelinkomen. Uit de tekst: normpremie = 2,410% × € 19.253,376 + 9,118% × (€ 19.810 − € 19.253,376) = € 464,01 + € 50,75 = € 514,76; € 1.329 − € 514,76 = € 814,24 → € 814 (Awir art. 14 lid 4). De uitspraak noemt geen partner en geen vermogen; het bedrag bewijst éénmaal de standaardpremie (met partner: € 1.604). Met een afgerond drempelinkomen (€ 19.253 of € 19.254, DISCREPANCIES.md #1) komt hetzelfde hele bedrag uit (€ 814,21 / € 814,27). Wordt verified zodra een met naam genoemde mens de invoer met de uitspraak vergelijkt (CASES.md; ASKS.md 9)."
