  publicatie: "ABRvS 18 december 2024, ECLI:NL:RVS:2024:5262 (zaaknr. 202303472/1/A2), procesverloop en r.o. 1: 'Bij besluit van 31 juli 2021 heeft de Belastingdienst/Toeslagen de zorg- en huurtoeslag van [appellante] over het jaar 2020 definitief vastgesteld op € 722,- onderscheidenlijk nihil. Daarnaast zijn de te veel betaalde voorschotten van € 529,- aan zorgtoeslag en € 2.653,- aan huurtoeslag teruggevorderd.' 'De voorschotten zijn gebaseerd op een geschat toetsingsinkomen van € 16.815,-. De Belastingdienst/Toeslagen heeft op 10 juni 2021 een melding uit de Basisregistratie Inkomen ontvangen dat het verzamelinkomen van [appellante] over 2020 € 25.328,- bedroeg' (met daarin een beëindigingsvergoeding van € 5.884,11 en € 1.781,59 PBL en vakantie-uren). R.o. 3.2: geen grondslag om inkomensbestanddelen buiten beschouwing te laten (ECLI:NL:RVS:2017:659). Hoger beroep ongegrond"
