opmerking: "Een in Nederland verzekerde aanvrager ('een Nederlandse zorgverzekering') met een in Marokko wonende echtgenote die 'via het Centraal Administratiekantoor' is meeverzekerd (verdragsgerechtigd, Zvw art. 69); de uitspraak noemt geen toetsingsinkomen en noemt de woonlandfactor niet met een getal. Dezelfde situatie als zt-2017-rul-007 / zt-2018-rul-008 (ECLI:NL:RVS:2021:1071/1072, een andere appellant): DISCREPANCIES.md #16 (law); de encoding geeft voor deze partner vóór 06-11-2024 'undetermined' (Wzt art. 3 oud noemt hem niet). Verwacht is het herziene voorschot 2018 van 7 juni 2019, € 594: de optelmethode van de Dienst (standaardpremie € 1.546 (Stcrt. 2017, 68107) + € 1.546 × woonlandfactor Marokko 2018 0,0125 (Stcrt. 2017, 66088) − normpremie met partner 4,750% × € 20.450,88 = € 971,42) geeft € 593,91 → € 594 (Awir art. 14 lid 4) bij elk gezamenlijk toetsingsinkomen tot het drempelinkomen — hetzelfde bedrag als het voorschot 2018 in zt-2018-rul-008, met dezelfde rekenwijze; de case voert € 0 in. Lezing van de operator: dat de Dienst de factor op de premie van de partner toepaste en beide premies optelde, volgt uit het bedrag, niet uit een geciteerde berekening. Herroepen door de Afdeling (dictum VI) na de nieuwe definitieve berekening van 22 juli 2021 (zt-2018-rul-010)."
