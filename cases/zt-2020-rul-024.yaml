  publicatie: "Rechtbank Midden-Nederland 21 mei 2025, ECLI:NL:RBMNE:2025:2428 (zaaknr. UTR 24/4587), citaten uit de uitspraak: 'Op 15 februari 2023 heeft Dienst Toeslagen een melding ontvangen vanuit de Basisregistratie Inkomen (BRI) waaruit blijkt dat de inspecteur voor de inkomensbelasting (de inspecteur) het toetsingsinkomen heeft vastgesteld op € -5.855,- en de grondslag sparen en beleggen op € 30.777,-.' 'Op 1 april 2023 heeft Dienst Toeslagen de zorgtoeslag definitief vastgesteld op € 1.250,-.'"
