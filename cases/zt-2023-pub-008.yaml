  publicatie: "Dienst Toeslagen, Handboek Toeslagen, versie 2026.3 (publicatiedatum 20 oktober 2026), hoofdstuk 21 Zorgtoeslag, paragraaf 1.6.4 Voorbeelden berekening, Voorbeeld 2023: 'Een aanvrager zonder partner met een toetsingsinkomen van € 25.000. Normpremie = € 25.070 x 0,123% = € 30,8361. Zorgtoeslag = € 1.889 - € 30,8361 = € 1.858,16 per jaar. Het toetsingsinkomen is lager dan het drempelinkomen, dus het tweede deel van de berekening van de normpremie is niet van toepassing.'"
