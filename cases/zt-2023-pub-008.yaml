opmerking: "De Dienst rekent met het drempelinkomen 'vastgesteld op' € 25.070 (DISCREPANCIES.md #1); de tekst geeft € 25.069,824 → normpremie € 30,8359 en aanspraak € 1.858,1641. Op de cent gelijk: € 30,84 en € 1.858,16. Dit is tevens de maximale zorgtoeslag 2023 zonder partner (€ 1.858, Awir art. 14 lid 4)."
