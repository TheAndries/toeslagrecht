  publicatie: "ABRvS 13 oktober 2021, ECLI:NL:RVS:2021:2281 (zaaknr. 202006813/1/A2), citaten uit de uitspraak: 'Aan het besluit van 9 augustus 2019, gehandhaafd bij het besluit van 4 november 2019, heeft de Belastingdienst/Toeslagen ten grondslag gelegd dat het toetsingsinkomen van [appellant] € 25.598,00 bedraagt, waardoor het recht op zorgtoeslag € 445,00 is.' 'Ook voert [appellant] aan dat hij in eerste instantie geen zorgtoeslag over 2015, 2016 en 2017 heeft ontvangen en dat het in 2018 ontvangen bedrag van € 536,00 achterstallige zorgtoeslag over die jaren is.'"
