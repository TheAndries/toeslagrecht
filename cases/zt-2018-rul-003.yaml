  tegemoetkoming: "445"
opmerking: "Definitieve vaststelling 2018 (9 augustus 2019): € 445 bij een toetsingsinkomen van € 25.598, zonder partner (de uitspraak noemt geen partner; met partner zou de tekst € 1.426 geven). De tekst van 2018: € 1.546 − (1,990% × € 20.450,88 + 13,490% × € 5.147,12) = € 444,68 → € 445 (Awir art. 14 lid 4). De eerste uitkomst van de Dienst voor 2018 op de afbouwlijn zonder partner in het corpus. € 91 teruggevorderd; het voorschot (€ 536, dat appellant achterstallige toeslag over 2015–2017 noemt) heeft geen genoemd inkomen en is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
