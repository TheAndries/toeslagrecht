opmerking: "Definitieve berekening 2024 (8 augustus 2025): € 34 'voor het gehele jaar' bij een definitief inkomen van € 37.419, zonder partner. De tekst van 2024: € 1.987 − (1,879% × € 26.819,424 + 13,670% × € 10.599,576) = € 1.987 − € 1.952,90 = € 34,10 → € 34 (Awir art. 14 lid 4), boven het minimum van € 24 (lid 5). Het laagste toegekende bedrag voor 2024 in het corpus, op € 77 onder de inkomensgrens zonder partner van de tekst (€ 37.496). € 605 teruggevorderd, inclusief € 2 rente. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
