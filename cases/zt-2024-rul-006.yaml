  publicatie: "Rechtbank Zeeland-West-Brabant 27 mei 2026, ECLI:NL:RBZWB:2026:5027 (zaaknr. BRE 25/5946), citaten uit de uitspraak: 'Met het besluit van 8 augustus 2025 heeft de Dienst Toeslagen eisers zorgtoeslag over het jaar 2024 definitief berekend op € 34,- en het te veel verstrekte voorschot zorgtoeslag van € 605,- teruggevorderd.' 'Uit informatie van de Basisregistratie Inkomen (BRI) blijkt het definitieve inkomen in dat jaar € 37.419,- te zijn.' 'Het recht op zorgtoeslag voor 2024 bedraagt € 34,- voor het gehele jaar, wat resulteert in een totale terugvordering van € 605,-.'"
