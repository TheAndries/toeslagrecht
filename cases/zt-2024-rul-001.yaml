  publicatie: "Rechtbank Midden-Nederland 26 september 2024, ECLI:NL:RBMNE:2024:5552 (zaaknrs. UTR 23/4153 en UTR 24/4548), r.o. 17–19: 'Voor het recht op zorgtoeslag over 2024 is de rekensom hetzelfde maar zijn de getallen anders. De standaardpremie voor dat jaar voor twee personen is op € 3.974 gesteld, de woonlandfactor voor Polen is 0,1613 en het drempelinkomen € 26.819.' 'Dienst Toeslagen heeft over 2024 gerekend met een toetsingsinkomen van € 31.565.' 'De rekensom over 2024 komt op een standaardpremie van € 641 en een normpremie van € 1.790, wat betekent dat ook dat jaar de normpremie hoger is dan de standaardpremie. Ook over 2024 heeft eiser dus geen recht op zorgtoeslag.' Voetnoten: '€ 3.974 maal 0,1613'; '4,256 % van € 26.819 plus 13,67 % van € 4.746'. Beroep ongegrond"
