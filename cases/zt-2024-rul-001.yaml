opmerking: "Voorschotbeschikking 2024 (28 december 2023, gehandhaafd 10 mei 2024): geen zorgtoeslag voor hetzelfde verdragsgerechtigde echtpaar in Polen. De tekst van 2024: standaardpremie 2 × € 1.987 × 0,1613 = € 641,01 (Wzt art. 3, tekst 2024 tot 06-11-2024; Regeling zorgverzekering bijlage 4, Polen 0,1613), normpremie 4,256% × € 26.819,424 + 13,67% × € 4.745,576 = € 1.790,16 (art. 2 lid 3), nihil (via build.run_case). De Dienst rekent met het drempelinkomen 'vastgesteld op' € 26.819, naar beneden afgerond zoals in zijn brochure 2024 (DISCREPANCIES.md #1), en komt op € 641 en € 1.790; voor de uitkomst maakt dat niets uit. Eerste uitkomst van de Dienst voor 2024 in het corpus buiten de brochure. Het inkomen is het bedrag waarmee de Dienst rekende ('gerekend met een toetsingsinkomen van € 31.565'; eiser bestreed het, de rechtbank volgde de Dienst); de case voert het in bij de aanvrager, partner € 0; nihil onder elke verdeling. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
