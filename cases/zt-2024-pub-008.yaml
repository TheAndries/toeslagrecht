opmerking: "Wzt art. 2 lid 4 (partner geen verzekerde: de helft). De Dienst rekent met het drempelinkomen 'vastgesteld op' € 26.819 (naar beneden, DISCREPANCIES.md #1); de tekst geeft € 26.819,424 → normpremie € 3.353,3194, (€ 3.974 − € 3.353,3194) / 2 = € 310,3403 → € 310,34. De centen verschillen (#1); het hele bedrag van Awir art. 14 lid 4 is in beide gevallen € 310. Het gezamenlijke inkomen is bij de aanvrager ingevoerd, partner € 0; de uitkomst hangt er niet van af. Eerste gepubliceerd voorbeeld van de Dienst voor art. 2 lid 4 in het corpus."
