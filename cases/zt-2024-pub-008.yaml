  publicatie: "Dienst Toeslagen, Handboek Toeslagen, versie 2026.3 (publicatiedatum 20 oktober 2026), hoofdstuk 21 Zorgtoeslag, paragraaf 1.6.4 Voorbeelden berekening, Voorbeeld 2024: 'Een aanvrager met een partner die niet verzekeringsplichtig is. Ze hebben een gezamenlijk toetsingsinkomen van € 43.000. Normpremie = € 26.819 x 4,256% + (€ 43.000 - € 26.819) x 13,670% = € 3.353,35934. Zorgtoeslag = € 1.987 x 2 - € 3.353,35934 = € 620,640666 / 2 = € 310,32 per jaar. De uitkomst wordt vervolgens gehalveerd omdat de partner niet verzekeringsplichtig is.'"
