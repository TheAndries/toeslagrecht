opmerking: "Maximum zonder partner 2022: de tekst geeft € 1336 per jaar (Awir art. 14 lid 4); € 1336 / 12 = € 111.33, door de Dienst gepubliceerd als € 111 per maand — naar beneden afgerond. Het maandbedrag staat niet in de wet (SOURCES.md open item 1); de encoding modelleert de praktijk van de Dienst (DISCREPANCIES.md #5). Inkomen hier € 10.000, onder het drempelinkomen; elk inkomen tot het drempelinkomen geeft hetzelfde."
