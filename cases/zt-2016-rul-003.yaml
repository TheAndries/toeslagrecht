  publicatie: "ABRvS 14 oktober 2020, ECLI:NL:RVS:2020:2416, r.o. 1 en 4: 'De dienst heeft bij besluit van 4 augustus 2017 de huurtoeslag en zorgtoeslag over 2016 definitief berekend en op nihil gesteld, omdat het toetsingsinkomen van [appellant] van € 29.027,00 hoger is dan de inkomensgrenzen voor huurtoeslag en zorgtoeslag in 2016.' 'Verder is niet in geschil dat [appellant] een transitievergoeding van € 6.000,00 heeft ontvangen en dat het toetsingsinkomen € 29.027,00 is.'"
