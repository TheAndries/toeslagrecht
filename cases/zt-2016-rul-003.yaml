opmerking: "Definitieve berekening 2016 van 4 augustus 2017: zorgtoeslag nihil op een toetsingsinkomen van € 29.027 (een transitievergoeding van € 6.000 telde mee; de Afdeling: geen bijzonder inkomen). De uitspraak noemt geen partner; zonder partner geeft de tekst van 2016 nihil (de grens is € 27.013; via build.run_case). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
