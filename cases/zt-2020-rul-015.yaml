opmerking: "Definitieve berekening 2020 (10 september 2021): nihil bij een geregistreerd gezamenlijk inkomen van eiser en zijn partner van € 44.232 (tekst 2020: inkomensgrens met partner € 38.945). Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0); de uitsplitsing staat niet in de uitspraak. Het geschil ging over de hoogte van het geregistreerde inkomen (BRI), niet over de berekening. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
