  type: ruling
  publicatie: "Rechtbank Den Haag 10 februari 2023, ECLI:NL:RBDHA:2023:3233 (zaaknr. SGR 22/1043), citaten uit de uitspraak: 'Bij de beschikking definitieve berekening toeslagen van 10 september 2021 (het primaire besluit) is de zorgtoeslag van eiser voor het jaar 2020 definitief vastgesteld op € 0,- op basis van een geregistreerd inkomen van € 44.232,-.' 'Dit heeft ertoe geleid dat bij de berekening van de zorgtoeslag rekening is gehouden met een gezamenlijk inkomen van eiser en zijn partner van € 44.232,-.'"
