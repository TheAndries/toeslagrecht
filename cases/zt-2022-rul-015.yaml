opmerking: "Voorschot 2022: € 1.336 bij een geschat inkomen van € 7.919, zonder partner ('eiser', geen partner genoemd). De tekst van 2022: het inkomen ligt onder het drempelinkomen van € 22.356, dus het maximum € 1.749 − 1,848% × € 22.356 = € 1.335,86 → € 1.336 (Awir art. 14 lid 4). De definitieve berekening van dezelfde uitspraak: zt-2022-rul-016 (DISCREPANCIES.md #14). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
