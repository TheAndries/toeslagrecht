  publicatie: "ABRvS 28 oktober 2015, ECLI:NL:RVS:2015:3282 (zaaknr. 201505333/1/A2; bevestigt Rechtbank Rotterdam 2 juni 2015, zaaknr. 14/7833), procesverloop en r.o. 2–3.1: 'Bij besluit van 12 september 2014 heeft de Belastingdienst/Toeslagen de zorgtoeslag van [appellant] over 2013 definitief vastgesteld op nihil en € 1.068,00 teruggevorderd.' '[appellant] heeft over 2013 een voorschot zorgtoeslag van € 1.060,00 ontvangen.' 'Volgens de dienst bedroeg het vermogen van [appellant] op 1 januari 2013 € 97.904,00, zijnde spaartegoeden ter waarde van € 101.043,00 en groene beleggingen ter waarde van € 18.000,00, verminderd met een bedrag van € 21.139,00 heffingsvrij vermogen. Wegens dit vermogen en het bepaalde in artikel 2a, eerste lid, van de Wzt, heeft [appellant] geen aanspraak op zorgtoeslag over 2013, aldus de dienst.' 'De rechtbank en de Belastingdienst/Toeslagen hebben artikel 2a, eerste lid, van de Wzt dan ook juist uitgelegd door ervan uit te gaan dat bij de beoordeling of aanspraak op zorgtoeslag bestaat groene beleggingen bij bepaling van het vermogen dienen te worden meegeteld.' Hoger beroep ongegrond"
