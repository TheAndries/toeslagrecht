  publicatie: "Rechtbank Zeeland-West-Brabant 9 januari 2026, ECLI:NL:RBZWB:2026:60 (zaaknrs. BRE 21/2894 en 22/3072), citaten uit de uitspraak: 'Op 26 januari 2022 heeft de Dienst Toeslagen een melding ontvangen vanuit de BRI dat het inkomen van eiser in 2019 € 29.413,- bedraagt.' 'Op 2 februari 2022 heeft de Dienst Toeslagen een melding ontvangen vanuit de BRI dat zijn toeslagpartner in 2019 geen inkomen heeft ontvangen.' 'Naar aanleiding van deze inkomensgegevens heeft de Dienst Toeslagen met het primaire besluit II de zorgtoeslag voor het jaar 2019 definitief berekend op € 1.169,- en € 1.210,- teruggevorderd.'"
