opmerking: "Definitieve berekening 2019 (9 maart 2022): € 1.169 bij een inkomen van eiser van € 29.413 en geen inkomen van zijn toeslagpartner, zoals de BRI die op 26 januari en 2 februari 2022 meldde. De tekst van 2019 met partner: 2 × € 1.609 − (4,315% × € 20.940,768 + 13,52% × € 8.472,232) = € 3.218 − € 2.049,04 = € 1.168,96 → € 1.169 (Awir art. 14 lid 4). Een eerdere BRI-melding (17 maart 2021) stelde het inkomen van eiser op € 11.169 en dat van de partner op € 219; de beslissing van 9 maart 2022 volgt op de latere meldingen, zoals r.o. 3.2 zegt. De zoon als medebewoner telt voor de huurtoeslag, niet voor de zorgtoeslag (Awir art. 7 lid 1: partner). Het voorschot van dezelfde uitspraak is zt-2019-rul-020. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
