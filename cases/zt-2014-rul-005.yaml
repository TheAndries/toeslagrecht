opmerking: "Voorschot 2014 van 27 december 2013, € 865, op een geschat geïndexeerd toetsingsinkomen van € 14.591, onder het drempelinkomen: het maximum zonder partner van de tekst van 2014, € 1.329 − 2,410% × € 19.253,376 = € 864,99 → € 865 (via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
