opmerking: "Voorschot zorgtoeslag 2019 van € 1.093 op een geschat jaarinkomen van € 21.655. De uitspraak noemt geen partner; de bedragen bewijzen er geen: de tekst van 2019 geeft zonder partner € 1.092,57 → € 1.093 (Awir art. 14 lid 4; via build.run_case) en met een verzekerde partner € 2.218. De uitspraak noemt het inkomen 'jaarinkomen', niet toetsingsinkomen; de herziening op het BRI-inkomen (zt-2019-rul-006) laat zien dat het als toetsingsinkomen is gebruikt. Vijfde uitkomst van de Dienst voor 2019 met inkomen, de eerste uit een rechtbankuitspraak. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
