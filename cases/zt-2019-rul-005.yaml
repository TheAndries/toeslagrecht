  publicatie: "Rechtbank Gelderland 10 maart 2022, ECLI:NL:RBGEL:2022:1259 (zaaknr. AWB 20/5717), r.o. 2: 'Eiser heeft over 2019 voorschotten zorgtoeslag ontvangen van € 1.093 en voorschotten huurtoeslag van € 1.632. Bij de bepaling van de hoogte van de voorschotten is verweerder uitgegaan van een geschat jaarinkomen van € 21.655. Op 11 juni 2020 heeft verweerder informatie uit de Basisregistratie Inkomen (BRI) ontvangen, waaruit blijkt dat het inkomen van eiser in het jaar 2019 € 22.779 bedroeg. Op basis van dat inkomen heeft verweerder in het besluit van 7 augustus 2020 de zorgtoeslag over 2019 definitief vastgesteld op € 941 en de huurtoeslag op € 0.' R.o. 3: 'Eiser erkent dat zijn inkomen over 2019 € 22.779 bedroeg.' Beroep gegrond op de evenredigheid van de terugvordering (beperkt tot € 79, de overschrijding van de huurtoeslaggrens); de herziening zelf 'niet in geschil'"
