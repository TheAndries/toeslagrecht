opmerking: "De herziening 2013 van de Dienst (13-03-2015) op de verzamelinkomens uit de aanslagen: gezamenlijk € 35.469 + € 1.576 = € 37.045 met toeslagpartner. Uit de tekst: normpremie = 4,695% × € 19.043,424 + 8,713% × (€ 37.045 − € 19.043,424) = € 894,09 + € 1.568,48 = € 2.462,57; 2 × € 1.478 − € 2.462,57 = € 493,43 → € 493 (Awir art. 14 lid 4) — wat de Dienst besliste. Het teruggevorderde bedrag in de uitspraak (€ 1.612) is niet het verschil tussen het voorschot van € 2.062 (rul-001) en € 493 (€ 1.569); de uitspraak verklaart het verschil niet en het project speculeert niet; het is geen invoer van deze case. Met een afgerond drempelinkomen (€ 19.043: € 493,41; € 19.044: € 493,45) ook € 493 — beslist #1 niet. Wordt verified zodra een met naam genoemde mens de invoer met de uitspraak vergelijkt (CASES.md; ASKS.md 9)."
