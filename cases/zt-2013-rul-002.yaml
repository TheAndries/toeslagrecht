  publicatie: "ABRvS 15 maart 2017, ECLI:NL:RVS:2017:662 (zaaknr. 201603050/1/A2), r.o. 1: bij besluit van 13 maart 2015 heeft de Belastingdienst/Toeslagen 'de vastgestelde zorgtoeslag van [appellant] over 2013 herzien en vastgesteld op € 493,00', 'op basis van deze door de belastinginspecteur vastgestelde verzamelinkomens' van de aanvrager en zijn toeslagpartner, in de aanslagen inkomstenbelasting 2013 'vastgesteld op onderscheidenlijk € 35.469,00 en € 1.576,00' ('Het verzamelinkomen van [appellant] omvat mede de door hem in 2013 ontvangen afkoopsommen van pensioenaanspraken.'); 'Tevens is € 1.612,00 aan te veel betaalde zorgtoeslag teruggevorderd.' De Afdeling laat de herziening in stand: de Awir kent geen hardheidsclausule en de Wzt geen grondslag om afkoopsommen buiten het toetsingsinkomen te laten. Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:RVS:2017:662"
