opmerking: "Herzien voorschot 2023 over een DEEL van het jaar, op hetzelfde geschatte inkomen als zt-2023-rul-001 (€ 11.204, vol jaar € 1.858). De encoding rekent alleen hele jaren en geeft € 1.858 (DISCREPANCIES.md #9). € 1.703 = 11/12 × € 1.858 (€ 1.703,17) of 11/12 × € 1.858,16 (€ 1.703,32) → € 1.703; de uitspraak noemt het aantal maanden niet. Samen met rul-002 (€ 992 = 11/12 × € 1.082) laat dit zien dat de Dienst bij een deel van het jaar het (afgeronde) jaarbedrag naar rato van de maanden neemt en het resultaat opnieuw afrondt. Wordt 'verified' op dezelfde voet als rul-001 (ASKS.md 9)."
