  publicatie: "Rechtbank Midden-Nederland 17 september 2025, ECLI:NL:RBMNE:2025:4925 (zaaknr. UTR 25/2434), r.o. 4: 'Eiser en zijn toeslagpartner wonen sinds 2021 in [land]. ... Dienst Toeslagen heeft op 3 oktober 2023 het berekeningsinkomen over het jaar 2024 voor eiser en zijn toeslagpartner geschat op € 21.441,- respectievelijk € 821,-. Aan eiser is daarna een voorschot van € 0,- verleend. Op 23 april 2024 heeft Dienst Toeslagen het voorschot over het jaar 2024 herzien naar € 2.833,-. Dienst Toeslagen heeft daarbij - naar eigen zeggen - abusievelijk geen gebruik gemaakt van de van toepassing zijnde woonlandfactor. Op 12 juni 2024 heeft Dienst Toeslagen daarom het voorschot over het jaar 2024 herzien naar € 0,- en een bedrag van € 1.416,- van eiser teruggevorderd.' Beroep ongegrond"
