opmerking: "Herzien voorschot 2024 van 23 april 2024, € 2.833, op een geschat gezamenlijk inkomen van € 21.441 + € 821 = € 22.262, door de Dienst berekend zonder woonlandfactor, naar eigen zeggen abusievelijk: het paar woont buiten Nederland en de factor hoorde te worden toegepast. De case legt vast wat de Dienst bij die beschikking berekende, met de invoer die hij toen gebruikte (beiden als verzekerde). De tekst van 2024 geeft bij die invoer hetzelfde: 2 × € 1.987 − 4,256% × € 26.819,424 = € 2.832,57 → € 2.833 (Awir art. 14 lid 4; via build.run_case), het maximum met partner van 2024, want het inkomen ligt onder het drempelinkomen. De latere uitkomst, € 0 na toepassing van de woonlandfactor (12 juni 2024, definitief gehandhaafd 28 februari 2025), is niet na te rekenen: de uitspraak anonimiseert het woonland. Uit de tekst volgt alleen dat de factor lager dan 0,2932 was (daarboven zou 2 × € 1.987 × factor − € 1.141,43 ten minste € 23,50 zijn en afgerond € 24, Awir art. 14 lid 4–5). Het teruggevorderde bedrag, € 1.416, is niet het hele voorschot; de uitspraak verklaart dat niet. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
