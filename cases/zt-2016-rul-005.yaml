opmerking: "Definitieve berekening 2016 (7 juli 2017), met partner: € 439. De uitspraak noemt drie inkomensbedragen die niet kloppen met elkaar: € 15.070 + € 16.604 = € 31.674 (niet de genoemde € 30.674), en in de conclusie € 30.670. De tekst van 2016 geeft bij een gezamenlijk toetsingsinkomen van € 30.670 precies € 439 (normpremie 5,22% × € 19.758,816 + 13,43% × € 10.911,18 = € 2.496,78; 2 × € 1.468 − € 2.496,78 = € 439,22 → € 439, via build.run_case) en bij € 31.674 € 304. De case voert daarom € 30.670 in als gezamenlijk toetsingsinkomen (partner € 0), de lezing dat de Dienst met € 30.670 rekende en een van de twee deelbedragen in de uitspraak verschreven is; dat is de lezing van de operator, en de verifieerder toetst haar. De huurtoeslag 2016 nihil boven de inkomensgrens van € 30.050 is geen onderdeel van deze case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
