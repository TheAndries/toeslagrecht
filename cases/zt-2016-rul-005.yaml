  publicatie: "Rechtbank Zeeland-West-Brabant 10 april 2018, ECLI:NL:RBZWB:2018:2319 (zaaknr. BRE 17/6534 HUUR), procesverloop en r.o. 4: 'Bij besluit van 7 juli 2017 (primair besluit) heeft Belastingdienst/Toeslagen de zorgtoeslag over 2016 definitief vastgesteld op € 439,- en aangegeven dat eiser € 406,- moet terugbetalen.' 'In het geval van eiser is het toetsingsinkomen volgens de definitieve aanslag inkomstenbelasting 2016 vastgesteld op een bedrag van € 15.070,-,-. Ten aanzien van zijn toeslagpartner is het toetsingsinkomen vastgesteld op een bedrag van € 16.604,-. Het gezamenlijke toetsingsinkomen bedraagt derhalve € 30.674,-.' 'Nu het toetsingsinkomen voor eiser en zijn toeslagpartner is vastgesteld op € 30.670,- heeft Belastingdienst/Toeslagen terecht aangegeven dat eiser geen recht heeft op huurtoeslag ... Verder heeft Belastingdienst/Toeslagen het recht op zorgtoeslag op basis van het toetsingsinkomen terecht vastgesteld op € 439,-.' Beroep ongegrond"
