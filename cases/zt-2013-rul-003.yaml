opmerking: "De definitieve vaststelling 2013 van de Dienst op het toetsingsinkomen zoals het toen vaststond: € 2.144 zonder toeslagpartner (geen partner genoemd), onder het drempelinkomen, dus het maximum zonder partner uit de tekst: € 1.478 − 2,195% × € 19.043,424 = € 1.478 − € 418,00 = € 1.059,997 → € 1.060 (Awir art. 14 lid 4). De uitspraak noemt de twee bedragen in de volgorde 'huur- en zorgtoeslag' zonder ze afzonderlijk te benoemen; dat € 1.060 de zorgtoeslag is volgt uit die volgorde én uit de rekensom (€ 3.175 kan geen zorgtoeslag 2013 zijn: het maximum met partner is € 2.062). Beslist DISCREPANCIES.md #1 niet (onder het drempelinkomen). Zie rul-004 voor de herziening in dezelfde uitspraak. Wordt verified zodra een met naam genoemde mens de invoer met de uitspraak vergelijkt (CASES.md; ASKS.md 9)."
