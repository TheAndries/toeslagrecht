  publicatie: "ABRvS 14 december 2016, ECLI:NL:RVS:2016:3324 (zaaknr. 201601124/1/A2), r.o. 1: de Belastingdienst/Toeslagen heeft 'de huur- en zorgtoeslag van [appellante] definitief vastgesteld op een bedrag van € 3.175,00 en een bedrag van € 1.060,00' en is daarbij 'uitgegaan van een toetsingsinkomen van [appellante] van € 2.144,00'. De uitspraak noemt geen partner (wel twee kinderen, kindgebonden budget). Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:RVS:2016:3324"
