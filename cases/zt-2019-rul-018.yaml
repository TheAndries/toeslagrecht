  type: ruling
  publicatie: "ABRvS 24 mei 2023, ECLI:NL:RVS:2023:2013 (zaaknr. 202101123/1/A2), citaten uit de uitspraak: 'Bij besluit van 21 augustus 2019 heeft de Belastingdienst/Toeslagen de aan [appellant] over het berekeningsjaar 2019 toegekende voorschotten zorgtoeslag en huurtoeslag herzien en op nihil gesteld.' 'Daarbij is de dienst, voor wat betreft het recht van [appellant] op zorgtoeslag, uitgegaan van een geschat jaarinkomen van € 42.000,00 van zijn toeslagpartner, [toeslagpartner], en een geschat jaarinkomen van € 15.822,- van hemzelf.' 'Dit gezamenlijke toetsingsinkomen van € 57.822,00 is hoger dan de voor zorgtoeslag in 2019 geldende inkomensgrenzen.'"
