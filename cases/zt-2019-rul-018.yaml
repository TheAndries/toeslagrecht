opmerking: "Herzien voorschot 2019 (21 augustus 2019, gehandhaafd 30 december 2019): nihil bij een geschat jaarinkomen van € 15.822 voor appellant en € 42.000 voor zijn toeslagpartner, gezamenlijk € 57.822 (tekst 2019: inkomensgrens met partner € 37.885). De verzekering van de partner is niet in geschil. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
