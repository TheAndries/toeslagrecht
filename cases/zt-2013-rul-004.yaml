  publicatie: "ABRvS 14 december 2016, ECLI:NL:RVS:2016:3324 (zaaknr. 201601124/1/A2), r.o. 1–2: in de aanslag inkomstenbelasting 2013 van 11 april 2015 'is het verzamelinkomen vastgesteld op een bedrag van € 33.683,00' (een WWB-uitkering en een in 2013 in een schenking omgezette leenbijstand); 'Op basis van het verzamelinkomen van € 33.683,00 heeft de Belastingdienst/Toeslagen de definitieve vaststelling herzien' — bij besluit van 15 mei 2015 de zorg- en huurtoeslag 2013 'herzien en vastgesteld op nihil'. De Afdeling: de regelgeving voor de zorgtoeslag biedt geen grondslag om een inkomensbestanddeel buiten beschouwing te laten (r.o. 3.2). Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:RVS:2016:3324"
