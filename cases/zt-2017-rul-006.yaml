  publicatie: "Rechtbank Midden-Nederland 20 oktober 2023, ECLI:NL:RBMNE:2023:6045 (zaaknrs. UTR 22/5958 en UTR 22/5962), citaten uit de uitspraak: 'Zij woont in België en ontvangt inkomen zowel in Nederland als in het buitenland.' 'Bij besluit van 5 augustus 2022 heeft verweerder het recht van eiseres op zorgtoeslag over 2017 opnieuw definitief vastgesteld op € 0,- en het teveel betaalde voorschot van € 1.183,- van haar teruggevorderd.' 'Bij de berekening is verweerder uitgegaan van een geregistreerd jaarinkomen van € 31.484,-.' 'Dit jaarinkomen bestaat uit een verzamelinkomen van € 32.945 en een Niet in Nederland belastbaar inkomen (NiNbi) van - € 1.461,-.'"
