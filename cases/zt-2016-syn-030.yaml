opmerking: "Inkomensgrens 2016 met toeslagpartner uit de tekst (gezamenlijk toetsingsinkomen, hier geheel bij de aanvrager gezet): normpremie = 5,220% × € 19.758,816 + 13,430% × (€ 33.765 − € 19.758,816) = € 1.031,41 + € 1.881,03 = € 2.912,44; 2 × € 1.468 − € 2.912,44 = € 23,56 → € 24, net toegekend. Zie syn-031 voor de euro erboven. Met een naar beneden afgerond drempelinkomen (€ 19.758) zou hier € 23,49 → € 23 → niets uitkomen; met € 19.759 blijft het € 24 (DISCREPANCIES.md #1). Wordt een published case zodra een 2016-grens van de Dienst gevonden is."
