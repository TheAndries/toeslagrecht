opmerking: "Definitieve vaststelling 2014 van 26 mei 2017, € 699, op het BRI-inkomen van € 21.073. De tekst van 2014: € 1.329 − (2,410% × € 19.253,376 + 9,118% × (€ 21.073 − € 19.253,376)) = € 699,08 → € 699 (via build.run_case). Zonder partner, zie zt-2014-rul-005. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
