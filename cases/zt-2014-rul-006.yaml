  publicatie: "ABRvS 24 oktober 2018, ECLI:NL:RVS:2018:3454, procesverloop en r.o. 1: 'Bij het besluit van 26 mei 2017, gehandhaafd bij het besluit van 19 juni 2017, heeft de dienst de zorgtoeslag over 2014 definitief vastgesteld op € 699,00. Aan dat besluit heeft de Belastingdienst/Toeslagen ten grondslag gelegd dat volgens de basisregistratie inkomen (hierna: BRI) het inkomen van [appellant] in 2014 € 21.073,00 bedroeg.'"
