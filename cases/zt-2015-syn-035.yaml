opmerking: "De euro boven de inkomensgrens 2015 met toeslagpartner (syn-034): 2 × € 1.408 − € 2.792,56 = € 23,44 → € 23 → niet toegekend (Awir art. 14 lid 5). Ook met een afgerond drempelinkomen (€ 19.463: € 23,41; € 19.464: € 23,47) komt hier niets uit: met partner beslist de afronding van het drempelinkomen de grens 2015 niet. Het gezamenlijke toetsingsinkomen van € 27.886 waarbij de Dienst € 663 toekende (cases/zt-2015-rul-001) ligt onder deze grens."
