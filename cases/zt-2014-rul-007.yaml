  publicatie: "ABRvS 9 januari 2019, ECLI:NL:RVS:2019:51, procesverloop en r.o. 3: 'Bij besluit van 4 november 2016 heeft de Belastingdienst/Toeslagen de zorgtoeslag van [appellant] over het jaar 2014 definitief vastgesteld op nihil en de huurtoeslag van [appellant] over het jaar 2014 definitief vastgesteld op een bedrag van € 1.573,00.' 'Nu niet in geschil is dat de Belastingdienst/Toeslagen het recht van [appellant] op huur- en zorgtoeslag voor het jaar 2014 heeft vastgesteld op basis van het door de inspecteur vastgestelde belastbare inkomen van € 40.775,00'"
