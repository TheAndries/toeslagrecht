opmerking: "Definitieve vaststelling 2014 van 4 november 2016: zorgtoeslag nihil op het door de inspecteur vastgestelde inkomen van € 40.775 (de aanvrager stelde dat het € 17.324 was; de Afdeling: de Dienst volgt de inspecteur). De uitspraak noemt geen partner; de tekst van 2014 geeft nihil met en zonder partner (grenzen € 28.482 / € 37.145; via build.run_case). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
