  publicatie: "ABRvS 4 december 2019, ECLI:NL:RVS:2019:4069 (zaaknr. 201901677/1/A2), r.o. 1 en 2: de Dienst heeft de zorgtoeslag 2017 'definitief vastgesteld op een lager bedrag dan de ontvangen voorschotten' omdat '[persoon] over de maand januari 2017 als de toeslagpartner van [appellante] moet worden aangemerkt' (tot 11 januari 2017 op hetzelfde adres, in 2016 ook toeslagpartner); 'Het gezamenlijke toetsingsinkomen van [appellante] en [persoon] over 2017 bedraagt € 35.410,00, waardoor [appellante] over de maand januari 2017 geen aanspraak heeft op huurtoeslag en zorgtoeslag'. R.o. 5.2–5.3: Awir art. 5 (wijziging na de eerste van de maand telt vanaf de volgende maand) en art. 7 lid 1 jo. art. 8 lid 1: het jaarinkomen van de partner telt voor die maand mee, 'geen ruimte de draagkracht van [persoon] per maand te bepalen'. Hoger beroep ongegrond"
