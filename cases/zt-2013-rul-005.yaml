opmerking: "Definitieve berekening 2013 van 25 juli 2014, € 1.060, op een toetsingsinkomen van € 12.922, onder het drempelinkomen: het maximum zonder partner van de tekst van 2013, € 1.478 − 2,195% × € 19.043,424 = € 1.059,997 → € 1.060 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen. Gevonden via de open-data-sweep van 2026-10-28 (uitspraken 2015–2020). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
