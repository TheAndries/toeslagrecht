  publicatie: "Rechtbank Noord-Holland 7 april 2020, ECLI:NL:RBNHO:2020:2696, feiten: 'Met dagtekening 3 mei 2014 is aan eiseres een aanslag inkomstenbelasting en premie volksverzekeringen (hierna: ib/pvv) voor het jaar 2013 opgelegd naar een verzamelinkomen van € 12.922.' 'Met dagtekening 25 juli 2014 is, naar aanleiding van de aanslag ib/pvv 2013, de definitieve berekening zorgtoeslag vastgesteld op € 1.060. Hierbij is uitgegaan van een toetsingsinkomen van € 12.922.'"
