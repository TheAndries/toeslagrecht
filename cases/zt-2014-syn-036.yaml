opmerking: "Inkomensgrens 2014 zonder toeslagpartner uit de tekst: normpremie = 2,410% × € 19.253,376 + 9,118% × (€ 28.482 − € 19.253,376) = € 464,01 + € 841,47 = € 1.305,47; € 1.329 − € 1.305,47 = € 23,53 (precies € 23,5277) → € 24 (Awir art. 14 lid 4), net toegekend (lid 5). Zie syn-037 voor de euro erboven. Met een afgerond drempelinkomen (€ 19.253: € 23,50; € 19.254: € 23,57; DISCREPANCIES.md #1) blijft het € 24 en blijft € 28.483 € 23 — 2014 is het eerste jaar in de reeks waarin de afronding van het drempelinkomen geen grens verschuift. De hoogste grens van de reeks 2014–2026 tot nu toe: het afbouwpercentage was 9,118% (2015: 13,400%). Het maximum 2014 zonder partner uit de tekst is € 865 (€ 864,99), het voorschot dat Hof Den Haag in ECLI:NL:GHDHA:2017:1067 noemt (zt-2014-rul-001). Wordt een published case zodra een publicatie van de Dienst voor 2014 de grens noemt."
