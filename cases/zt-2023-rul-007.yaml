opmerking: "Dezelfde aanvrager als zt-2023-rul-006 (verdragsgerechtigd, Roemenië 0,1085) mét zijn echtgenote als toeslagpartner, 'die geen verdragsgerechtigde en geen verzekerde is' (r.o. 16; eiser: zij is niet Wlz-plichtig, r.o. 17), gezamenlijk toetsingsinkomen € 22.222. Verwacht is nihil: de berekening die de Dienst in zijn brief van 24 november 2023 gaf — '(2 x standaardpremie x woonlandfactor – normpremie) x 50%', (€ 3.778 × 0,1085 =) € 409,913 − € 596,1645 < 0 → € 0 — en die de rechtbank 'in overeenstemming met de wettelijk regeling' noemde (r.o. 18). Geen beschikking op dit bedrag (de Dienst liet de partner voor 2023 buiten beschouwing, r.o. 14 en 23), wel een door de rechter beoordeelde berekening van de Dienst; daarom opgenomen, met deze kanttekening voor de verifieerder. De tekst (Wzt art. 3 lid 1 en lid 3, tekst 2023; nu art. 4a lid 1 en 4): de standaardpremie van de verdragsgerechtigde én die van zijn partner die geen verzekerde is × woonlandfactor, samen € 409,91; normpremie met partner 2,378% × € 25.069,824 = € 596,16 (de Dienst: × € 25.070 = € 596,1646, #1); aanspraak negatief → nihil; art. 2 lid 4 (50%) verandert daar niets aan — via build.run_case nagerekend (aanvrager_verdragsgerechtigd, partner_verzekerd false, woonland RO). De eerste door een rechter beoordeelde toepassing van de formule 'onder c' van de Dienst (Berekening zorgtoeslag 2022–2024, stap 5) in het corpus; voor een verdragsgerechtigde aanvrager komen tekst en formule overeen — DISCREPANCIES.md #3 gaat over een verzekerde aanvrager, waarover deze uitspraak niets zegt."
