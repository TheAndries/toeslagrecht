opmerking: "Voorschot 2022 (28 december 2021): € 1.910 bij een geschat gezamenlijk inkomen van € 27.082, met partner. De tekst van 2022: 2 × € 1.749 − (4,225% × € 22.356 + 13,610% × € 4.726) = € 1.910,25 → € 1.910 (Awir art. 14 lid 4). Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0). De definitieve berekening (14 juni 2024, € 335) heeft geen genoemd inkomen en is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
