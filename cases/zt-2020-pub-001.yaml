opmerking: "De Toeslagenkaart 2020 is de eerste publicatie van de Dienst Toeslagen voor 2020 in het corpus (de brochure Berekening zorgtoeslag 2020 is niet gevonden, SOURCES.md §3). Op de gepubliceerde grens zonder partner, € 30.481: de tekst geeft € 1.642 − (1,830% × € 21.430,656 + 13,550% × € 9.050,344) = € 23,50 → € 23 → niet toegekend (Awir art. 14 lid 5); met het drempelinkomen op hele euro's afgerond (€ 21.431) geeft dezelfde formule € 23,54 → € 24 → toegekend. De grens van de Dienst ligt dus op een euro waar de tekst niets meer geeft: het drempelinkomen 2020 is door de Dienst naar boven afgerond, zoals zt-2020-syn-009 op 2026-10-14 voorspelde. DISCREPANCIES.md #1 (government)."
