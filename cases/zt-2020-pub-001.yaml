  publicatie: "Dienst Toeslagen, Toeslagenkaart 2020 (TG 710 - 1Z01PL), 'Zorgtoeslag — Maximaal inkomen: Alleenstaande € 30.481; Aanvrager met toeslagpartner € 38.945. Maximale toeslag: Alleenstaande € 1.250 per jaar; Aanvrager met toeslagpartner € 2.397 per jaar.' 'Vermogensvrijstelling voor zorgtoeslag en kindgebonden budget: Voor zorgtoeslag en kindgebonden budget telt u bij het maximaal vermogen nog een extra vrijstelling op van € 85.767. In de tabel ziet u hoeveel vermogen de aanvrager maximaal mag hebben op 1 januari 2020. Alleenstaande € 116.613; Aanvrager met toeslagpartner € 147.459.'"
