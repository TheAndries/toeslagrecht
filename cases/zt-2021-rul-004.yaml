opmerking: "Definitieve berekening 2021 op nihil bij een BRI-inkomen van € 44.615, boven de inkomensgrens van de tekst van 2021 zonder partner (€ 31.138) én met partner (€ 39.979): nihil onder elke lezing. Dat er geen partner was, volgt uit het voorschotbedrag (zt-2021-rul-003). Het teruggevorderde bedrag (€ 1.299) is volgens de uitspraak het voorschot inclusief rente. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
