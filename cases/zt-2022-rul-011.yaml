opmerking: "Herzien voorschot 2022 (4 februari 2023): € 808 bij een geschat jaarinkomen van € 26.233, zonder partner. De tekst van 2022: € 1.749 − (1,848% × € 22.356 + 13,610% × € 3.877) = € 1.749 − € 940,80 = € 808,20 → € 808 (Awir art. 14 lid 4). Reeks van dezelfde uitspraak: zt-2022-rul-009..012. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
