  publicatie: "Rechtbank Den Haag 5 november 2024, ECLI:NL:RBDHA:2024:23394 (zaaknr. SGR 23/7402), citaten uit de uitspraak: 'Hij heeft een geschat jaarinkomen opgegeven van € 26.233.' 'Deze wijziging heeft geleid tot een herziene voorschotbeschikking voor het jaar 2022 met dagtekening van 4 februari 2023, waarin het voorschot zorgtoeslag is gewijzigd naar € 808 en het voorschot huurtoeslag naar € 965.'"
