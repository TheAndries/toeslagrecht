  publicatie: "ABRvS 29 november 2023, ECLI:NL:RVS:2023:4399 (zaaknr. 202203560/1/A2), citaten uit de uitspraak: 'Bij de berekening van het recht op zorgtoeslag over het jaar 2019 is de dienst daarmee uitgegaan van een gezamenlijk toetsingsinkomen van [wederpartij] en zijn [toeslagpartner] van € 30.818,00.' 'Bij het besluit van 7 augustus 2020 heeft de Belastingdienst/Toeslagen het recht van [wederpartij] op zorgtoeslag over het jaar 2019 definitief vastgesteld op € 979,00 en het te veel betaalde voorschot van € 588,00 van hem teruggevorderd.'"
