opmerking: "Definitieve vaststelling 2019 (7 augustus 2020): € 979 bij een gezamenlijk toetsingsinkomen van wederpartij en zijn toeslagpartner van € 30.818, waarin een met de inspecteur afgesproken 'fictieve uitkering' van € 7.329 meetelt. De tekst van 2019: 2 × € 1.609 − (4,315% × € 20.940,768 + 13,520% × € 9.877,232) = € 979,00 → € 979 (Awir art. 14 lid 4). Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0). € 588 teruggevorderd; het voorschot (€ 1.567 zou volgen, afgeleid) staat niet in de uitspraak. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
