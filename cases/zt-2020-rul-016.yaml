  type: ruling
  publicatie: "Rechtbank Midden-Nederland 15 december 2021, ECLI:NL:RBMNE:2021:6118 (zaaknr. UTR - 21/2520 en UTR - 21/2521), citaten uit de uitspraak: 'Voor het jaar 2020 heeft verweerder aan eisers ieder afzonderlijk een voorschot zorgtoeslag verleend van € 1.250,-.' 'Het voorschot zorgtoeslag van eisers voor het jaar 2020 is opnieuw berekend en vastgesteld op € 0,- op grond van het geschatte verzamelinkomen van eisers van € 39.694,-.' 'Verweerder heeft zich terecht op het standpunt gesteld dat op grond van het dwingend recht het toeslagpartnerschap van eisers volgens artikel 3, derde lid, van de Awir dan ingaat per 1 januari 2020.' 'Dit betekent dat uit de van toepassing zijnde wettelijke bepaling volgt dat verweerder eisers terecht als toeslagpartners voor het gehele jaar 2020 heeft aangemerkt.'"
