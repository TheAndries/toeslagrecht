opmerking: "Herzien voorschot 2020 (13 maart 2021): nihil bij een geschat gezamenlijk verzamelinkomen van € 39.694, nadat eisers door een samenlevingscontract van 30 oktober 2020 met terugwerkende kracht tot 1 januari 2020 toeslagpartners werden (Awir art. 3 lid 3, tekst 2020 — dezelfde regel als in zt-2020-rul-011/-012; gewijzigd per 1 januari 2021). Tekst 2020: inkomensgrens met partner € 38.945 → nihil. De rechtbank liet de berekening staan en vernietigde alleen de terugvordering over 1 januari–30 oktober 2020 (belangenafweging); dat raakt de tegemoetkoming niet. Het gezamenlijke inkomen is als inkomen van de aanvrager ingevoerd (partner € 0); eiseres' deel (€ 19.100) is zt-2020-rul-017, het deel van eiser is in de tekst afgebroken. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
