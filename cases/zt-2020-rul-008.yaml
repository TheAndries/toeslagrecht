opmerking: "Tweede uitkomst van de Dienst op de VERMOGENSTOETS in het corpus (na zt-2019-rul-004), de eerste voor 2020: zorgtoeslag 2020 definitief nihil omdat de grondslag sparen en beleggen (€ 99.000) boven de € 85.767 van Wzt art. 2a lid 1 (tekst 2020) lag. De uitspraak noemt de grondslag sparen en beleggen, dat is de rendementsgrondslag ná aftrek van het heffingvrije vermogen (Wet IB 2001 art. 5.2 lid 1); de encoding vraagt de rendementsgrondslag en trekt het heffingvrije vermogen van 2020 (€ 30.846, art. 5.5) zelf af, éénmaal zonder partner. De invoer € 129.846 is daarom GERECONSTRUEERD: € 99.000 + € 30.846, zodat de encoding op precies de grondslag van de uitspraak uitkomt. Het toetsingsinkomen van 2020 staat niet in de uitspraak; de invoer houdt het geschatte inkomen van het voorschot (€ 0) aan, en de uitkomst hangt er niet van af: boven de vermogensgrens is de aanspraak nihil bij elk inkomen. Appellant stelde dat zijn eigen vermogen € 77.480 was en dat de Dienst ten onrechte van de gezamenlijke opgave met zijn huisgenote uitging; de rechtbank en de Afdeling: de Dienst mag van de BRI-grondslag uitgaan, bezwaar daartegen hoort bij de inspecteur. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
