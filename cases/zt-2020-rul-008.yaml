  publicatie: "ABRvS 30 augustus 2023, ECLI:NL:RVS:2023:3323 (zaaknr. 202206014/1/A2), r.o. 1: 'Bij besluit van 27 december 2019 heeft de Belastingdienst/Toeslagen aan [appellant] een voorschot zorgtoeslag over 2020 toegekend van € 1.250,00. Bij de berekening van het voorschot is uitgegaan van een geschat toetsingsinkomen van € 0,00. In het besluit van 31 juli 2021 heeft de Belastingdienst/Toeslagen de zorgtoeslag van [appellant] over 2020 vastgesteld op € 0,00 en een bedrag van € 1.254,00 van hem teruggevorderd. Reden hiervan is dat de Belastingdienst/Toeslagen van de Basisregistratie Inkomen (BRI) een melding heeft ontvangen dat de grondslag sparen en beleggen van [appellant] over 2020 € 99.000,00 is.' R.o. 3 (de rechtbank, bevestigd): 'Omdat er geen aanspraak op zorgtoeslag in 2020 bestond als de grondslag sparen en beleggen meer was dan € 85.767,00 en de Belastingdienst/Toeslagen uit mocht gaan van de in de BRI opgenomen grondslag sparen en beleggen van € 99.000,00 heeft de Belastingdienst/Toeslagen de zorgtoeslag van [appellant] over 2020 terecht op nihil vastgesteld'. Hoger beroep ongegrond"
