opmerking: "Herziene definitieve berekening 2019 (26 oktober 2021): € 1.189 bij een toetsingsinkomen van € 19.712, zonder partner — het maximum zonder partner van de tekst 2019 (€ 1.189,14), want het inkomen ligt onder het drempelinkomen van € 20.940,768. De rechtbank: de Dienst mag niet afwijken van het in de BRI geregistreerde inkomen (Awir art. 7 lid 1, art. 8 lid 1; herziening Awir art. 20). Eerdere berekening op € 24.100: zt-2019-rul-010. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
