  publicatie: "Rechtbank Den Haag 24 januari 2022, ECLI:NL:RBDHA:2022:782 (zaaknr. 21/41 en 22/331), citaten uit de uitspraak: 'Op 16 juni 2021 heeft verweerder van de BRI een melding ontvangen waarin het inkomen van eiseres voor het jaar 2019 is bepaald op € 19.712.' 'Bij beschikkingen van 26 oktober 2021 (de herziene beslissingen) heeft verweerder de definitief berekende huurtoeslag en zorgtoeslag voor het berekeningsjaar 2019 herzien naar € 2.966 respectievelijk € 1.189.' 'Bij de herziening van de zorgtoeslag is uitgegaan van een toetsingsinkomen van € 19.712.'"
