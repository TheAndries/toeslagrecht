  publicatie: "Rechtbank Midden-Nederland 20 oktober 2023, ECLI:NL:RBMNE:2023:6045 (zaaknrs. UTR 22/5958 en UTR 22/5962), citaten uit de uitspraak: 'Zij woont in België en ontvangt inkomen zowel in Nederland als in het buitenland.' 'De rechtbank stelt vast dat verweerder hangende dit beroep met het besluit van 13 januari 2023 het recht op zorgtoeslag van eiseres over 2018 opnieuw heeft herzien en op € 705,- heeft vastgesteld.' 'Bij deze berekening is verweerder uitgegaan van een toetsingsinkomen van € 1.609, bestaande uit een BRI inkomen van € 0 en een NiNbi inkomen van € 1.609,-.'"
