opmerking: "EERSTE uitkomst van de Dienst voor 2018 met inkomen in het corpus: een voorschot zorgtoeslag 2018 van € 1.061 voor een paar toeslagpartners op een geschat gezamenlijk inkomen van € 28.304. De uitspraak splitst het inkomen niet over de partners; de encoding telt op, dus staat het geheel bij de aanvrager. De tekst van 2018 geeft met een verzekerde partner 2 × € 1.546 − (4,750% × € 20.450,88 + 13,490% × (€ 28.304 − € 20.450,88)) = € 1.061,20 → € 1.061 (Awir art. 14 lid 4; via build.run_case). De definitieve vaststelling op nihil op € 37.125 staat in zt-2018-rul-002. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
