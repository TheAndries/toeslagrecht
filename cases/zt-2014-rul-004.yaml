  publicatie: "Hof Amsterdam 25 juni 2019, ECLI:NL:GHAMS:2019:2243 (zaaknrs. 17/00278, 17/00279, 18/00129), feiten rechtbank 2014 (r.o. 2, aangehaald): 'In het jaar 2014 stond eiseres op hetzelfde adres ingeschreven als de ex-partner en hun beide kinderen.'; 'Op 6 januari 2017 is de definitieve berekening toeslagen over het jaar 2014 vastgesteld. De toeslagen zijn berekend op basis van de volgende toetsingsinkomens: eiseres: € 21.113 en [Y]: € 19.000. Op basis van deze toetsingsinkomens is de zorgtoeslag op nihil vastgesteld en is het kindgebonden budget op € 492 vastgesteld.' Het Hof stelt het inkomensgegeven 2014 van de ex-partner nader vast op € 9.860 (dictum), waarna de Dienst de toeslagen herziet (Awir art. 20); die herziening staat niet in de uitspraak. Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:GHAMS:2019:2243"
