opmerking: "Inkomensgrens 2016 zonder toeslagpartner uit de tekst: normpremie = 2,380% × € 19.758,816 + 13,430% × (€ 27.013 − € 19.758,816) = € 470,26 + € 974,24 = € 1.444,50; € 1.468 − € 1.444,50 = € 23,50 (precies € 23,5033) → € 24 (Awir art. 14 lid 4), net toegekend (lid 5). Zie syn-029 voor de euro erboven. Met een naar beneden afgerond drempelinkomen (€ 19.758, DISCREPANCIES.md #1) zou hier € 23,41 → € 23 → niets uitkomen; met € 19.759 blijft het € 24: als in 2017 en 2018 beslist de afronding van het drempelinkomen de grens. Wordt een published case zodra een 2016-grens van de Dienst gevonden is."
