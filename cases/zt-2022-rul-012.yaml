  publicatie: "Rechtbank Den Haag 5 november 2024, ECLI:NL:RBDHA:2024:23394 (zaaknr. SGR 23/7402), citaten uit de uitspraak: 'Met de afzonderlijke primaire besluiten heeft verweerder zowel de zorg- als de huurtoeslag definitief berekend op € 0.' 'Dit gelet op het definitief geregistreerde inkomen van € 34.652, dat verweerder heeft doorgekregen van de Basisregistratie Inkomen (BRI).'"
