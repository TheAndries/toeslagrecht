opmerking: "Definitieve berekening 2022: nihil bij een definitief geregistreerd inkomen van € 34.652, zonder partner. De tekst van 2022: normpremie 1,848% × € 22.356 + 13,610% × € 12.296 = € 2.086,62, boven de standaardpremie van € 1.749, dus geen aanspraak; de inkomensgrens zonder partner van de tekst is € 31.998 (zt-2022-pub-004/-005). Reeks van dezelfde uitspraak: zt-2022-rul-009..012. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
