  publicatie: "Rechtbank Zeeland-West-Brabant 27 mei 2026, ECLI:NL:RBZWB:2026:5027 (zaaknr. BRE 25/5946), citaten uit de uitspraak: 'Er is uitgegaan van een geschat inkomen in 2024 van € 33.005,-.' 'Voor het jaar 2024 heeft eiser een voorschot zorgtoeslag van € 637,- ontvangen, terwijl zijn recht is berekend op € 34,-.'"
