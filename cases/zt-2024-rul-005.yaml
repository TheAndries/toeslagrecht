opmerking: "Voorschot 2024: € 637 bij een geschat inkomen van € 33.005, zonder partner ('eiser', geen partner genoemd). De tekst van 2024: € 1.987 − (1,879% × € 26.819,424 + 13,670% × € 6.185,576) = € 1.987 − € 1.349,51 = € 637,49 → € 637 (Awir art. 14 lid 4). De definitieve berekening van dezelfde uitspraak: zt-2024-rul-006. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
