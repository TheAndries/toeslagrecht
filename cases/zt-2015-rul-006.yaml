opmerking: "Definitieve berekening 2015 (6 september 2019): nihil omdat de grondslag sparen en beleggen (€ 391.765, BRI) boven de € 82.093 van Wzt art. 2a lid 1 (tekst 2015) lag — de derde uitkomst van de Dienst op de vermogenstoets in het corpus, en de eerste voor 2015. De uitspraak noemt de grondslag ná aftrek van het heffingvrije vermogen (Wet IB 2001 art. 5.2); de encoding vraagt de rendementsgrondslag en trekt het heffingvrije vermogen 2015 (€ 21.330, art. 5.5) zelf af. De invoer € 413.095 is daarom GERECONSTRUEERD: € 391.765 + € 21.330, zonder partner. Dat er geen partner was, noemt de uitspraak niet ('eiseres'); het voorschot van € 942 (27 december 2014) is het maximum zonder partner van de tekst 2015 (€ 941,85) en bewijst het; met partner zou de encoding tweemaal € 21.330 aftrekken en de uitkomst blijft nihil. Het toetsingsinkomen staat niet in de uitspraak; het is hier € 0 ingevuld omdat de vermogenstoets vóór de inkomenstoets gaat en nihil geeft bij elk inkomen (art. 2a lid 1: 'geen aanspraak'). De verifieerder toetst beide lezingen. Het voorschot zelf is geen case: zijn inkomen staat niet in de uitspraak. Het teruggevorderde bedrag (€ 1.061) is meer dan het voorschot van € 942; de uitspraak verklaart dat niet en het is geen invoer. De rechtbank: de Dienst mag niet afwijken van het inkomensgegeven in de BRI (Awir art. 2 lid 1 onder o, art. 8 lid 1) en hoeft een bezwaar tegen de aanslag IB niet af te wachten; wordt dat bezwaar gegrond, dan herziet hij ambtshalve (Awir art. 20 lid 1). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
