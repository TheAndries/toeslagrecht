  type: ruling
  publicatie: "Rechtbank Den Haag 5 februari 2021, ECLI:NL:RBDHA:2021:2781 (zaaknrs. SGR 19/7423 en SGR 20/3372; bevestigd ABRvS ECLI:NL:RVS:2021:2830), r.o. 1–3, 12, 13, 15: 'Bij beschikking van 27 december 2014 is aan eiseres voor het jaar 2015 een voorschot zorgtoeslag toegekend van € 942.' 'Op 31 juli 2019 ontvangt verweerder een melding vanuit de Basisregistratie Inkomen (BRI) waaruit blijkt dat de inspecteur heeft vastgesteld dat in 2015 voor eiseres sprake is van een bedrag grondslag sparen en beleggen van € 391.765.' 'Bij beschikking van 6 september 2019 is de zorgtoeslag 2015 definitief berekend op nihil, en is bepaald dat eiseres € 1.061 moet terugbetalen.' 'In artikel 2a, eerste lid, van de Wzt is ... bepaald dat geen aanspraak bestaat op zorgtoeslag indien de grondslag sparen en beleggen van de aanvrager, zoals dat blijkt uit de BRI, in het berekeningsjaar 2015 meer bedraagt dan € 82.093 en in het berekeningsjaar 2016 meer bedraagt dan € 82.504.' 'Niet in geschil is dat bij een grondslag sparen en beleggen van € 391.765 voor het jaar 2015 respectievelijk € 479.973 voor het jaar 2016 geen recht bestaat op zorgtoeslag'. 'Verweerder heeft de definitieve berekeningen zorgtoeslag 2015 en 2016 terecht vastgesteld op nihil.'"
