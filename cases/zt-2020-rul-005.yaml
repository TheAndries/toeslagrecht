opmerking: "Definitieve berekening 2020 van € 1.250 op het door de inspecteur na bezwaar vastgestelde inkomen van € 20.733, onder het drempelinkomen (€ 21.430,656): het maximum zonder partner uit de tekst van 2020, € 1.642 − 1,830% × € 21.430,656 = € 1.249,82 → € 1.250 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner zou het € 2.397 zijn). Dezelfde aanvrager als zt-2019-rul-007/-008; het eerder geregistreerde inkomen van 2020 in zt-2020-rul-006. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
