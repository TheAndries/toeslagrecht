  publicatie: "Rechtbank Noord-Holland 7 maart 2024, ECLI:NL:RBNHO:2024:2245 (zaaknr. AWB 23/3141), r.o. 1: 'Bij de primaire besluiten is de definitief berekende zorgtoeslag van eiser over de jaren 2019 en 2020 verlaagd van respectievelijk € 1.189 en € 1.250 naar nihil. Hierbij is door verweerder voor het jaar 2019 uitgegaan van een geschat jaarinkomen van eiser van € 36.428 en voor het jaar 2020 van € 41.466.' R.o. 4: 'Op 14 november 2022 is de inspecteur bij uitspraken op bezwaar tegemoet gekomen aan de bezwaren van eiser en is het geregistreerde inkomen voor 2019 en 2020 vastgesteld op respectievelijk € 18.214 en € 20.733. Hiermee is de definitieve berekening van eisers zorgtoeslag voor 2019 en 2020 aangepast en vastgesteld op respectievelijk € 1.189 en € 1.250.' Beroep (over de vergoeding van bezwaarkosten) ongegrond"
