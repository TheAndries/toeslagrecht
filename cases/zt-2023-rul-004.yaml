opmerking: "Voorschot 2023 (24 mei 2023): € 1.595 bij een geschat toetsingsinkomen van € 27.000, zonder partner ('eiseres', geen partner genoemd; het kindgebonden budget zegt niets over een partner). De tekst van 2023: € 1.889 − (0,123% × € 25.069,824 + 13,640% × € 1.930,176) = € 1.594,89 → € 1.595 (Awir art. 14 lid 4). Het hoger beroep, ABRvS 25 maart 2026, ECLI:NL:RVS:2026:1753, noemt hetzelfde geschatte inkomen. Het latere voorschot van € 777 (5 januari 2024) heeft geen genoemd inkomen en is geen case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
