  publicatie: "Rechtbank Rotterdam 11 juli 2025, ECLI:NL:RBROT:2025:8313 (zaaknr. ROT 24/5561), citaten uit de uitspraak: 'Met de voorschotbeschikking van 28 december 2021 heeft verweerder de zorgtoeslag over 2022 vastgesteld op € 1.336,-.' 'Verweerder heeft met het besluit van 6 oktober 2023 (het primaire besluit) de zorgtoeslag definitief berekend op € 0,-.' 'Verweerder heeft aan het primaire besluit ten grondslag gelegd dat de maximale vermogensgrens om voor zorgtoeslag in aanmerking te komen in 2022 maximaal € 120.020,- bedroeg.' 'Uit de Basisregistratie inkomen (BRI) blijkt dat eiser over het jaar 2022 een rendementsgrondslag heeft van € 165.827,- .'"
