opmerking: "Definitieve berekening 2022 (6 oktober 2023): nihil omdat de rendementsgrondslag van eiser over 2022 volgens de BRI € 165.827 bedroeg, boven de grens van € 120.020 (Wzt art. 2a lid 1, tekst 2022; Stcrt. 2021, 47692) die de uitspraak zelf noemt — de grens van de Dienst is die van de tekst (een schenking van € 100.000, de 'jubelton', telde mee). Voor 2022 is de rendementsgrondslag zelf de maatstaf, dus de invoer is het genoemde bedrag, niet gereconstrueerd. Het inkomen staat niet in de uitspraak; ingevoerd € 0, zonder gevolg voor de uitkomst. Het voorschot van 28 december 2021 (€ 1.336, het maximum zonder partner) noemt geen geschat inkomen en is geen case. Zonder partner gelezen. De negende uitkomst van de Dienst op de vermogenstoets in het corpus en de eerste voor 2022. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
