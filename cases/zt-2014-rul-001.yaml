verwacht:
  tegemoetkoming: "865"
opmerking: "De eerste uitkomst van de Dienst Toeslagen voor 2014 in het dossier: een voorschot, bij een geschat toetsingsinkomen onder het drempelinkomen (€ 19.253,376), dus het maximum zonder partner uit de tekst: € 1.329 − 2,410% × € 19.253,376 = € 1.329 − € 464,01 = € 864,99 → € 865 (Awir art. 14 lid 4). De uitspraak noemt geen partner; het bedrag bewijst dat met éénmaal de standaardpremie is gerekend (met partner zou het voorschot € 1.655 zijn). Zelfde euro onder elke afronding van het drempelinkomen (DISCREPANCIES.md #1). Wordt verified zodra een met naam genoemde mens de invoer met de uitspraak vergelijkt (CASES.md; ASKS.md 9)."
