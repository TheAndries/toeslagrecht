bron:
  type: ruling
  publicatie: "Hof Den Haag 28 maart 2017, ECLI:NL:GHDHA:2017:1067 (zaaknr. BK-16/00409), r.o. 3.1 en 3.3: 'Bij voorschotbeschikkingen van 27 december 2013 heeft de Belastingdienst/Toeslagen de aan belanghebbende toekomende zorgtoeslag en huurtoeslag voor het jaar 2014 voorlopig vastgesteld op € 865 respectievelijk € 2.456 (hierna: de voorschotten). De voorschotten zijn gebaseerd op een schatting aan de hand van inkomensgegevens uit het jaar 2013. Het geschatte toetsingsinkomen waarvan bij de berekening van de voorschotten is uitgegaan bedraagt € 17.333.' Een belastingzaak over het inkomensgegeven (toetsingsinkomen 2014 € 19.810, zie rul-002); het Hof bevestigt het inkomensgegeven. Volledige tekst via data.rechtspraak.nl/uitspraken/content?id=ECLI:NL:GHDHA:2017:1067"
  url: https://deeplink.rechtspraak.nl/uitspraak?id=ECLI:NL:GHDHA:2017:1067
