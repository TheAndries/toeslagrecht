opmerking: "Definitieve berekening 2016 (4 augustus 2017) van € 761 bij het BRI-inkomen van € 28.272. Met partner (bewezen door het voorschot, zt-2016-rul-006; zonder partner zou de tekst nihil geven) geeft de tekst van 2016 € 761,27 → € 761 (normpremie € 1.031,41 + 13,43% × € 8.513,18 = € 2.174,73; 2 × € 1.468 − € 2.174,73; via build.run_case). € 945 − € 761 = € 184 teruggevorderd voor de zorgtoeslag; de uitspraak noemt alleen het totaal met de huurtoeslag (€ 572). De Afdeling: een voorschot wekt geen vertrouwen op een gelijke definitieve vaststelling; de wet kent geen bepaling om van terugvordering af te zien. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
