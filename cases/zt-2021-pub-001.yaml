opmerking: "Eerste publicatie van de Dienst Toeslagen met cijfers voor 2021 in het corpus (de brochure Berekening zorgtoeslag 2021 is alleen uit de zoekindex bekend, ASKS.md 8); zt-2021-syn-004..007 berekenden deze grenzen op 2026-10-13 uit de tekst. Op de gepubliceerde grens zonder partner, € 31.138: de tekst geeft € 1.705 − (1,915% × € 21.835,008 + 13,580% × € 9.302,992) = € 23,51 → € 24 → toegekend (Awir art. 14 lid 4–5). Met het drempelinkomen van de Dienst (€ 21.835, de tekst afgerond): € 23,51 → € 24. De grens is in 2021 niet afrondingsgevoelig."
