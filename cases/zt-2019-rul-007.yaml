opmerking: "Definitieve berekening 2019 van € 1.189 op het door de inspecteur na bezwaar vastgestelde inkomen van € 18.214, onder het drempelinkomen (€ 20.940,768): het maximum zonder partner uit de tekst van 2019, € 1.609 − 2,005% × € 20.940,768 = € 1.189,14 → € 1.189 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner; het bedrag bewijst er geen (met een verzekerde partner zou het € 2.314 zijn). Dezelfde aanvrager, hetzelfde jaar, op het eerder geregistreerde inkomen: zt-2019-rul-008 (nihil); 2020: zt-2020-rul-005 en -006. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
