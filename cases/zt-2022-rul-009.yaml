opmerking: "Voorschot 2022 (28 december 2021): € 1.336 bij een geschat jaarinkomen van € 9.950, zonder partner ('eiser', geen partner genoemd). De tekst van 2022: het inkomen ligt onder het drempelinkomen van € 22.356, normpremie 1,848% × € 22.356 = € 413,14, aanspraak € 1.749 − € 413,14 = € 1.335,86 → € 1.336 (Awir art. 14 lid 4). Dezelfde uitspraak geeft drie latere bedragen op genoemde inkomens: zt-2022-rul-010/-011/-012. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
