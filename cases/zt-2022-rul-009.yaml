  publicatie: "Rechtbank Den Haag 5 november 2024, ECLI:NL:RBDHA:2024:23394 (zaaknr. SGR 23/7402), citaten uit de uitspraak: 'Met dagtekening van 28 december 2021 is aan eiser voor het jaar 2022 een voorschot zorgtoeslag toegekend van € 1.336 en huurtoeslag van € 3.725.' 'Bij het vaststellen van deze voorschotten is verweerder uitgegaan van een jaarinkomen over 2022 van € 9.950.'"
