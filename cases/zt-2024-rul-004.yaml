opmerking: "Definitieve berekening 2024 (4 juli 2025): nihil bij een vastgesteld inkomen van eiser van € 47.825 en € 0 van zijn echtgenote. De uitspraak noemt de inkomensgrens met partner van de Dienst, € 47.368: precies de grens van de tekst van 2024 (zt-2024-pub-006/-007: € 24 bij € 47.368, € 23 → nihil bij € 47.369; Awir art. 14 lid 5). De tekst: normpremie 4,256% × € 26.819,424 + 13,670% × € 21.005,576 = € 4.012,90, boven 2 × € 1.987, dus geen aanspraak. Het voorschot: zt-2024-rul-003. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
