  publicatie: "Rechtbank Rotterdam 9 juni 2026, ECLI:NL:RBROT:2026:7307 (zaaknr. ROT 25/8409), citaten uit de uitspraak: 'Met het besluit van 4 juli 2025 heeft de Dienst Toeslagen de hoogte van het recht op zorgtoeslag voor het jaar 2024 vastgesteld op € 0,-, waardoor eiser € 2.833,- moet terugbetalen.' 'Het inkomen van eiser in 2024 is uiteindelijk vastgesteld op € 47.825,- en dat van zijn echtgenote op € 0,-.' 'Om voor zorgtoeslag in aanmerking te komen, bedraagt het maximale gezamenlijke inkomen in 2024 € 47.368,-.'"
