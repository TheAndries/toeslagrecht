  publicatie: "Rechtbank Noord-Nederland 19 mei 2023, ECLI:NL:RBNNE:2023:2133 (zaaknr. 21/4068), citaten uit de uitspraak: 'De Belastingdienst/Toeslagen heeft met het besluit van 30 juni 2021 de huur- en zorgtoeslag 2020 van [eiser] definitief berekend ter hoogte van respectievelijk € 1.163 en € 1.050, dit op grond van het toetsingsinkomen van [eiser] zoals is gebleken uit een melding van de basisregistratie inkomen (BRI).' 'Gelet hierop is de rechtbank van oordeel dat de Belastingdienst/Toeslagen bij de definitieve vaststelling van de huur- en zorgtoeslag 2020 terecht is uitgegaan van het in de BRI opgenomen verzamelinkomen van [eiser] ter hoogte van € 22.903.'"
