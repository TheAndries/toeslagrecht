opmerking: "Definitieve berekening 2020 (30 juni 2021): € 1.050 bij een toetsingsinkomen (BRI) van € 22.903, zonder partner ('[eiser]', eigen inkomen). De tekst van 2020: € 1.642 − (1,830% × € 21.430,656 + 13,550% × € 1.472,344) = € 1.050,32 → € 1.050 (Awir art. 14 lid 4). De huurtoeslag (€ 1.163) is geen onderdeel van deze case. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
