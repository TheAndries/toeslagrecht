  publicatie: "ABRvS 5 december 2018, ECLI:NL:RVS:2018:3958 (zaaknr. 201805301/1/A2), r.o. 1: '[appellant] heeft in 2016 voorschotten huurtoeslag ten bedrage van € 499,00 en voorschotten zorgtoeslag ten bedrage van € 945,00 ontvangen. De Belastingdienst/Toeslagen heeft de hoogte van de voorschotten gebaseerd op een geschat inkomen van € 26.901,00. Bij het besluit van 4 augustus 2017, zoals gehandhaafd bij het besluit van 10 november 2017, heeft de dienst de huur- en zorgtoeslag definitief vastgesteld op een bedrag van onderscheidenlijk € 111,00 en € 761,00 ... De bedragen van de vastgestelde toeslagen heeft de dienst bepaald aan de hand van het door de inspecteur van de Belastingen vastgestelde inkomen van € 28.272,00, zoals opgenomen in de Basisregistratie Inkomen.' Hoger beroep ongegrond"
