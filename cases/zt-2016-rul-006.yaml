opmerking: "Voorschot 2016 van € 945 op een geschat inkomen van € 26.901. De uitspraak noemt geen partner, maar het bedrag bewijst er een: de tekst van 2016 geeft zonder partner € 39 en met partner € 945,39 → € 945 (normpremie 5,22% × € 19.758,816 + 13,43% × € 7.142,18 = € 1.990,61; 2 × € 1.468 − € 1.990,61; via build.run_case). Het inkomen is ingevoerd als gezamenlijk toetsingsinkomen (partner € 0). Zie zt-2016-rul-007 voor de definitieve berekening. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
