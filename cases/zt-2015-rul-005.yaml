opmerking: "Definitieve vaststelling 2015 van 30 september 2016: nihil op een gezamenlijk verzamelinkomen van € 35.695, met toeslagpartner (een Bbz-lening die in 2015 een schenking werd telde mee; de Afdeling: terecht). De verdeling is niet gegeven; alles bij de aanvrager ingevoerd, zonder gevolg voor de uitkomst. De tekst van 2015 geeft nihil: de grens met partner is € 32.655 (via build.run_case). Het voorschot rustte op € 25.905; het bedrag ervan noemt de uitspraak niet. Wordt 'verified' op dezelfde voet (ASKS.md 9)."
