  type: ruling
  publicatie: "ABRvS 17 januari 2018, ECLI:NL:RVS:2018:133 (zaaknr. 201704714/1/A2), procesverloop en r.o. 1–2: 'Bij besluit van 30 september 2016 heeft de Belastingdienst/Toeslagen de zorgtoeslag van [appellant sub 1] over 2015 definitief vastgesteld op nihil' '[appellant sub 2] is de toeslagpartner van [appellant sub 1].' 'In de aanslag inkomstenbelasting van [appellant sub 1] en [appellant sub 2] over 2015 is dit bedrag meegerekend en is het verzamelinkomen vastgesteld op een bedrag van € 35.695,00. Op basis van dat verzamelinkomen heeft de Belastingdienst/Toeslagen bij besluit van 30 september 2016 voor 2015 de zorgtoeslag ... definitief berekend en vastgesteld'"
