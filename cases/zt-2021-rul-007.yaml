  publicatie: "Rechtbank Den Haag 10 december 2024, ECLI:NL:RBDHA:2024:23678 (zaaknr. 23/7085), r.o. 2: 'Met dagtekening van 28 december 2020 is op basis van een geschat inkomen van € 17.848 aan [naam] voor het jaar 2021 € 1.287 aan zorgtoeslag en € 4.289 aan huurtoeslag verleend.' 'Met dagtekening van 23 juni 2021 heeft verweerder aan [naam] medegedeeld dat haar toeslagen voor het jaar 2021 opnieuw zijn berekend, omdat haar inkomen opnieuw is geschat op € 19.162. De zorgtoeslag blijft € 1.287.' 'Met de definitieve berekening van 2 september 2022 is de zorgtoeslag vastgesteld op € 1.287 ... Hierbij is uitgegaan van een jaarinkomen van € 19.233.' Beroep ongegrond"
