opmerking: "Voorschot zorgtoeslag 2021 van 28 december 2020, € 1.287, op een geschat inkomen van € 17.848, onder het drempelinkomen; de herziening van 23 juni 2021 (inkomen € 19.162) en de definitieve berekening van 2 september 2022 (€ 19.233) geven hetzelfde bedrag en zijn niet apart opgenomen. De tekst van 2021 geeft zonder partner het maximum € 1.705 − 1,915% × € 21.835,008 = € 1.286,86 → € 1.287 (Awir art. 14 lid 4; via build.run_case). De uitspraak noemt geen partner (de aanvrager is overleden; de erfgenamen procederen); het bedrag bewijst er geen (met een verzekerde partner € 2.487). Een voorschot van dezelfde dagtekening als de andere voorschotten 2021 in het corpus, op het bedrag van de tekst; relevant voor DISCREPANCIES.md #11 (€ 1.289 in ECLI:NL:RBNNE:2024:632). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
