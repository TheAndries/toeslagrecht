opmerking: "Eerste publicatie van de Dienst Toeslagen met cijfers voor 2021 in het corpus (de brochure Berekening zorgtoeslag 2021 is alleen uit de zoekindex bekend, ASKS.md 8); zt-2021-syn-004..007 berekenden deze grenzen op 2026-10-13 uit de tekst. Op de gepubliceerde grens met partner, € 39.979: de tekst geeft 2 × € 1.705 − (4,225% × € 21.835,008 + 13,580% × € 18.143,992) = € 23,52 → € 24 → toegekend. Gezamenlijk inkomen bij de aanvrager ingevoerd, partner € 0."
