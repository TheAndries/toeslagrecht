verwacht:
  tegemoetkoming: "600"
opmerking: "Definitieve berekening 2021 van 12 augustus 2022, € 600, op het BRI-inkomen van € 26.894 (een uitbetaald levenslooptegoed van € 6.899 telde mee; de rechtbank: terecht, het is geen nabetaling en geen afkoop van ouderdomspensioen). De tekst van 2021: € 1.705 − (€ 418,14 + 13,580% × € 5.058,992) = € 599,85 → € 600 (Awir art. 14 lid 4; via build.run_case). € 1.287 − € 600 = € 687; de uitspraak noemt € 690 teruggevorderd en verklaart dat verschil niet. Zonder partner (r.o. 1). Wordt 'verified' op dezelfde voet (ASKS.md 9)."
