  type: ruling
  publicatie: "Rechtbank Noord-Holland 4 april 2024, ECLI:NL:RBNHO:2024:3591 (zaaknr. HAA 23/4258), procesverloop en r.o. 3–4: 'Bij beschikkingen met dagtekening 12 augustus 2022 is de huurtoeslag en zorgtoeslag 2021 definitief vastgesteld op respectievelijk € 208 en € 600. Hierbij is vastgesteld dat eiseres € 2.726 aan huurtoeslag 2021 en € 690 aan zorgtoeslag 2021 moet terugbetalen.' 'In 2021 heeft eiseres een uitbetaling van het levenslooptegoed, zoals opgebouwd volgens de levensloopregeling, ontvangen van € 6.899.' 'Verweerder heeft op 23 juni 2022 een melding uit de Basisregistratie Inkomen ontvangen dat het inkomensgegeven van eiseres voor het jaar 2021 is vastgesteld op € 26.894.' Beroep ongegrond"
