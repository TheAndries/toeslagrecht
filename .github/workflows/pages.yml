# Publishes the static checker in site/ to GitHub Pages.
# GitHub Pages "deploy from a branch" only offers / or /docs as the folder,
# so site/ is uploaded as a Pages artifact instead (Ask 7, owner session 2026-10-11).
name: Publish site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # site/layouts/ (the three result-page layouts of Ask 3) stays in the repository as the record
      # of that choice but is not published: internal matters never appear on the website
      # (owner decision 2026-10-11, BOARD.md; DESIGN.md).
      - run: rm -rf site/layouts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
