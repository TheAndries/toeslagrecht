# Awir — gedeelde parameters berekeningsjaar 2021. De zorgtoeslag gebruikt hieruit art. 14 lid 4-5 (afronding,
# minimumbedrag); zij heeft eigen vermogensgrenzen (Wzt art. 2a lid 1 in 2021 wijkt af van Awir art. 7 lid 3).
# 2021 is het eerste jaar van de rendementsgrondslag-toets van art. 7 lid 3 (Wet aanpassing box 3, Stb. 2020, 546, art. III).
