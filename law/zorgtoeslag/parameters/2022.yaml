# Zorgtoeslag — parameters berekeningsjaar 2022. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2022 (gelijk aan 2023 en aan 2024 t/m 05-11-2024): de vermogenstoets stond in art. 2a en
# de woonlandfactor in art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Eigen aan 2022: (1) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a* (het maandbedrag; sinds
# 01-01-2024 onderdeel b, Wet invoering minimumuurloon, Stb. 2023, 168); (2) het drempelinkomen is een rond bedrag
# (108% × 12 × € 1.725,00 = € 22.356,00), zodat de afrondingsvraag van DISCREPANCIES.md #1 zich in 2022 niet voordoet;
# (3) de woonlandfactor van Liechtenstein is na publicatie gecorrigeerd vóór zij in werking trad (Stcrt. 2021, 47687).
