# Zorgtoeslag — parameters berekeningsjaar 2013. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2013 (gelijk aan 2014 t/m 05-11-2024): de vermogenstoets stond in art. 2a en de woonlandfactor in
# art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Structuur als 2014 t/m 2020: (1) art. 2 had acht leden; lid 5 (oud) ontzegde de zorgtoeslag aan een verzekerde met een partner
# die zijn verzekeringsplicht (Zvw art. 2) niet nakwam; de maandbepaling stond in lid 6 (lid 5 vervallen en lid 6–8 vernummerd
# per 01-01-2021, Stb. 2020, 543, art. III); (2) de vermogenstoets van art. 2a rustte op de *grondslag sparen en beleggen*
# (Wet IB 2001 art. 5.2) met één bedrag, € 80.000; (3) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a*.
# Eigen aan 2013 — het eerste jaar van drie dingen die de encoding draagt (wetstechnische informatie en de teksten van 01-01-2012
# en 01-01-2013, art. 1 t/m 5 verbatim vergeleken 2026-10-25):
# (a) de vermogenstoets: art. 2a is 'Nieuw' per 01-01-2013 (Wet van 5 april 2012 tot wijziging van de Wet op de zorgtoeslag, in
#     verband met de introductie van een vermogenstoets, Stb. 2012, 204, kamerstukken 33024; in werking per Stb. 2012, 383, KB van
#     11 augustus 2012), met € 80 000 in de wettekst zelf; dezelfde wet voegde aan art. 1 lid 2 toe 'op basis van het inkomen en het
#     vermogen' (2012: 'De hoogte van de zorgtoeslag is afhankelijk van de draagkracht.'); Stb. 2012, 669 (Overige fiscale maatregelen
#     2013, wet van 20 december 2012) art. XXIX voegde vóór de ingang de volzin over de vrijstelling van art. 5.13 Wet IB toe;
# (b) het drempelinkomen als 108% × 12 × het WML-maandbedrag: de Wet uniformering loonbegrip (Stb. 2011, 288, in werking per
#     Stb. 2012, 45) liet per 01-01-2013 uit art. 1 lid 1 onder f vervallen ', verminderd met het werknemersaandeel in de premie
#     ingevolge artikel 25, tweede lid, van de Wet financiering sociale verzekeringen en vermeerderd met de vergoeding ingevolge
#     artikel 46, eerste lid, van de Zorgverzekeringswet over dat loon' — in 2012 en eerder was het drempelinkomen dus géén vast
#     percentage van het WML alleen; de encoding rekent 2012 niet;
# (c) de percentages uit Stb. 2012, 627 (besluit van 30 november 2012), waarvan 2013 de eerste rij is: de Wul (+0,25 punt op alle
#     drie), de compensatie van de verhoging van het verplicht eigen risico (−0,60 / −1,20 norm, +0,923 afbouw) en het
#     koopkrachtreparatiepakket van het Begrotingsakkoord 2013 (−0,60 / −0,40 norm, +1,70 afbouw); 2012 was 2,930% / 5,530% / 5,435%.
# Het heffingvrije vermogen van Wet IB art. 5.5 bleef in 2013 € 21.139 (gelijk aan 2012): art. XVIII van de Wet uitwerking fiscale
# maatregelen Begrotingsakkoord 2013 (Stb. 2012, 321) liet art. 10.1 Wet IB voor 2013 buiten toepassing (toelichting Bijstellingsregeling
# directe belastingen 2013, Stcrt. 2012, 26314). Eén tekstversie van de Wzt in 2013 (01-01 t/m 31-12-2013).
jaar: 2013
