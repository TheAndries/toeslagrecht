  opmerking: "108% × 12 × € 1.934,40 = € 25.069,824. Dienst Toeslagen, Berekening zorgtoeslag 2023: 'vastgesteld op € 25.070' (naar boven, zoals in 2025 en 2026; in 2024 naar beneden). Zie DISCREPANCIES.md #1."

