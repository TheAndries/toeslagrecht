# Zorgtoeslag — parameters berekeningsjaar 2023. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2023 (gelijk aan die van 2024 t/m 05-11-2024): de vermogenstoets stond in art. 2a en
# de woonlandfactor in art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Eigen aan 2023: (1) de percentages van art. 2 lid 3 zijn voor één jaar verlaagd (Stb. 2022, 472, rij 2023);
# (2) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a* (het maandbedrag; sinds 01-01-2024
# is dat onderdeel b, Wet invoering minimumuurloon, Stb. 2023, 168); (3) de woonlandfactoren 2023 zijn na
# een misslag voor vier landen gerectificeerd vóór zij in werking traden (Stcrt. 2022, 32002).
jaar: 2023
status: draft
geraadpleegd: 2026-10-11
versie: "BWBR0018451, geldend van 01-01-2023 t/m 31-12-2023 (verbatim gelezen 2026-10-11)"
artikel_vermogenstoets: "Wzt art. 2a lid 1 (tekst 2023)"
artikel_woonlandfactor: "Wzt art. 3 (tekst 2023)"
artikel_wml_onderdeel: "a"
art4a_lid3_aanwezig: false
art4a_lid3_opmerking: "Het huidige art. 4a lid 3 (verzekerde aanvrager met een verdragsgerechtigde partner) is ingevoegd per 06-11-2024 (Stb. 2024, 291, art. XIX onder C). In 2023 regelde de tekst (art. 3) dat geval niet; de encoding geeft dan 'undetermined'."

