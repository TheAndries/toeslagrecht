# Zorgtoeslag — parameters berekeningsjaar 2015. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2015 (gelijk aan 2016 t/m 05-11-2024): de vermogenstoets stond in art. 2a en de woonlandfactor in
# art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Structuur als 2016 t/m 2020: (1) art. 2 had acht leden; lid 5 (oud) ontzegde de zorgtoeslag aan een verzekerde met een partner
# die zijn verzekeringsplicht (Zvw art. 2) niet nakwam; de maandbepaling stond in lid 6 (lid 5 vervallen en lid 6–8 vernummerd
# per 01-01-2021, Stb. 2020, 543, art. III); (2) de vermogenstoets van art. 2a rustte op de *grondslag sparen en beleggen*
# (Wet IB 2001 art. 5.2) met één bedrag, € 82.093; (3) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a*.
# Eigen aan 2015: Stb. 2014, 488 (besluit van 1 december 2014) herschreef het schema van art. 2 lid 3 vanaf 2015: het afbouwpercentage
# steeg van 2014 op 2015 van 9,118% naar 13,400% (+3,877 procentpunt 'bovenop de stijging die al was verwerkt', structureel t/m 2040 —
# de opbrengst van de niet ingevoerde huishoudentoeslag deels via de zorgtoeslag) en de normpercentages werden alleen voor 2015 met
# 0,23 en 0,46 procentpunt verlaagd (zonder partner 2,410% → 2,395%, met partner 5,210% → 5,265%; zonder die maatregel 2,625% / 5,725%)
# 'ter compensatie van het niet introduceren van het inkomensafhankelijk eigen risico'. De tekst van 16-07-2014 t/m 31-12-2014
# (gelezen 2026-10-23): 2,410% / 5,210% / 9,118%, art. 2a € 81.360.
# Eén tekstversie van de Wzt in 2015: geldend van 01-01-2015 t/m 31-12-2015 (verbatim gelezen 2026-10-23). Art. 1 onder e noemde de
# zorgtoeslag alleen een tegemoetkoming in een premie of een bestuursrechtelijke premie (het eigen risico kwam er per 01-07-2017 bij);
# art. 4 gaf de minister 15 dagen; art. 1 lid 1 onder c noemde alleen 'artikel 24, eerste lid' van de Zvw.
jaar: 2015
status: draft
geraadpleegd: 2026-10-23
versie: "BWBR0018451, geldend van 01-01-2015 t/m 31-12-2015 (verbatim gelezen 2026-10-23)"
versie_opmerking: "Ontstaansbronnen per 01-01-2015 (wetstechnische informatie): Stcrt. 2014, 32936 (art. 2a lid 1: € 82.093); Stb. 2014, 488 (art. 2 lid 3: de percentages 2015, 'samen met' Stb. 2012, 627 en Stb. 2011, 620 — de keten van percentagebesluiten). Geen andere versie in 2015; geen rekenregel veranderde in de loop van 2015. De vorige versie (16-07-2014 t/m 31-12-2014, Stb. 2014, 259) verschilt alleen in art. 2 lid 3 (2,410% / 5,210% / 9,118%) en art. 2a lid 1 (€ 81.360) — verbatim vergeleken 2026-10-23, art. 1 t/m 5. De tekst van 01-01-2016 verschilt alleen in art. 2 lid 3 (percentages) en art. 2a lid 1 (€ 82.504) — verbatim vergeleken 2026-10-23."
