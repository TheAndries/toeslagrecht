# Zorgtoeslag — parameters berekeningsjaar 2014. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2014 (gelijk aan 2015 t/m 05-11-2024): de vermogenstoets stond in art. 2a en de woonlandfactor in
# art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Structuur als 2015 t/m 2020: (1) art. 2 had acht leden; lid 5 (oud) ontzegde de zorgtoeslag aan een verzekerde met een partner
# die zijn verzekeringsplicht (Zvw art. 2) niet nakwam; de maandbepaling stond in lid 6 (lid 5 vervallen en lid 6–8 vernummerd
# per 01-01-2021, Stb. 2020, 543, art. III); (2) de vermogenstoets van art. 2a rustte op de *grondslag sparen en beleggen*
# (Wet IB 2001 art. 5.2) met één bedrag, € 81.360; (3) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a*.
# Eigen aan 2014: het laatste jaar vóór de sprong van het afbouwpercentage (9,118% in 2014, 13,400% in 2015, Stb. 2014, 488), dus
# het jaar met de hoogste inkomensgrenzen uit de tekst van de reeks 2014–2026 (€ 28.482 / € 37.145). De percentages van 2014 komen
# uit Stb. 2012, 627 (besluit van 30 november 2012): de 2013-rij en de volgende rijen van het schema verwerkten de Wul (+0,25 punt op
# alle drie), de compensatie van de verhoging van het verplicht eigen risico (−0,60 / −1,20 norm, +0,923 afbouw) en het
# koopkrachtreparatiepakket van het Begrotingsakkoord 2013 (−0,60 / −0,40 norm, +1,70 afbouw). Het heffingvrije vermogen van Wet IB
# art. 5.5 bleef in 2014 € 21.139 (gelijk aan 2013): Belastingplan 2014 art. XXXIV liet de inflatiecorrectie van art. 10.1 Wet IB voor
# 2014 buiten toepassing (toelichting Bijstellingsregeling directe belastingen 2014, Stcrt. 2013, 35144; het Belastingplan zelf niet
# gelezen); het bedrag van Wzt art. 2a werd wél geïndexeerd (tabelcorrectiefactor 1,7%, Stcrt. 2013, 35607).
# Drie tekstversies van de Wzt in 2014 (wetstechnische informatie, gelezen 2026-10-24): 01-01 t/m 31-03-2014 (Stcrt. 2013, 35607:
# art. 2a; Stb. 2012, 627 samen met Stb. 2011, 620: art. 2 lid 3); 01-04 t/m 15-07-2014 (Stb. 2013, 578, in werking per Stb. 2014, 93:
# art. 5 lid 2 'Zorginstituut Nederland' voor 'College zorgverzekeringen' — geen rekenregel); 16-07 t/m 31-12-2014 (Stb. 2014, 259,
# art. XV: in art. 4 vervalt de zinsnede over verzekerden met een uitkering als bedoeld in Zvw art. 118a, met terugwerkende kracht tot
# en met 01-01-2014, art. XVII lid 1 — geen rekenregel; de standaardpremie 2014 was al vastgesteld). Art. 1 t/m 5 van 01-01-2014 en
# 16-07-2014 verbatim vergeleken 2026-10-24: alleen die twee verschillen. Geen rekenregel veranderde in de loop van 2014.
