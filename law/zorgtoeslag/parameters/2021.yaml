# Zorgtoeslag — parameters berekeningsjaar 2021. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2021 (gelijk aan 2022, 2023 en 2024 t/m 05-11-2024): de vermogenstoets stond in art. 2a en
# de woonlandfactor in art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Eigen aan 2021: (1) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a* (het maandbedrag; sinds
# 01-01-2024 onderdeel b, Wet invoering minimumuurloon, Stb. 2023, 168); (2) 2021 is het eerste jaar waarin de
# vermogenstoets van art. 2a op de *rendementsgrondslag* (Wet IB 2001 art. 5.3) rust, met twee bedragen; t/m 2020 rustte
# zij op de grondslag sparen en beleggen (art. 5.2) met één bedrag (Wet aanpassing box 3, Stb. 2020, 546, art. IV);
# (3) de percentages van art. 2 lid 3 zijn in 2021 tweemaal vastgesteld: Stb. 2020, 452 (1,885% / 4,195% / 13,580%) en
# daarna, vóór de inwerkingtreding, +0,030 procentpunt op de drempelpercentages bij amendement Snels/Lodders in de Wet
# verbetering uitvoerbaarheid toeslagen (Stb. 2020, 543, art. III); (4) datzelfde art. III liet art. 2 lid 5 (oud:
# geen aanspraak bij een partner die zijn verzekeringsplicht niet nakwam) vervallen en vernummerde lid 6–8 tot 5–7;
# (5) het afbouwpercentage is 13,580%, niet 13,610% zoals CHANGES.md tot 2026-10-13 voor 2021 vermeldde.
jaar: 2021
status: draft
geraadpleegd: 2026-10-13
versie: "BWBR0018451, geldend van 01-01-2021 t/m 31-12-2021 (verbatim gelezen 2026-10-13)"
artikel_vermogenstoets: "Wzt art. 2a lid 1 (tekst 2021)"
artikel_woonlandfactor: "Wzt art. 3 (tekst 2021)"
artikel_wml_onderdeel: "a"
art4a_lid3_aanwezig: false
art4a_lid3_opmerking: "Het huidige art. 4a lid 3 (verzekerde aanvrager met een verdragsgerechtigde partner) is ingevoegd per 06-11-2024 (Stb. 2024, 291, art. XIX onder C). In 2021 regelde de tekst (art. 3) dat geval niet; de encoding geeft dan 'undetermined'."
maand_afronding_opmerking: "Geen parameter maand_afronding_praktijk: voor 2021 is geen rekenvoorbeeld van de Dienst gelezen (de leaflet Berekening zorgtoeslag 2021, tg0821z11fd, is op 2026-10-13 een 404; een archiefkopie bestaat maar is vanuit de routine niet bereikbaar — SOURCES.md, open item 6). De encoding gebruikt de standaard 'naar_beneden' (DISCREPANCIES.md #5) en zegt dat in het resultaat; 2022 rondde rekenkundig (#8), dus 2021 is onbekend."

