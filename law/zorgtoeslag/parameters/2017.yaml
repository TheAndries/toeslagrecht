# Zorgtoeslag — parameters berekeningsjaar 2017. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2017 (gelijk aan 2018 t/m 05-11-2024): de vermogenstoets stond in art. 2a en de woonlandfactor in
# art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Structuur als 2018 t/m 2020: (1) art. 2 had acht leden; lid 5 (oud) ontzegde de zorgtoeslag aan een verzekerde met een partner
# die zijn verzekeringsplicht (Zvw art. 2) niet nakwam; de maandbepaling stond in lid 6 (lid 5 vervallen en lid 6–8 vernummerd
# per 01-01-2021, Stb. 2020, 543, art. III); (2) de vermogenstoets van art. 2a rustte op de *grondslag sparen en beleggen*
# (Wet IB 2001 art. 5.2) met één bedrag, € 82.752; (3) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a*.
# Eigen aan 2017: de percentages van art. 2 lid 3 volgen Stb. 2016, 469, dat met ingang van 2017 de normpercentages structureel
# verlaagde met 0,35 procentpunt (zonder partner: 2,655% → 2,305%) en 0,70 procentpunt (met partner: 5,755% → 5,055%) als
# koopkrachtmaatregel — de 'structurele verlenging van de tijdelijke verhoging van de zorgtoeslag' van 2015 en 2016; het
# afbouwpercentage (13,460%) bleef op zijn schema van +0,03 procentpunt per jaar. De tekst van 2016 (gelezen) had 2,380% /
# 5,220% / 13,430%.
# Twee tekstversies van de Wzt in 2017: geldend van 01-01-2017 t/m 30-06-2017 en van 01-07-2017 t/m 31-12-2017 (Stb. 2017, 146,
# in werking per Stb. 2017, 244): per 01-07-2017 noemt art. 1 onder e de zorgtoeslag ook een tegemoetkoming in het verplicht eigen
# risico (Zvw art. 19) en stelt art. 4 de termijn voor de standaardpremie op 22 in plaats van 15 dagen — geen rekenregel veranderde
# (verbatim vergeleken 2026-10-21). Art. 1 lid 1 onder c (verzekerde) noemde in 2017 nog alleen 'artikel 24, eerste lid' van de Zvw.
jaar: 2017
