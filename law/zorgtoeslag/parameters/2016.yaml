# Zorgtoeslag — parameters berekeningsjaar 2016. Elk getal met zijn bron (CHARTER.md P1).
# Bedragen in euro als string, zodat de code met Decimal rekent. Percentages als string, in procenten.
# Artikelnummering van 2016 (gelijk aan 2017 t/m 05-11-2024): de vermogenstoets stond in art. 2a en de woonlandfactor in
# art. 3; het huidige art. 4a lid 3 bestond nog niet (ingevoegd per 06-11-2024).
# Structuur als 2017 t/m 2020: (1) art. 2 had acht leden; lid 5 (oud) ontzegde de zorgtoeslag aan een verzekerde met een partner
# die zijn verzekeringsplicht (Zvw art. 2) niet nakwam; de maandbepaling stond in lid 6 (lid 5 vervallen en lid 6–8 vernummerd
# per 01-01-2021, Stb. 2020, 543, art. III); (2) de vermogenstoets van art. 2a rustte op de *grondslag sparen en beleggen*
# (Wet IB 2001 art. 5.2) met één bedrag, € 82.504; (3) art. 1 lid 1 onder f verwijst naar WML art. 8 lid 1 onderdeel *a*.
# Eigen aan 2016: de percentages van art. 2 lid 3 volgen Stb. 2015, 472, dat voor het berekeningsjaar 2016 de normpercentages
# verlaagde met 0,26 procentpunt (zonder partner: 2,640% → 2,380%) en 0,52 procentpunt (met partner: 5,740% → 5,220%) — de
# 'verlenging van de tijdelijke verhoging van de zorgtoeslag' uit het koopkrachtpakket 2016, alleen voor 2016; het afbouwpercentage
# (13,430%) bleef op zijn schema van +0,03 procentpunt per jaar. De tekst van 2015 (gelezen 2026-10-22): 2,395% / 5,265% / 13,400%.
# Eén tekstversie van de Wzt in 2016: geldend van 01-01-2016 t/m 31-12-2016 (verbatim gelezen 2026-10-22). Art. 1 onder e noemde de
# zorgtoeslag nog alleen een tegemoetkoming in een premie of een bestuursrechtelijke premie (het eigen risico kwam er per 01-07-2017
# bij); art. 4 gaf de minister 15 dagen (22 sinds 01-07-2017); art. 1 lid 1 onder c noemde alleen 'artikel 24, eerste lid' van de Zvw.
jaar: 2016
